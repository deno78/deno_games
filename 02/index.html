<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ホソリス (HOSORIS) with Virtual Pad</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 5px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        h1 {
            margin: 4px 0 2px 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #ffb703;
        }
        .subtitle {
            font-size: 10px;
            color: #888;
            margin-bottom: 6px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            border: 1px solid #333;
            max-width: 100%;
            box-sizing: border-box;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 6px;
        }
        .info-box {
            background: #2a2a2a;
            padding: 3px 6px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #3a3a3a;
            flex: 1;
            margin: 0 2px;
        }
        .info-box h2 {
            font-size: 8px;
            margin: 0 0 2px 0;
            color: #aaa;
        }
        .info-box p {
            font-size: 12px;
            margin: 0;
            font-weight: bold;
            color: #fff;
        }
        .main-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: 2px solid #444;
            background-color: #000;
            display: block;
            max-width: 100%;
            height: auto;
        }
        .btn {
            background-color: #fb8500;
            color: white;
            border: none;
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .btn:hover {
            background-color: #ffb703;
            color: #000;
        }

        /* 仮想パッドがゲーム画面に被らないよう、キャンバスの左右/下部に余白スペース（外側配置）を設けるか、またはオーバーレイをゲーム領域外に配置 */
        .game-layout {
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: flex-start;
            justify-content: center;
        }
        .side-controls {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 400px; /* canvasの高さに合わせる */
        }

        /* スマホ向けの左右セパレート・外側配置コントロール */
        .external-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 320px;
            margin-top: 8px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 38px);
            grid-template-rows: repeat(3, 38px);
            gap: 3px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px;
            border-radius: 10px;
        }
        .d-btn {
            background-color: rgba(255, 255, 255, 0.25);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .d-btn:active {
            background-color: rgba(251, 133, 0, 0.8);
            border-color: #fb8500;
        }
        .btn-up    { grid-column: 2; grid-row: 1; }
        .btn-left  { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down  { grid-column: 2; grid-row: 3; }

        .action-pad {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .action-btn {
            background-color: rgba(255, 183, 3, 0.35);
            color: #fff;
            border: 1px solid rgba(255, 183, 3, 0.6);
            border-radius: 10px;
            padding: 15px 16px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:active {
            background-color: rgba(255, 183, 3, 0.9);
            border-color: #ffb703;
        }
    </style>
</head>
<body>

    <h1>ホソリス</h1>
    <div class="subtitle">〜 幅6マス極細テトリス（スマホ対応） 〜</div>
    <div class="game-container">
        <div class="header-info">
            <div class="info-box">
                <h2>SCORE</h2>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h2>LINES</h2>
                <p id="lines">0</p>
            </div>
            <div class="info-box">
                <h2>LEVEL</h2>
                <p id="level">1</p>
            </div>
        </div>

        <div class="main-area">
            <!-- 幅6マス 6 * 20 = 120px -->
            <canvas id="tetris" width="120" height="400"></canvas>
        </div>

        <!-- ホソリスは幅が狭いため、ゲーム画面の下部にコントロールを独立配置して画面にかからないようにする -->
        <div class="external-controls">
            <div class="d-pad">
                <button class="d-btn btn-up" id="btn-up">▲</button>
                <button class="d-btn btn-left" id="btn-left">◀</button>
                <button class="d-btn btn-right" id="btn-right">▶</button>
                <button class="d-btn btn-down" id="btn-down">▼</button>
            </div>
            <div class="action-pad">
                <button class="action-btn" id="btn-harddrop">⚡ 落下</button>
            </div>
        </div>

        <button class="btn" id="start-btn">START</button>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        const arena = createMatrix(6, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0,
            level: 1,
        };

        const colors = [
            null,
            '#ff0054',
            '#3a86ff',
            '#06d6a0',
            '#ffbe0b',
            '#8338ec',
            '#fb8500',
            '#ff5964',
        ];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 1, 0],
                    [1, 1, 1],
                    [0, 0, 0],
                ];
            } else if (type === 'O') {
                return [
                    [2, 2],
                    [2, 2],
                ];
            } else if (type === 'L') {
                return [
                    [0, 0, 3],
                    [3, 3, 3],
                    [0, 0, 0],
                ];
            } else if (type === 'J') {
                return [
                    [4, 0, 0],
                    [4, 4, 4],
                    [0, 0, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 0, 0, 0],
                    [5, 5, 5, 5],
                    [0, 0, 0, 0],
                    [0, 0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [7, 7, 0],
                    [0, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        context.lineWidth = 0.05;
                        context.strokeStyle = '#000';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }

            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            player.pos.y = 0;
            player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);
            
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.lines = 0;
                player.level = 1;
                updateScore();
                alert('ゲームオーバー！');
            }
        }

        function playerRotate(dir) {
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 100 * player.level;
                player.lines++;
                rowCount *= 2;

                player.level = Math.floor(player.lines / 5) + 1;
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isRunning = false;

        function update(time = 0) {
            if (!isRunning) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval / player.level) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('lines').innerText = player.lines;
            document.getElementById('level').innerText = player.level;
        }

        document.addEventListener('keydown', event => {
            if (!isRunning) return;

            if (event.keyCode === 37) {
                playerMap(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 38) {
                playerRotate(1);
            } else if (event.keyCode === 32) {
                playerHardDrop();
            }
        });

        document.getElementById('btn-left').addEventListener('click', () => { if(isRunning) playerMove(-1); });
        document.getElementById('btn-right').addEventListener('click', () => { if(isRunning) playerMove(1); });
        document.getElementById('btn-up').addEventListener('click', () => { if(isRunning) playerRotate(1); });
        document.getElementById('btn-down').addEventListener('click', () => { if(isRunning) playerDrop(); });
        document.getElementById('btn-harddrop').addEventListener('click', () => { if(isRunning) playerHardDrop(); });

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            updateScore();
            playerReset();
            isRunning = true;
            lastTime = performance.now();
            update();
            startBtn.blur();
        });

        draw();
    </script>
</body>
</html>
