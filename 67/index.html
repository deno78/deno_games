<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ガン詰め将棋</title>
    <style>
        :root {
            --primary: #8b0000;
            --accent: #ff4500;
            --bg: #1a1a1a;
            --panel-bg: rgba(30, 30, 30, 0.95);
            --text: #f0f0f0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 上部・中央：メインゲームエリア（盤面を真ん中にでっかく） */
        .game-pane {
            flex: 1;
            background: #242424;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 { margin: 0; font-size: 2rem; color: #ff7f50; text-shadow: 2px 2px #000; }
        .stage-info { font-size: 1.1rem; color: #aaa; margin-top: 5px; }

        .timer-container {
            width: 400px;
            max-width: 90%;
            margin-bottom: 15px;
        }
        .timer-bar-container {
            width: 100%;
            background: #444;
            height: 14px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #555;
            margin-top: 4px;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ff0000);
            transition: width 0.1s linear;
        }

        .board-container {
            background: #dcb35c;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 5px solid #8b5a2b;
        }
        .board {
            display: grid;
            gap: 3px;
            background: #8b5a2b;
            border: 3px solid #8b5a2b;
        }
        .cell {
            background: #f0d9b5;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 2.2rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            position: relative;
        }
        .cell:hover {
            background: #e4c594;
        }
        .cell.selected {
            background: #b58863 !important;
        }
        .sente {
            color: #111;
        }
        .gote {
            color: #111;
            transform: rotate(180deg);
        }

        .hand-container {
            margin-top: 15px;
            background: #333;
            padding: 8px 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 2px solid #555;
        }
        .hand-title { font-size: 0.95rem; color: #ccc; }
        .hand-pieces { display: flex; gap: 10px; }
        .hand-piece {
            background: #f0d9b5;
            color: #111;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid #8b5a2b;
        }
        .hand-piece.selected {
            background: #b58863;
            color: #fff;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 0.95rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #a52a2a; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        /* 下部：秘書エリア（小さく表示＆右側に吹き出し） */
        .secretary-footer {
            height: 120px;
            background: linear-gradient(180deg, #1f1113 0%, #0d0405 100%);
            border-top: 4px solid var(--primary);
            display: flex;
            align-items: center;
            padding: 0 30px;
            gap: 25px;
            position: relative;
        }

        .secretary-mini-avatar {
            width: 85px;
            height: 85px;
            background: #331a1a;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
            border: 2px solid #ff7f50;
            overflow: hidden;
            flex-shrink: 0;
        }
        /* ミニキャラクターSVG / CSS 表現 */
        .mini-face {
            position: absolute;
            width: 65px;
            height: 70px;
            background: #ffe0d0;
            top: 15px;
            left: 10px;
            border-radius: 32px;
        }
        .mini-hair {
            position: absolute;
            width: 75px;
            height: 40px;
            background: #221100;
            top: 8px;
            left: 5px;
            border-radius: 35px 35px 10px 10px;
        }
        .mini-glasses {
            position: absolute;
            top: 35px;
            left: 14px;
            width: 57px;
            height: 18px;
            border: 2px solid #d4af37;
            border-radius: 4px;
        }

        .speech-bubble {
            background: #fff;
            color: #000;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.15rem;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
            border: 3px solid var(--primary);
            display: flex;
            align-items: center;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 10px 15px 10px 0;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
        }

        /* モーダル */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }
        .modal-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 3px solid var(--primary);
            max-width: 400px;
            width: 90%;
        }
        .modal-content h2 { margin-top: 0; color: #ff7f50; }
        .modal-content p { font-size: 1.1rem; line-height: 1.5; }
    </style>
</head>
<body>

<!-- メインゲームエリア（盤面を真ん中にでっかく） -->
<div class="game-pane">
    <div class="header">
        <h1>ガン詰め将棋</h1>
        <div class="stage-info" id="stage-info">第 1 局 / 全 5 局（3×3 簡単詰将棋）</div>
    </div>

    <div class="timer-container">
        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold;">
            <span>残り時間</span>
            <span id="time-text">10.0s</span>
        </div>
        <div class="timer-bar-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
    </div>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <div class="hand-container" id="hand-container">
        <div class="hand-title">持ち駒:</div>
        <div class="hand-pieces" id="hand-pieces"></div>
    </div>

    <div class="controls">
        <button onclick="resetStage()">盤面リセット</button>
        <button onclick="skipStage()" style="background:#555;">ギブアップ（次の問題）</button>
    </div>
</div>

<!-- 下部：秘書エリア（小さく表示＆右側に吹き出し） -->
<div class="secretary-footer">
    <div class="secretary-mini-avatar">
        <div class="mini-hair"></div>
        <div class="mini-face"></div>
        <div class="mini-glasses"></div>
    </div>
    <div class="speech-bubble" id="speech">
        「……まだですか？ 早くしてくださいよ、遅すぎます。」
    </div>
</div>

<!-- モーダルウィンドウ -->
<div class="modal" id="modal">
    <div class="modal-content" id="modal-content">
        <h2 id="modal-title">クリア！</h2>
        <p id="modal-text">お見事です。</p>
        <button onclick="nextStage()" id="modal-btn" style="margin-top: 15px;">次の局へ</button>
    </div>
</div>

<script>
    const stages = [
        {
            size: 3,
            time: 8.0,
            title: "第 1 局（3×3 初歩の1手詰）",
            board: [
                [null, {p:1, t:'王'}, null],
                [null, null, null],
                [null, {p:0, t:'歩'}, null]
            ],
            hand: [],
            solutions: [
                {from: {r: 2, c: 1}, to: {r: 1, c: 1}}
            ]
        },
        {
            size: 3,
            time: 7.0,
            title: "第 2 局（3×3 持ち駒の歩を打つ）",
            board: [
                [null, {p:1, t:'王'}, null],
                [null, null, null],
                [null, null, null]
            ],
            hand: [{p:0, t:'歩'}],
            solutions: [
                {from: {hand: 0}, to: {r: 0, c: 1}}
            ]
        },
        {
            size: 4,
            time: 9.0,
            title: "第 3 局（4×4 秘書のイライラ増幅）",
            board: [
                [null, {p:1, t:'王'}, null, null],
                [null, null, null, null],
                [null, {p:0, t:'金'}, null, null],
                [null, null, null, null]
            ],
            hand: [{p:0, t:'歩'}],
            solutions: [
                {from: {hand: 0}, to: {r: 0, c: 2}}
            ]
        },
        {
            size: 4,
            time: 8.0,
            title: "第 4 局（4×4 桂馬の跳躍）",
            board: [
                [null, null, {p:1, t:'王'}, null],
                [null, null, null, null],
                [null, null, null, null],
                [null, null, null, null]
            ],
            hand: [{p:0, t:'金'}],
            solutions: [
                {from: {hand: 0}, to: {r: 1, c: 2}}
            ]
        },
        {
            size: 5,
            time: 10.0,
            title: "最終局（5×5 最終試練・完璧な詰め）",
            board: [
                [null, null, {p:1, t:'王'}, null, null],
                [null, null, null, null, null],
                [null, null, {p:0, t:'金'}, null, null],
                [null, null, null, null, null],
                [null, null, null, null, null]
            ],
            hand: [{p:0, t:'金'}],
            solutions: [
                {from: {hand: 0}, to: {r: 1, c: 2}}
            ]
        }
    ];

    let currentStageIndex = 0;
    let boardState = [];
    let handState = [];
    let selectedCell = null;
    let selectedHandIndex = null;
    let timeLeft = 10.0;
    let timerInterval = null;
    let isGameActive = false;
    let lastSpokenTime = 10.0;

    // ガン詰めセリフ集
    const scoldMessages = [
        "「……まだですか？ 早くしてくださいよ、遅すぎます。」",
        "「寝ているんですか？ 脳みそがフリーズしていませんか？」",
        "「私の時給が発生しているの分かってますよね？」",
        "「小学生でも1秒で解けますよ？ その手は何ですか。」",
        "「はあ……。ため息が出ますわ。早く指してください！」",
        "「時間切れが近づいていますよ。無能を発揮しないでください！」",
        "「あなた、そろそろクビにしますよ？」",
        "「盤面を凝視するだけで時間が過ぎていきますね……」"
    ];

    function initGame() {
        currentStageIndex = 0;
        loadStage(currentStageIndex);
    }

    function loadStage(index) {
        if (index >= stages.length) {
            showModal("全ステージクリア！", "お見事です……！ 秘書もあなたを見直したようです（少しだけ）。", "最初から", initGame);
            return;
        }
        const stage = stages[index];
        document.getElementById("stage-info").innerText = `第 ${index + 1} 局 / 全 ${stages.length} 局（${stage.size}×${stage.size} 詰将棋）`;
        
        boardState = JSON.parse(JSON.stringify(stage.board));
        handState = JSON.parse(JSON.stringify(stage.hand));
        timeLeft = stage.time;
        lastSpokenTime = timeLeft;
        isGameActive = true;
        selectedCell = null;
        selectedHandIndex = null;

        updateSpeech("「……まだですか？ 早くしてくださいよ、遅すぎます。」");
        renderBoard();
        renderHand();
        startTimer();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        const stage = stages[currentStageIndex];
        
        timerInterval = setInterval(() => {
            if (!isGameActive) return;
            timeLeft -= 0.1;
            
            if (lastSpokenTime - timeLeft >= 2.5) {
                lastSpokenTime = timeLeft;
                const randomMsg = scoldMessages[Math.floor(Math.random() * scoldMessages.length)];
                updateSpeech(randomMsg);
            }

            if (timeLeft <= 0) {
                timeLeft = 0;
                isGameActive = false;
                clearInterval(timerInterval);
                timeOutAction();
            }
            updateTimerUI();
        }, 100);
    }

    function updateTimerUI() {
        const stage = stages[currentStageIndex];
        const pct = (timeLeft / stage.time) * 100;
        document.getElementById("timer-bar").style.width = pct + "%";
        document.getElementById("time-text").innerText = timeLeft.toFixed(1) + "s";
    }

    function timeOutAction() {
        updateSpeech("「時間切れです！ 役立たずですね！！」");
        showModal("時間切れ（ガン詰め）", "秘書に冷たく見放されてしまいました……。<br>もう一度挑戦してください！", "再挑戦", () => loadStage(currentStageIndex));
    }

    function updateSpeech(text) {
        document.getElementById("speech").innerText = text;
    }

    function renderBoard() {
        const stage = stages[currentStageIndex];
        const boardEl = document.getElementById("board");
        boardEl.style.gridTemplateColumns = `repeat(${stage.size}, 75px)`;
        boardEl.style.gridTemplateRows = `repeat(${stage.size}, 75px)`;
        boardEl.innerHTML = "";

        for (let r = 0; r < stage.size; r++) {
            for (let c = 0; c < stage.size; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.r = r;
                cell.dataset.c = c;

                const piece = boardState[r][c];
                if (piece) {
                    cell.innerText = piece.t;
                    cell.classList.add(piece.p === 0 ? "sente" : "gote");
                }

                if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                    cell.classList.add("selected");
                }

                cell.onclick = () => onCellClick(r, c);
                boardEl.appendChild(cell);
            }
        }
    }

    function renderHand() {
        const handEl = document.getElementById("hand-pieces");
        handEl.innerHTML = "";
        handState.forEach((item, idx) => {
            const el = document.createElement("div");
            el.className = "hand-piece";
            if (selectedHandIndex === idx) el.classList.add("selected");
            el.innerText = item.t;
            el.onclick = () => onHandClick(idx);
            handEl.appendChild(el);
        });
    }

    function onHandClick(idx) {
        if (!isGameActive) return;
        selectedHandIndex = (selectedHandIndex === idx) ? null : idx;
        selectedCell = null;
        renderBoard();
        renderHand();
    }

    function onCellClick(r, c) {
        if (!isGameActive) return;

        if (selectedHandIndex !== null) {
            if (boardState[r][c] === null) {
                const piece = handState[selectedHandIndex];
                boardState[r][c] = { p: piece.p, t: piece.t };
                handState.splice(selectedHandIndex, 1);
                selectedHandIndex = null;
                
                renderBoard();
                renderHand();
                checkMove(null, null, r, c, true);
            } else {
                updateSpeech("「そこには既に駒があります！ 目がついてますか？」");
            }
            return;
        }

        const piece = boardState[r][c];
        if (selectedCell === null) {
            if (piece && piece.p === 0) {
                selectedCell = { r, c };
                renderBoard();
            }
        } else {
            const fromR = selectedCell.r;
            const fromC = selectedCell.c;
            
            boardState[r][c] = boardState[fromR][fromC];
            boardState[fromR][fromC] = null;
            selectedCell = null;
            
            renderBoard();
            renderHand();
            checkMove(fromR, fromC, r, c, false);
        }
    }

    function checkMove(fromR, fromC, r, c, isHand) {
        const stage = stages[currentStageIndex];
        let isCorrect = false;

        stage.solutions.forEach(sol => {
            if (isHand) {
                if (sol.from.hand !== undefined && sol.to.r === r && sol.to.c === c) {
                    isCorrect = true;
                }
            } else {
                if (sol.from.r === fromR && sol.from.c === fromC && sol.to.r === r && sol.to.c === c) {
                    isCorrect = true;
                }
            }
        });

        if (isCorrect) {
            isGameActive = false;
            clearInterval(timerInterval);
            updateSpeech("「……ふん、まあまあですね。次もその調子でどうぞ。」");
            setTimeout(() => {
                showModal("クリア！", "お見事です！ 完璧な一手でした。", "次の局へ", nextStage);
            }, 500);
        } else {
            updateSpeech("「は？ 何ですかそのお粗末な手は！ やり直しです！」");
            setTimeout(() => {
                loadStage(currentStageIndex);
            }, 800);
        }
    }

    function showModal(title, text, btnText, callback) {
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-text").innerHTML = text;
        const btn = document.getElementById("modal-btn");
        btn.innerText = btnText;
        btn.onclick = () => {
            document.getElementById("modal").style.display = "none";
            callback();
        };
        document.getElementById("modal").style.display = "flex";
    }

    function nextStage() {
        document.getElementById("modal").style.display = "none";
        currentStageIndex++;
        loadStage(currentStageIndex);
    }

    function resetStage() {
        loadStage(currentStageIndex);
    }

    function skipStage() {
        isGameActive = false;
        if (timerInterval) clearInterval(timerInterval);
        updateSpeech("「逃げ出しましたね……救いようがありません。」");
        showModal("ギブアップ", "次の問題に進みます。", "次へ", () => {
            currentStageIndex++;
            loadStage(currentStageIndex);
        });
    }

    window.onload = initGame;
</script>

</body>
</html>
