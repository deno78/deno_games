<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ラジオ体操第1シミュレーター</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            overflow: hidden;
        }
        /* Header UI */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            background: rgba(0,0,0,0.5);
            z-index: 10;
            height: 40px;
            font-size: 0.9rem;
        }
        .score-board, .combo-board {
            font-weight: bold;
        }
        .judge-board {
            font-size: 1.1rem;
            font-weight: bold;
            min-width: 90px;
            text-align: center;
            color: #facc15;
        }
        /* Main Stage */
        .stage {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 0;
        }
        canvas {
            background: #1e1b4b;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            border-radius: 8px;
            max-width: 100%;
            max-height: 100%;
        }
        /* Virtual Pads Layout for Horizontal View */
        .pad-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 24px 12px 24px;
            background: rgba(0,0,0,0.6);
            z-index: 10;
            height: 100px;
            width: 100%;
        }
        .pad-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pad-title {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .virtual-pad {
            position: relative;
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .stick {
            position: absolute;
            width: 38px;
            height: 38px;
            background: radial-gradient(circle, #f59e0b, #b45309);
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            pointer-events: none;
            transform: translate(0px, 0px);
        }
        .pad-directions {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .dir-mark {
            position: absolute;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            font-weight: bold;
        }
        .dir-mark.up { top: 3px; left: 50%; transform: translateX(-50%); }
        .dir-mark.down { bottom: 3px; left: 50%; transform: translateX(-50%); }
        .dir-mark.left { left: 4px; top: 50%; transform: translateY(-50%); }
        .dir-mark.right { right: 4px; top: 50%; transform: translateY(-50%); }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 15px;
        }
        .overlay h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }
        .overlay p {
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        .instructions {
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 0.8rem;
            max-width: 360px;
        }
        .instructions ul {
            margin: 0;
            padding-left: 18px;
        }
        .instructions li {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Header -->
    <div class="header">
        <div class="score-board">スコア: <span id="score">0</span></div>
        <div class="judge-board" id="judge-text">READY</div>
        <div class="combo-board">コンボ: <span id="combo">0</span></div>
    </div>

    <!-- Main Stage -->
    <div class="stage">
        <canvas id="canvas" width="500" height="200"></canvas>
    </div>

    <!-- Virtual Pads -->
    <div class="pad-container">
        <div class="pad-wrapper">
            <div class="pad-title">左腕パッド (←↓↑→)</div>
            <div class="virtual-pad" id="pad-left">
                <div class="pad-directions">
                    <span class="dir-mark up">▲</span>
                    <span class="dir-mark down">▼</span>
                    <span class="dir-mark left">◀</span>
                    <span class="dir-mark right">▶</span>
                </div>
                <div class="stick" id="stick-left"></div>
            </div>
        </div>

        <div style="text-align:center;">
            <div style="font-size: 0.8rem; color: #facc15; font-weight: bold;" id="pose-name">ラジオ体操 第1</div>
            <div style="font-size: 0.7rem; color: #94a3b8;" id="song-progress">進行: 0%</div>
        </div>

        <div class="pad-wrapper">
            <div class="pad-title">右腕パッド (←↓↑→)</div>
            <div class="virtual-pad" id="pad-right">
                <div class="pad-directions">
                    <span class="dir-mark up">▲</span>
                    <span class="dir-mark down">▼</span>
                    <span class="dir-mark left">◀</span>
                    <span class="dir-mark right">▶</span>
                </div>
                <div class="stick" id="stick-right"></div>
            </div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
        <h1>ラジオ体操シミュレーター</h1>
        <div class="instructions">
            <ul>
                <li>スマホを横持ちにしてプレイしてください。</li>
                <li>左右のバーチャルパッドをガイドの方向へ動かします。</li>
                <li>タイミング良く合わせて高得点を目指そう！</li>
            </ul>
        </div>
        <button class="btn" id="start-btn">体操をはじめる</button>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="overlay" style="display: none;">
        <h1>体操終了！お疲れ様でした！</h1>
        <p id="result-text">スコア: 0<br>評価: 優秀</p>
        <button class="btn" id="restart-btn">もう一度体操する</button>
    </div>
</div>

<script>
    // Audio synthesizer
    class SoundManager {
        constructor() {
            this.ctx = null;
        }
        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }
        playBeep(freq, duration, type = 'sine') {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e) {}
        }
        playJudge(type) {
            if (type === 'PERFECT') this.playBeep(880, 0.15, 'triangle');
            else if (type === 'GREAT') this.playBeep(660, 0.12, 'sine');
            else if (type === 'GOOD') this.playBeep(440, 0.1, 'sine');
            else if (type === 'MISS') this.playBeep(200, 0.15, 'sawtooth');
        }
    }
    const sound = new SoundManager();

    // Routine choreography
    const routine = [
        { time: 2.0, name: "1. 背伸びの運動", left: 'UP', right: 'UP', desc: "腕を上に大きく伸ばす！" },
        { time: 4.5, name: "1. 背伸びの運動", left: 'DOWN', right: 'DOWN', desc: "腕を下ろす" },
        { time: 7.0, name: "2. 腕を回す運動", left: 'LEFT', right: 'RIGHT', desc: "両腕を横に広げる" },
        { time: 9.5, name: "2. 腕を回す運動", left: 'UP', right: 'UP', desc: "腕を上に回す" },
        { time: 12.0, name: "3. 胸を反らす運動", left: 'UP', right: 'UP', desc: "胸を反らして上を向く" },
        { time: 14.5, name: "3. 胸を反らす運動", left: 'DOWN', right: 'DOWN', desc: "元に戻す" },
        { time: 17.0, name: "4. 体を回す運動", left: 'LEFT', right: 'LEFT', desc: "左へ体をひねる" },
        { time: 19.5, name: "4. 体を回す運動", left: 'RIGHT', right: 'RIGHT', desc: "右へ体をひねる" },
        { time: 22.0, name: "5. 前屈の運動", left: 'DOWN', right: 'DOWN', desc: "大きく前屈！" },
        { time: 24.5, name: "5. 前屈の運動", left: 'UP', right: 'UP', desc: "上体を起こす" },
        { time: 27.0, name: "6. 体を前後に曲げる運動", left: 'UP', right: 'UP', desc: "上体を後ろに反らす" },
        { time: 29.5, name: "6. 体を前後に曲げる運動", left: 'DOWN', right: 'DOWN', desc: "前に曲げる" },
        { time: 32.0, name: "7. 腕を振る運動", left: 'LEFT', right: 'RIGHT', desc: "腕を左右に振る" },
        { time: 34.5, name: "7. 腕を振る運動", left: 'RIGHT', right: 'LEFT', desc: "クロスして振る" },
        { time: 37.0, name: "8. 深呼吸", left: 'UP', right: 'UP', desc: "大きく息を吸って背伸び" },
        { time: 40.0, name: "8. 深呼吸", left: 'DOWN', right: 'DOWN', desc: "息を吐いてリラックス" }
    ];

    const totalDuration = 44.0;

    let gameState = 'START';
    let startTime = 0;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let currentRoutineIndex = 0;
    let currentJudge = '';
    let judgeTimer = 0;

    // Input states with persistent touch tracking by identifier
    const input = {
        left: { dir: 'NEUTRAL', touchId: null },
        right: { dir: 'NEUTRAL', touchId: null }
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth - 16;
        canvas.height = container.clientHeight - 10;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Reliable Touch/Pointer handling across mobile browsers
    function setupPad(padId, stickId, side) {
        const pad = document.getElementById(padId);
        const stick = document.getElementById(stickId);

        function processMove(clientX, clientY) {
            const rect = pad.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = rect.width / 2 - 12;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;

            const threshold = 12;
            let dir = 'NEUTRAL';
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > threshold) dir = 'RIGHT';
                else if (dx < -threshold) dir = 'LEFT';
            } else {
                if (dy > threshold) dir = 'DOWN';
                else if (dy < -threshold) dir = 'UP';
            }
            input[side].dir = dir;
        }

        function resetStick() {
            stick.style.transform = `translate(0px, 0px)`;
            input[side].dir = 'NEUTRAL';
            input[side].touchId = null;
        }

        pad.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (input[side].touchId === null) {
                    input[side].touchId = touch.identifier;
                    processMove(touch.clientX, touch.clientY);
                }
            }
        }, { passive: false });

        pad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === input[side].touchId) {
                    processMove(touch.clientX, touch.clientY);
                }
            }
        }, { passive: false });

        pad.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === input[side].touchId) {
                    resetStick();
                }
            }
        }, { passive: false });

        pad.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            resetStick();
        });

        // Mouse fallback for testing on desktop
        pad.addEventListener('mousedown', (e) => {
            input[side].touchId = 'mouse';
            processMove(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (input[side].touchId === 'mouse') {
                processMove(e.clientX, e.clientY);
            }
        });
        window.addEventListener('mouseup', () => {
            if (input[side].touchId === 'mouse') {
                resetStick();
            }
        });
    }

    setupPad('pad-left', 'stick-left', 'left');
    setupPad('pad-right', 'stick-right', 'right');

    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const judgeEl = document.getElementById('judge-text');
    const poseNameEl = document.getElementById('pose-name');
    const songProgressEl = document.getElementById('song-progress');
    const startOverlay = document.getElementById('start-overlay');
    const resultOverlay = document.getElementById('result-overlay');
    const resultText = document.getElementById('result-text');

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function startGame() {
        sound.init();
        startOverlay.style.display = 'none';
        resultOverlay.style.display = 'none';
        score = 0;
        combo = 0;
        maxCombo = 0;
        currentRoutineIndex = 0;
        startTime = performance.now();
        gameState = 'PLAYING';
        updateUI();
    }

    function updateUI() {
        scoreEl.innerText = score;
        comboEl.innerText = combo;
    }

    function showJudge(text) {
        currentJudge = text;
        judgeTimer = 25;
        judgeEl.innerText = text;
        if (text === 'PERFECT') judgeEl.style.color = '#facc15';
        else if (text === 'GREAT') judgeEl.style.color = '#4ade80';
        else if (text === 'GOOD') judgeEl.style.color = '#60a5fa';
        else if (text === 'MISS') judgeEl.style.color = '#f87171';
    }

    function loop() {
        if (gameState === 'PLAYING') {
            const now = performance.now();
            const elapsed = (now - startTime) / 1000;
            const progress = Math.min(100, (elapsed / totalDuration) * 100);
            songProgressEl.innerText = `進行: ${progress.toFixed(0)}%`;

            if (currentRoutineIndex < routine.length) {
                const currentAction = routine[currentRoutineIndex];
                poseNameEl.innerText = currentAction.name;

                const timeDiff = elapsed - currentAction.time;

                if (timeDiff > 0.6) {
                    showJudge('MISS');
                    sound.playJudge('MISS');
                    combo = 0;
                    currentRoutineIndex++;
                } else if (Math.abs(timeDiff) <= 0.6) {
                    const leftMatch = (input.left.dir === currentAction.left);
                    const rightMatch = (input.right.dir === currentAction.right);

                    if (leftMatch && rightMatch) {
                        let judge = 'GOOD';
                        let pts = 100;
                        if (Math.abs(timeDiff) <= 0.2) {
                            judge = 'PERFECT';
                            pts = 300;
                        } else if (Math.abs(timeDiff) <= 0.4) {
                            judge = 'GREAT';
                            pts = 200;
                        }

                        showJudge(judge);
                        sound.playJudge(judge);
                        score += pts + (combo * 10);
                        combo++;
                        if (combo > maxCombo) maxCombo = combo;
                        currentRoutineIndex++;
                    }
                }
            } else if (elapsed >= totalDuration) {
                endGame();
            }

            updateUI();
        }

        render();

        if (judgeTimer > 0) {
            judgeTimer--;
            if (judgeTimer === 0) judgeEl.innerText = '';
        }

        requestAnimationFrame(loop);
    }

    function endGame() {
        gameState = 'RESULT';
        resultOverlay.style.display = 'flex';
        let rank = '皆勤賞！パーフェクト！';
        if (score < 2000) rank = 'もう少しがんばりましょう！';
        else if (score < 4000) rank = 'なかなかの健康体！';
        else if (score < 6000) rank = '素晴らしい柔軟性！';

        resultText.innerHTML = `最終スコア: ${score}<br>最大コンボ: ${maxCombo}<br><br><b>${rank}</b>`;
    }

    function getDirSymbol(dir) {
        switch(dir) {
            case 'UP': return '▲';
            case 'DOWN': return '▼';
            case 'LEFT': return '◀';
            case 'RIGHT': return '▶';
            default: return '・';
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + 5;

        // Background
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Floor
        ctx.strokeStyle = '#4338ca';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, cy + 65);
        ctx.lineTo(canvas.width, cy + 65);
        ctx.stroke();

        // Guide instructions
        if (gameState === 'PLAYING' && currentRoutineIndex < routine.length) {
            const action = routine[currentRoutineIndex];
            
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(action.desc, cx, 25);

            ctx.fillStyle = '#fff';
            ctx.font = '13px sans-serif';
            ctx.fillText(`左: [ ${getDirSymbol(action.left)} ]  /  右: [ ${getDirSymbol(action.right)} ]`, cx, 45);

            const elapsed = (performance.now() - startTime) / 1000;
            const timeToTarget = action.time - elapsed;
            
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(cx - 80, 55, 160, 6);

            if (timeToTarget >= -0.6 && timeToTarget <= 2.0) {
                const barX = cx + (timeToTarget * 70);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(barX - 3, 53, 6, 10);
            }
        }

        // Stickman
        const time = performance.now() / 200;
        const bounce = gameState === 'PLAYING' ? Math.sin(time * 2) * 2 : 0;

        // Head
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy - 30 + bounce, 14, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047';
        ctx.fill();
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(cx, cy - 16 + bounce);
        ctx.lineTo(cx, cy + 25 + bounce);
        ctx.stroke();

        // Legs
        const legAnim = gameState === 'PLAYING' ? Math.sin(time * 4) * 12 : 0;
        ctx.beginPath();
        ctx.moveTo(cx, cy + 25 + bounce);
        ctx.lineTo(cx - 15 + legAnim, cy + 60);
        ctx.moveTo(cx, cy + 25 + bounce);
        ctx.lineTo(cx + 15 - legAnim, cy + 60);
        ctx.stroke();

        // Arms
        let leftArmAngle = -Math.PI / 4;
        let rightArmAngle = -Math.PI * 3 / 4;

        if (input.left.dir === 'UP') leftArmAngle = -Math.PI / 2;
        if (input.left.dir === 'DOWN') leftArmAngle = Math.PI / 4;
        if (input.left.dir === 'LEFT') leftArmAngle = -Math.PI;
        if (input.left.dir === 'RIGHT') leftArmAngle = 0;

        if (input.right.dir === 'UP') rightArmAngle = -Math.PI / 2;
        if (input.right.dir === 'DOWN') rightArmAngle = Math.PI * 3 / 4;
        if (input.right.dir === 'LEFT') rightArmAngle = -Math.PI;
        if (input.right.dir === 'RIGHT') rightArmAngle = 0;

        const armLength = 32;
        const shoulderY = cy - 12 + bounce;

        // Left arm
        const handLX = cx + Math.cos(leftArmAngle) * armLength;
        const handLY = shoulderY + Math.sin(leftArmAngle) * armLength;
        ctx.beginPath();
        ctx.moveTo(cx, shoulderY);
        ctx.lineTo(handLX, handLY);
        ctx.stroke();

        // Right arm
        const handRX = cx + Math.cos(rightArmAngle) * armLength;
        const handRY = shoulderY + Math.sin(rightArmAngle) * armLength;
        ctx.beginPath();
        ctx.moveTo(cx, shoulderY);
        ctx.lineTo(handRX, handRY);
        ctx.stroke();
    }

    render();
</script>

</body>
</html>
