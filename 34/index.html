<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ディスク デフラグ (Windows 98 Style Game)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #008080; /* Windows 98 デスクトップ Teal */
            font-family: "MS Gothic", "Osaka", monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Win98 Window Frame */
        .win-window {
            background-color: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            width: 740px;
            max-width: 100%;
        }
        .win-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            padding: 4px 6px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .win-titlebar-buttons {
            display: flex;
            gap: 2px;
        }
        .win-btn {
            background-color: #c0c0c0;
            border-top: 1px solid #dfdfdf;
            border-left: 1px solid #dfdfdf;
            border-right: 1px solid #404040;
            border-bottom: 1px solid #404040;
            width: 16px;
            height: 14px;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #000;
        }
        .win-btn:active {
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding-top: 1px;
            padding-left: 1px;
        }
        .win-menubar {
            background-color: #c0c0c0;
            padding: 2px 4px;
            font-size: 12px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #808080;
        }
        .win-menubar span {
            cursor: pointer;
            padding: 1px 4px;
        }
        .win-menubar span:hover {
            background-color: #000080;
            color: #fff;
        }
        .win-body {
            padding: 10px;
        }
        /* Drive info section */
        .drive-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .drive-select {
            font-family: "MS Gothic", monospace;
            font-size: 12px;
            padding: 2px 5px;
            background: #fff;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
        }
        /* Status panel (Win98 sunken box) */
        .sunken-box {
            background-color: #ffffff;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        /* Sector Grid Map */
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            gap: 1px;
            background-color: #808080;
            border: 1px solid #404040;
            padding: 2px;
            margin-bottom: 10px;
            max-height: 260px;
            overflow-y: auto;
        }
        .sector {
            aspect-ratio: 1;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            position: relative;
        }
        /* Block types */
        .sec-free { background-color: #ffffff; } /* 空白 (3) */
        .sec-fixed { background-color: #cc0000; } /* 動かせないブロック (1): 赤 */
        .sec-data-light { background-color: #add8e6; } /* 動かせるブロック (6): 薄い水色 */
        .sec-data-dark { background-color: #1e90ff; } /* カーソルより後ろの動かせるブロック (6): 濃い水色 */
        .sec-bad { background-color: #ff0000; animation: blink 0.4s infinite alternate; } /* セクター不良: 赤点滅 */
        
        /* Cursor (thick distinct frame) */
        .sector.cursor {
            outline: 3px solid #ff00ff;
            outline-offset: -1px;
            z-index: 10;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        @keyframes pulse-red {
            0% { color: red; transform: scale(1); }
            50% { color: darkred; transform: scale(1.2); }
            100% { color: red; transform: scale(1); }
        }
        .bad-pulse {
            animation: pulse-red 0.4s ease;
        }

        /* Legend */
        .legend-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 11px;
            margin-bottom: 10px;
            align-items: center;
            background: #c0c0c0;
            padding: 5px;
            border-top: 1px solid #dfdfdf;
            border-left: 1px solid #dfdfdf;
            border-right: 1px solid #404040;
            border-bottom: 1px solid #404040;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-box {
            width: 12px;
            height: 12px;
            border: 1px solid #000;
        }

        /* Action buttons panel */
        .action-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #c0c0c0;
            padding-top: 5px;
        }
        .stats-display {
            font-size: 11px;
            line-height: 1.4;
        }
        .button-group {
            display: flex;
            gap: 12px;
        }
        /* 2倍くらいのサイズにしたボタン */
        .win-button-large {
            font-family: "MS Gothic", monospace;
            font-size: 16px;
            padding: 12px 28px;
            background-color: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            cursor: pointer;
            font-weight: bold;
        }
        .win-button-large:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #dfdfdf;
            border-bottom: 2px solid #dfdfdf;
            padding: 13px 27px 11px 29px;
        }
        .win-button-large:disabled {
            color: #808080;
            cursor: not-allowed;
        }

        .win-button-normal {
            font-family: "MS Gothic", monospace;
            font-size: 12px;
            padding: 4px 10px;
            background-color: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal Dialog */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-window {
            background-color: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            width: 420px;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.6);
        }
        .modal-body {
            padding: 15px;
            font-size: 12px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .modal-footer {
            padding: 10px;
            background-color: #c0c0c0;
            display: flex;
            justify-content: center;
            border-top: 1px solid #808080;
        }
    </style>
</head>
<body>

<div class="win-window">
    <div class="win-titlebar">
        <span>デフラグ - [C: ローカル ディスク]</span>
        <div class="win-titlebar-buttons">
            <div class="win-btn">_</div>
            <div class="win-btn">□</div>
            <div class="win-btn" onclick="location.reload()">×</div>
        </div>
    </div>
    <div class="win-menubar">
        <span>ファイル(F)</span>
        <span>ドライブ(D)</span>
        <span>分析(A)</span>
        <span>オプション(O)</span>
        <span>ヘルプ(H)</span>
    </div>
    <div class="win-body">
        <div class="drive-header">
            <span>ドライブの選択:</span>
            <select class="drive-select" id="driveSelect" onchange="resetGame()">
                <option value="C">3.5 インチ フロッピー (A:)</option>
                <option value="C" selected>ローカル ディスク (C:)</option>
                <option value="D">バックアップ (D:)</option>
            </select>
            <button class="win-button-normal" onclick="resetGame()">再分析</button>
        </div>

        <div class="sunken-box" id="statusText">
            状態: カーソルが左上端にあります。「詰める」または「進める」を押してください。
        </div>

        <!-- Sector Map Grid -->
        <div class="sector-grid" id="sectorGrid"></div>

        <!-- Legend -->
        <div class="legend-container">
            <div class="legend-item"><div class="legend-box sec-free"></div><span>空白 (3)</span></div>
            <div class="legend-item"><div class="legend-box sec-data-light"></div><span>動かせるブロック (6:薄水色)</span></div>
            <div class="legend-item"><div class="legend-box sec-data-dark"></div><span>処理済ブロック (6:濃水色)</span></div>
            <div class="legend-item"><div class="legend-box sec-fixed"></div><span>動かせないブロック (1:赤)</span></div>
            <div class="legend-item"><div class="legend-box sec-bad"></div><span>不良セクター (赤点滅)</span></div>
        </div>

        <!-- Action Panel -->
        <div class="action-panel">
            <div class="stats-display" id="statsDisplay">
                セクター不良: <span id="badCount" style="color:red; font-weight:bold;">0</span> 個<br>
                中間の空白ブロック: <span id="fragmentCount" style="font-weight:bold;">0</span> 個<br>
                最適化率: <span id="optRate" style="font-weight:bold;">0</span>%
            </div>
            <div class="button-group">
                <button class="win-button-large" id="btnCompact" onclick="actionCompact()">詰める</button>
                <button class="win-button-large" id="btnAdvance" onclick="actionAdvance()">進める</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-window">
        <div class="win-titlebar" id="modalTitle">ディスク デフラグ</div>
        <div class="modal-body">
            <div style="font-size: 24px;">ℹ️</div>
            <div>
                <div id="modalMessage" style="font-weight: bold; margin-bottom: 8px;">メッセージ</div>
                <div id="modalSubMessage" style="color: #404040;">サブメッセージ</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="win-button-normal" style="width: 80px;" onclick="closeModal()">OK</button>
        </div>
    </div>
</div>

<script>
    const COLS = 32;
    const ROWS = 10;
    const TOTAL_CELLS = COLS * ROWS;
    
    let grid = []; 
    let cursorIndex = 0; 
    let badSectorsCount = 0;
    let isGameOver = false;

    function initGame() {
        grid = [];
        badSectorsCount = 0;
        cursorIndex = 0;
        isGameOver = false;

        document.getElementById("btnCompact").disabled = false;
        document.getElementById("btnAdvance").disabled = false;

        // 存在比率: 1 (動かせないブロック/赤): 25%, 6 (動かせるブロック/水色): 45%, 3 (空白): 30%
        for (let i = 0; i < TOTAL_CELLS; i++) {
            let rand = Math.random();
            if (i < 15) {
                grid.push(1);
            } else if (rand < 0.25) {
                grid.push(1);
            } else if (rand < 0.70) {
                grid.push(6);
            } else {
                grid.push(3);
            }
        }

        renderGrid();
        updateStats();
        updateStatusText();
    }

    function renderGrid() {
        const container = document.getElementById("sectorGrid");
        container.innerHTML = "";

        for (let i = 0; i < TOTAL_CELLS; i++) {
            const cell = document.createElement("div");
            cell.className = "sector";
            
            const val = grid[i];
            if (val === 3) {
                cell.classList.add("sec-free");
            } else if (val === 6) {
                // カーソルより後ろ（インデックスが小さい位置）は濃い水色、それ以降は薄い水色
                if (i < cursorIndex) {
                    cell.classList.add("sec-data-dark");
                } else {
                    cell.classList.add("sec-data-light");
                }
            } else if (val === 1) {
                cell.classList.add("sec-fixed");
            } else if (val === 9) {
                cell.classList.add("sec-bad");
            }

            // 現在のカーソル位置は太枠
            if (i === cursorIndex && !isGameOver) {
                cell.classList.add("cursor");
            }

            container.appendChild(cell);
        }
    }

    function updateStatusText() {
        if (isGameOver) return;
        let val = grid[cursorIndex];
        let typeStr = "";
        if (val === 3) typeStr = "空白ブロック (3)";
        else if (val === 6) typeStr = "動かせるブロック (6)";
        else if (val === 1) typeStr = "動かせないブロック (1)";
        else if (val === 9) typeStr = "不良セクター (9)";

        let row = Math.floor(cursorIndex / COLS) + 1;
        let col = (cursorIndex % COLS) + 1;
        document.getElementById("statusText").innerText = `カーソル位置 [行:${row}, 列:${col}] : ${typeStr}`;
    }

    function advanceCursor() {
        cursorIndex++;
        if (cursorIndex >= TOTAL_CELLS) {
            // 末尾到達：ゲーム終了
            cursorIndex = TOTAL_CELLS - 1;
            isGameOver = true;
            triggerEndGame();
        }
    }

    // 「詰める」ボタン
    function actionCompact() {
        if (isGameOver) return;
        let val = grid[cursorIndex];

        if (val === 3) {
            let moved = false;
            for (let i = cursorIndex + 1; i < TOTAL_CELLS; i++) {
                if (grid[i] === 6) {
                    grid[cursorIndex] = 6;
                    grid[i] = 3;
                    moved = true;
                    break;
                }
            }
            if (moved) playSoundEffect("compact");
            else playSoundEffect("noop");
        } else if (val === 6) {
            playSoundEffect("noop");
        } else if (val === 1) {
            // 動かせないブロックで詰める：不良セクター増加、ポップアップなしでカウンター点滅
            badSectorsCount++;
            grid[cursorIndex] = 9;
            playSoundEffect("error");
            pulseBadCount();
            document.getElementById("statusText").innerText = "⚠️ 警告: 動かせないブロックで詰めたため不良セクターが発生しました！";
        } else if (val === 9) {
            playSoundEffect("noop");
        }

        advanceCursor();
        renderGrid();
        updateStats();
        updateStatusText();
    }

    // 「進める」ボタン
    function actionAdvance() {
        if (isGameOver) return;
        let val = grid[cursorIndex];
        if (val === 3) {
            for (let i = cursorIndex + 1; i < TOTAL_CELLS; i++) {
                if (grid[i] === 6) {
                    grid[cursorIndex] = 6;
                    grid[i] = 3;
                    break;
                }
            }
        }
        playSoundEffect("advance");

        advanceCursor();
        renderGrid();
        updateStats();
        updateStatusText();
    }

    function pulseBadCount() {
        const span = document.getElementById("badCount");
        span.innerText = badSectorsCount;
        span.classList.add("bad-pulse");
        setTimeout(() => {
            span.classList.remove("bad-pulse");
        }, 400);
    }

    function calculateFragments() {
        let fragments = 0;
        let firstData = -1;
        let lastData = -1;

        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i] === 6 || grid[i] === 1) {
                if (firstData === -1) firstData = i;
                lastData = i;
            }
        }

        if (firstData !== -1 && lastData !== -1) {
            for (let i = firstData; i <= lastData; i++) {
                if (grid[i] === 3) {
                    fragments++;
                }
            }
        }
        return fragments;
    }

    function updateStats() {
        let frags = calculateFragments();
        document.getElementById("badCount").innerText = badSectorsCount;
        document.getElementById("fragmentCount").innerText = frags;

        let maxFrags = Math.max(1, TOTAL_CELLS / 2);
        let opt = Math.max(0, Math.min(100, Math.floor(100 - (frags / maxFrags) * 100 - (badSectorsCount * 5))));
        if (frags === 0 && badSectorsCount === 0) opt = 100;
        
        document.getElementById("optRate").innerText = opt;
    }

    function triggerEndGame() {
        document.getElementById("btnCompact").disabled = true;
        document.getElementById("btnAdvance").disabled = true;

        let frags = calculateFragments();
        let opt = document.getElementById("optRate").innerText;
        
        let rank = "S";
        if (badSectorsCount > 3 || frags > 30) rank = "D";
        else if (badSectorsCount > 1 || frags > 15) rank = "C";
        else if (frags > 5) rank = "B";
        else if (frags > 0) rank = "A";

        let msg = `カーソルが画面末尾に到達しました。デフラグ終了です。\n\n` +
                  `【結果レポート】\n` +
                  `・セクター不良: ${badSectorsCount} 個\n` +
                  `・中間の空白ブロック: ${frags} 個\n` +
                  `・最適化率: ${opt}%\n` +
                  `・総合評価: 【 ${rank} ランク 】\n\n`;

        if (rank === "S" || rank === "A") {
            msg += "素晴らしいデフラグ捌きです！お見事！";
        } else {
            msg += "システム領域に干渉して不良セクターが発生してしまいました。";
        }

        document.getElementById("statusText").innerText = `状態: デフラグ終了 (評価: ${rank})`;
        showModal("デフラグ終了", msg);
    }

    function resetGame() {
        initGame();
    }

    function showModal(title, message) {
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalMessage").innerText = message;
        document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modalOverlay").style.display = "none";
    }

    function playSoundEffect(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === "compact") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } else if (type === "noop") {
                osc.type = "square";
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === "error") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.setValueAtTime(80, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === "advance") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            }
        } catch (e) {}
    }

    window.onload = initGame;
</script>

</body>
</html>
