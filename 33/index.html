<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>木戸に立てかけし衣食住 - レトロ接客営業ゲーム</title>
    <style>

            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

            margin: 0;
            padding: 0;

            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace, sans-serif;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 720px;
            background: #1e1e2f;
            border: 3px solid #4a4a75;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* ヘッダー */
        .header {
            background: #2a2a48;
            border-bottom: 2px solid #4a4a75;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .stats {
            display: flex;
            gap: 12px;
        }
        .stat-item span {
            color: #ffd700;
            font-weight: bold;
        }
        .danger-stat span {
            color: #ff5555;
        }

        /* メインビュー (お客様と店舗) */
        .store-view {
            flex: 1;
            background: linear-gradient(to bottom, #2d2d44 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            position: relative;
            min-height: 0;
        }
        .customer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .customer-sprite {
            width: 64px;
            height: 64px;
            background: #33334d;
            border: 2px solid #7a7ac9;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .customer-sprite.shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .customer-info {
            margin-top: 4px;
            text-align: center;
        }
        .customer-name {
            font-size: 13px;
            color: #aaccff;
            font-weight: bold;
        }
        
        /* 吹き出しウィンドウ */
        .dialogue-box {
            background: #0d0d1a;
            border: 2px solid #7a7ac9;
            border-radius: 5px;
            padding: 8px 10px;
            width: 100%;
            min-height: 65px;
            max-height: 85px;
            overflow-y: auto;
            font-size: 11.5px;
            line-height: 1.35;
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            margin: 4px 0;
        }
        .dialogue-box .speaker-you {
            color: #aaffaa;
            font-weight: bold;
        }
        .dialogue-box .speaker-customer {
            color: #ffaa66;
            font-weight: bold;
        }

        /* 11個の話題ボタンエリア */
        .topics-panel {
            background: #151522;
            border-top: 2px solid #4a4a75;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .topic-btn {
            background: #2b2b48;
            border: 2px solid #5c5cc9;
            color: #ffffff;
            padding: 6px 2px;
            font-size: 11px;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.1s;
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .topic-btn:active {
            transform: scale(0.95);
            background: #41417a;
        }
        .topic-btn .key-label {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
        }
        .topic-btn .desc-label {
            font-size: 9.5px;
            color: #ccc;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #12121acc;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .screen.hidden {
            display: none;
        }
        h1 {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 8px;
            text-shadow: 2px 2px #333;
        }
        p {
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #d0d0ff;
        }
        .btn {
            background: #4a4ae6;
            border: 2px solid #8080ff;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 5px;

        #msg-overlay {

            left: 50%;

            font-weight: bold;
            color: #ffd700;

            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
        }
        #msg-overlay.show {
            opacity: 1;
            transform: translate(-50%, -60%);
        }
    </style>
</head>

    // お客様のバリエーション
    const CUSTOMER_PROFILES = [
        { name: 'サラリーマン田中', avatar: '👔', moods: ['ふむふむ...', 'なるほど。', 'おや？'] },
        { name: '主婦の佐藤さん', avatar: '👜', moods: ['こんにちは。', 'そうなのよ。', 'まあ！'] },

        { name: '頑固な渡辺爺さん', avatar: '👴', moods: ['むぅ。', 'なんだと。', 'ほう……'] },

    // ゲーム状態
    let gameState = {
        difficulty: 'normal',
        mineCount: 5,
        score: 0,
        miss: 0,
        currentCustomer: null,
        mineTopics: [],
        isAnimating: false
    };

    // DOM要素
    const titleScreen = document.getElementById('title-screen');
    const difficultyScreen = document.getElementById('difficulty-screen');
    const resultScreen = document.getElementById('result-screen');
    const topicsPanel = document.getElementById('topics-panel');
    const scoreVal = document.getElementById('score-val');
    const missVal = document.getElementById('miss-val');
    const customerAvatar = document.getElementById('customer-avatar');
    const customerName = document.getElementById('customer-name');

    const resultDesc = document.getElementById('result-desc');

    // Web Audio API サウンド効果
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'angry') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.6);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'clear') {
                osc.type = 'square';
                const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + idx * 0.08);
                    g.gain.setValueAtTime(0.1, now + idx * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                    o.start(now + idx * 0.08);
                    o.stop(now + idx * 0.08 + 0.15);
                });
            }
        } catch (e) {
            console.error(e);
        }
    }

        playSound('click');
        gameState.difficulty = diff;
        if (diff === 'easy') gameState.mineCount = 3;
        else if (diff === 'normal') gameState.mineCount = 5;
        else if (diff === 'hard') gameState.mineCount = 7;

        gameState.score = 0;
        gameState.miss = 0;
        updateStats();

        difficultyScreen.classList.add('hidden');
        initTopicsUI();
        nextCustomer();
    }

    // 話題ボタンの初期化
    function initTopicsUI() {
        topicsPanel.innerHTML = '';
        TOPICS.forEach((topic) => {
            const btn = document.createElement('button');
            btn.className = 'topic-btn';
            btn.innerHTML = `
                <span class="key-label">${topic.name.split(' ')[0]}</span>
                <span class="desc-label">${topic.name}</span>
            `;
            btn.onclick = () => selectTopic(topic.id);
            topicsPanel.appendChild(btn);
        });
    }

    // 次のお客様を生成
    function nextCustomer() {
        const profile = CUSTOMER_PROFILES[Math.floor(Math.random() * CUSTOMER_PROFILES.length)];
        gameState.currentCustomer = profile;
        customerAvatar.textContent = profile.avatar;
        customerName.textContent = profile.name;

        // このお客様の地雷話題をランダムに mineCount 個決定
        let shuffled = [...TOPICS].sort(() => 0.5 - Math.random());
        gameState.mineTopics = shuffled.slice(0, gameState.mineCount).map(t => t.id);

        const mood = profile.moods[Math.floor(Math.random() * profile.moods.length)];
        dialogueText.innerHTML = `<strong>${profile.name}</strong>「${mood}」<br><span style="color:#aaa; font-size:10.5px;">（木戸に立てかけし衣食住から話題を選んでください）</span>`;
    }

    // 話題を選んだときの処理
    function selectTopic(topicId) {
        if (gameState.isAnimating) return;
        playSound('click');
        
        const isMine = gameState.mineTopics.includes(topicId);
        const selectedTopic = TOPICS.find(t => t.id === topicId);
        const customer = gameState.currentCustomer;

        gameState.isAnimating = true;

        // 5つのセリフからランダムに1つ選択
        const randomPhrase = selectedTopic.phrases[Math.floor(Math.random() * selectedTopic.phrases.length)];

        // まず営業マン（プレイヤー）が喋る内容を表示
        dialogueText.innerHTML = `<span class="speaker-you">あなた：</span>${randomPhrase}`;

        setTimeout(() => {
            if (isMine) {
                // 地雷を踏んだ！ 怒る
                playSound('angry');
                customerAvatar.classList.add('shake');
                dialogueText.innerHTML += `<br><span class="speaker-customer">${customer.name}：</span>「なんだって！？その【${selectedTopic.name}】の話は……失礼な！もう帰る！」<br><span style="color:#ff5555; font-weight:bold;">➡ 怒らせてしまった……！</span>`;
                
                showOverlay('激怒！ (-1)', '#ff5555');
                gameState.miss++;
                updateStats();

                setTimeout(() => {
                    customerAvatar.classList.remove('shake');
                    checkGameStatus();
                }, 1800);

            } else {
                // セーフ！ 成功
                playSound('success');
                dialogueText.innerHTML += `<br><span class="speaker-customer">${customer.name}：</span>「ほう、【${selectedTopic.name}】ですか。面白いですね、詳しく聞かせてください！」<br><span style="color:#55ff55; font-weight:bold;">➡ 接客大成功！</span>`;

                showOverlay('大成功！ (+1)', '#ffd700');
                gameState.score++;
                updateStats();

                setTimeout(() => {
                    checkGameStatus();
                }, 1800);
            }
        }, 900);
    }

    function showOverlay(text, color) {
        msgOverlay.textContent = text;
        msgOverlay.style.color = color;
        msgOverlay.classList.add('show');
        setTimeout(() => {
            msgOverlay.classList.remove('show');
        }, 1100);
    }

    function updateStats() {
        scoreVal.textContent = gameState.score;
        missVal.textContent = gameState.miss;
    }

    function checkGameStatus() {
        gameState.isAnimating = false;
        if (gameState.score >= 10) {
            // ゲームクリア
            playSound('clear');
            resultTitle.textContent = 'ゲームクリア！';
            resultTitle.style.color = '#55ff55';
            resultDesc.innerHTML = `お見事です！10人の接客を華麗に成功させました！<br>難易度: <strong>${gameState.difficulty.toUpperCase()}</strong>`;
            resultScreen.classList.remove('hidden');
        } else if (gameState.miss >= 3) {
            // ゲームオーバー
            playSound('gameover');
            resultTitle.textContent = 'ゲームオーバー';
            resultTitle.style.color = '#ff5555';
            resultDesc.innerHTML = `3人のお客様を怒らせてしまいました……。<br>営業成績は振るわず、お店はピンチです。`;
            resultScreen.classList.remove('hidden');
        } else {
            nextCustomer();
        }
    }
</script>

</body>
</html>
