<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三重長の野望</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 800px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 20px 20px 0 0;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        
        .status-area {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .status-item {
            text-align: center;
            min-width: 80px;
        }
        
        .status-label {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .question-area {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .character-display {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .character-portrait {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            margin: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .character-info h2 {
            margin: 0;
            font-size: 1.8em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .character-info p {
            margin: 5px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .question-text {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .year-display {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .year-display .year-label {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        
        .year-display .year-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option-btn {
            background: white;
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover:not(:disabled) {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .option-btn.selected {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        .option-btn.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
            animation: pulse 0.5s ease;
        }
        
        .option-btn.incorrect {
            background: #e74c3c;
            border-color: #c0392b;
            color: white;
            animation: shake 0.3s ease;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .feedback-area {
            min-height: 60px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .feedback-area.show {
            opacity: 1;
        }
        
        .feedback-correct {
            background: #d5f4e6;
            color: #27ae60;
            border: 2px solid #2ecc71;
        }
        
        .feedback-incorrect {
            background: #fadbd8;
            color: #c0392b;
            border: 2px solid #e74c3c;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn.restart {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        
        .result-screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .result-message {
            font-size: 1.3em;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #e8f4f8;
            border-left: 5px solid #3498db;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            border-radius: 50%;
            animation: confettiRain 3s infinite linear;
            opacity: 0;
        }
        
        @keyframes confettiRain {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- ゲーム画面 -->
        <div id="game-screen">
            <h1>三重長の野望</h1>
            <p class="subtitle">10年間生き延びろ！</p>
            
            <div class="year-display">
                <div class="year-label">年</div>
                <div class="year-number" id="year-display">1</div>
            </div>
            
            <div class="status-area">
                <div class="status-item">
                    <div class="status-label">正解数</div>
                    <div class="status-value" id="correct-count">0</div>
                </div>
                <div class="status-item">
                    <div class="status-label">挑戦回数</div>
                    <div class="status-value" id="attempt-count">0</div>
                </div>
                <div class="status-item">
                    <div class="status-label">残機</div>
                    <div class="status-value" id="lives">3</div>
                </div>
            </div>
            
            <div class="question-area">
                <div class="character-display">
                    <div class="character-portrait" id="current-character">
                        <!-- キャラクター画像 -->
                    </div>
                    <div class="character-info">
                        <h2 id="character-name">-</h2>
                        <p id="character-question">-</p>
                    </div>
                </div>
                <div class="question-text" id="question-text">-</div>
            </div>
            
            <div class="options-container" id="options-container">
                <!-- オプション -->
            </div>
            
            <div class="feedback-area" id="feedback-area">
                <!-- フィードバック -->
            </div>
        </div>
        
        <!-- 結果画面 -->
        <div id="result-screen" class="result-screen">
            <div class="result-title">ゲームクリア！</div>
            <div class="result-message" id="result-message">
                おめでとうございます！<br>
                10年間生き延びました！
            </div>
            <button class="btn restart" id="restart-btn">もう一度挑戦</button>
        </div>
        
        <!-- ゲームオーバー）
        <div class="game-over-overlay" id="game-over-overlay">
            <div class="game-over-content">
                <div class="game-over-title">切り捨てよう、不如帰！</div>
                <p>残念でした... もう一度挑戦して運命を変えましょう！</p>
                <button class="btn restart" id="restart-btn">再挑戦</button>
            </div>
        </div>
    </div>
    
    <script>
        const characters = [
            {
                name: '家康',
                avatar: '🔴',
                speech: '三重は東海地方だろう？'
            },
            {
                name: '秀吉',
                avatar: '🟢',
                speech: '三重は関西地方だろう？'
            },
            {
                name: '信長',
                avatar: '🔵',
                speech: '三重は近畿地方だろう？'
            }
        ];
        
        const correctRegions = {
            '家康': '東海地方',
            '秀吉': '関西地方', 
            '信長': '近畿地方'
        };
        
        const allRegions = ['東海地方', '近畿地方', '関西地方', '関東地方', '九州地方', '中国地方'];
        
        let gameState = {
            year: 1,
            correctAnswers: 0,
            attempts: 0,
            lives: 3,
            gameOver: false,
            gameComplete: false
        };
        
        let currentCharacter = null;
        
        const elements = {
            gameScreen: document.getElementById('game-screen'),
            resultScreen: document.getElementById('result-screen'),
            currentCharacter: document.getElementById('current-character'),
            characterName: document.getElementById('character-name'),
            characterQuestion: document.getElementById('character-question'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            correctCount: document.getElementById('correct-count'),
            attemptCount: document.getElementById('attempt-count'),
            lives: document.getElementById('lives'),
            yearDisplay: document.getElementById('year-display'),
            feedbackArea: document.getElementById('feedback-area'),
            resultMessage: document.getElementById('result-message'),
            restartBtn: document.getElementById('restart-btn')
        };
        
        function startGame() {
            elements.gameScreen.classList.add('active');
            elements.resultScreen.classList.remove('active');
            
            gameState.year = 1;
            gameState.correctAnswers = 0;
            gameState.attempts = 0;
            gameState.lives = 3;
            gameState.gameOver = false;
            gameState.gameComplete = false;
            
            updateUI();
            showQuestion();
        }
        
        function showQuestion() {
            if (gameState.gameOver || gameState.gameComplete) return;
            
            currentCharacter = characters[Math.floor(Math.random() * characters.length)];
            
            elements.currentCharacter.textContent = currentCharacter.avatar;
            elements.characterName.textContent = currentCharacter.name;
            elements.characterQuestion.textContent = currentCharacter.speech;
            elements.questionText.textContent = `「${currentCharacter.name}」の主張、正しいのはどこ？`;
            
            generateOptions();
        }
        
        function generateOptions() {
            elements.optionsContainer.innerHTML = '';
            elements.feedbackArea.classList.remove('show');
            
            const correctRegion = correctRegions[currentCharacter.name];
            const otherRegions = allRegions.filter(r => r !== correctRegion);
            const shuffledOthers = shuffleArray(otherRegions).slice(0, 2);
            
            const allOptions = [
                { text: correctRegion, isCorrect: true },
                ...shuffledOthers.map(text => ({ text, isCorrect: false }))
            ];
            
            const shuffledOptions = shuffleArray(allOptions);
            
            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.dataset.correct = option.isCorrect;
                btn.addEventListener('click', () => selectOption(btn, option.isCorrect));
                elements.optionsContainer.appendChild(btn);
            });
        }
        
        function selectOption(selectedBtn, isCorrect) {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            gameState.attempts++;
            
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                gameState.correctAnswers++;
                gameState.year++;
                
                const chars = ['🎉', '✅', '👍', '👌', '👑', '🎊', '🎯', '🏆'];
                const messages = [
                    '正解！生き残ります！',
                    '◎ 絶対正解！次へ進もう！',
                    '👍 君は有能だ！',
                    '👌 まさに天命！'
                ];
                elements.feedbackArea.textContent = chars[Math.floor(Math.random() * chars.length)] + ' ' + messages[Math.floor(Math.random() * messages.length)];
                elements.feedbackArea.className = 'feedback-area show feedback-correct';
                
                setTimeout(checkGameStatus, 1500);
            } else {
                selectedBtn.classList.add('incorrect');
                gameState.lives--;
                
                elements.feedbackArea.textContent = '💀 不正解... 切り捨てよう、不如帰！';
                elements.feedbackArea.className = 'feedback-area show feedback-incorrect';
                
                setTimeout(gameOver, 1500);
            }
            
            updateUI();
        }
        
        function checkGameStatus() {
            if (gameState.year > 10) {
                gameComplete();
            } else {
                elements.yearDisplay.textContent = gameState.year;
                showQuestion();
            }
        }
        
        function gameOver() {
            gameState.gameOver = true;
            elements.gameScreen.classList.remove('active');
            elements.resultScreen.classList.add('active');
            
            const chars = ['💀', '⚰️', '🕷️', '🐍'];
            const messages = [
                '切り捨てよう、不如帰！',
                'やめろよ、この世は俺のものだ...',
                'また来よう、運命は変わらない...'
            ];
            
            elements.resultMessage.innerHTML = 
                chars[Math.floor(Math.random() * chars.length)] + '<br>' +
                messages[Math.floor(Math.random() * messages.length)] + '<br><br>' +
                `最終年数: ${gameState.year}<br>正解数: ${gameState.correctAnswers}`;
        }
        
        function gameComplete() {
            gameState.gameComplete = true;
            
            showConfetti();
            
            elements.resultMessage.innerHTML = 
                '🎉<br>おめでとうございます！<br>10年間生き延びました！<br><br>三重の野望をかか了達！<br>' +
                `<span style="font-size: 1.2em; color: #e74c3c;">勝利への道、あなたは歩んだ！</span>`;
        }
        
        function updateUI() {
            elements.correctCount.textContent = gameState.correctAnswers;
            elements.attemptCount.textContent = gameState.attempts;
            elements.lives.textContent = gameState.lives;
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function showConfetti() {
            for (let i = 0; i <30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 800 + 'px';
                    confetti.style.backgroundColor = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'][Math.floor(Math.random() * 5)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    document.querySelector('.game-container').appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 80);
            }
        }
        
        elements.restartBtn.addEventListener('click', startGame);
        
        startGame();
    </script>
</body>
</html>
