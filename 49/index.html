<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>RETRO KUNG-FU BATTLE (イーアルカンフー風格闘)</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 20px;
            color: #ffcc00;
            text-shadow: 2px 2px #ff0000;
            letter-spacing: 2px;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 420px;
            background: linear-gradient(to bottom, #222 0%, #444 60%, #1a1a1a 60%, #333 100%);
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #ui {
            width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 16px;
            font-weight: bold;
        }
        .fighter-hud {
            display: flex;
            flex-direction: column;
            width: 350px;
        }
        .hp-bar-container {
            width: 100%;
            height: 18px;
            background: #444;
            border: 2px solid #fff;
            margin-top: 3px;
            position: relative;
        }
        .hp-bar {
            height: 100%;
            background: #00ff00;
            width: 100%;
            transition: width 0.1s ease;
        }
        #controls-hint {
            margin-top: 5px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
        .key {
            display: inline-block;
            background: #333;
            border: 1px solid #777;
            padding: 1px 5px;
            border-radius: 3px;
            color: #fff;
            font-weight: bold;
        }
        /* On-screen control buttons */
        #virtual-pad {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .pad-group {
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            background: linear-gradient(to bottom, #444, #222);
            border: 2px solid #fff;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #111;
            outline: none;
            touch-action: manipulation;
        }
        .ctrl-btn:active, .ctrl-btn.pressed {
            background: linear-gradient(to bottom, #222, #111);
            transform: translateY(3px);
            box-shadow: 0 1px #111;
        }
        #btn-punch { background: linear-gradient(to bottom, #cc8822, #885511); border-color: #ffbb44; }
        #btn-kick { background: linear-gradient(to bottom, #cc2222, #881111); border-color: #ff4444; }
    </style>
</head>
<body>

    <h1>RETRO KUNG-FU BATTLE</h1>
    <div id="ui">
        <div class="fighter-hud">
            <div>PLAYER (YOU) <span id="p-score" style="float: right;">WINS: 0</span></div>
            <div class="hp-bar-container"><div id="p-hp" class="hp-bar"></div></div>
        </div>
        <div style="font-size: 20px; color: #ff0000; align-self: center;" id="round-timer">VS</div>
        <div class="fighter-hud" style="align-items: flex-end;">
            <div><span id="cpu-score" style="float: left;">WINS: 0</span> CPU</div>
            <div class="hp-bar-container"><div id="cpu-hp" class="hp-bar" style="background: #ff3333;"></div></div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="420"></canvas>
    </div>

    <div id="virtual-pad">
        <div class="pad-group">
            <button class="ctrl-btn" id="btn-left">◀ 後退 (A)</button>
            <button class="ctrl-btn" id="btn-right">▶ 前進 (D)</button>
        </div>
        <div class="pad-group">
            <button class="ctrl-btn" id="btn-punch">パンチ (J)</button>
            <button class="ctrl-btn" id="btn-kick">キック (K)</button>
        </div>
    </div>

    <div id="controls-hint">
        キーボード: <span class="key">A</span>/<span class="key">D</span> (移動) | <span class="key">J</span> (パンチ) | <span class="key">K</span> (キック) | <span class="key">R</span> (リスタート)
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WORLD_WIDTH = 800;
const FLOOR_Y = 340;

class Fighter {
    constructor(x, isCpu = false) {
        this.x = x;
        this.y = FLOOR_Y;
        this.vx = 0;
        this.width = 40;
        this.height = 110;
        this.hp = 100;
        this.maxHp = 100;
        this.isCpu = isCpu;
        
        this.state = 'idle';
        this.animTimer = 0;
        this.facing = isCpu ? -1 : 1;
        this.actionCooldown = 0;
        this.wins = 0;
    }

    update(opponent) {
        if (this.actionCooldown > 0) {
            this.actionCooldown--;
        }

        if (this.state !== 'punch' && this.state !== 'kick' && this.state !== 'hit') {
            this.facing = this.x < opponent.x ? 1 : -1;
        }

        if (this.state === 'punch' || this.state === 'kick' || this.state === 'hit') {
            this.animTimer--;
            if (this.animTimer <= 0) {
                this.state = 'idle';
            }
            return;
        }

        if (this.isCpu) {
            this.updateCpu(opponent);
        } else {
            this.updatePlayer();
        }

        this.x += this.vx;
        
        if (this.x < 50) this.x = 50;
        if (this.x > WORLD_WIDTH - 50) this.x = WORLD_WIDTH - 50;

        let dist = Math.abs(this.x - opponent.x);
        if (dist < 35) {
            if (this.x < opponent.x) {
                this.x = opponent.x - 35;
            } else {
                this.x = opponent.x + 35;
            }
        }
    }

    updatePlayer() {
        this.vx = 0;
        if (keys['KeyA'] || keys['ArrowLeft']) {
            this.vx = -4;
            this.state = 'walk';
        } else if (keys['KeyD'] || keys['ArrowRight']) {
            this.vx = 4;
            this.state = 'walk';
        } else {
            this.state = 'idle';
        }
    }

    updateCpu(opponent) {
        this.vx = 0;
        let dist = Math.abs(this.x - opponent.x);
        
        if (this.actionCooldown === 0) {
            if (dist <= 55) {
                if (Math.random() < 0.6) {
                    this.punch(opponent);
                    this.actionCooldown = 35;
                    return;
                } else if (Math.random() < 0.3) {
                    this.vx = -3 * this.facing;
                    this.state = 'walk';
                }
            } else if (dist > 55 && dist <= 110) {
                if (Math.random() < 0.55) {
                    this.kick(opponent);
                    this.actionCooldown = 45;
                    return;
                } else {
                    this.vx = (Math.random() < 0.6 ? 2.5 : -2.5);
                    this.state = 'walk';
                }
            } else {
                this.vx = (this.x < opponent.x ? 3 : -3);
                this.state = 'walk';
            }
        }
    }

    punch(opponent) {
        if (this.state === 'punch' || this.state === 'kick' || this.state === 'hit') return;
        this.state = 'punch';
        this.animTimer = 18;
        
        let dist = Math.abs(this.x - opponent.x);
        if (dist <= 65) {
            if ((this.facing === 1 && opponent.x > this.x) || (this.facing === -1 && opponent.x < this.x)) {
                opponent.takeHit(10, 'punch');
            }
        }
    }

    kick(opponent) {
        if (this.state === 'punch' || this.state === 'kick' || this.state === 'hit') return;
        this.state = 'kick';
        this.animTimer = 25;
        
        let dist = Math.abs(this.x - opponent.x);
        if (dist >= 50 && dist <= 115) {
            if ((this.facing === 1 && opponent.x > this.x) || (this.facing === -1 && opponent.x < this.x)) {
                opponent.takeHit(18, 'kick');
            }
        }
    }

    takeHit(damage, type) {
        this.hp -= damage;
        if (this.hp < 0) this.hp = 0;
        this.state = 'hit';
        this.animTimer = 20;
        this.vx = -this.facing * 5;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 5, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        let bodyColor = this.isCpu ? '#cc2222' : '#2266cc';
        let skinColor = '#ffccaa';
        let pantsColor = '#eeeeee';

        if (this.state === 'hit' && Math.floor(this.animTimer / 3) % 2 === 0) {
            bodyColor = '#ffffff';
        }

        ctx.fillStyle = pantsColor;
        ctx.fillRect(-12, -45, 10, 45);
        ctx.fillRect(2, -45, 10, 45);

        ctx.fillStyle = bodyColor;
        ctx.fillRect(-16, -85, 32, 40);

        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.arc(0, -100, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.isCpu ? '#000' : '#ffcc00';
        ctx.fillRect(-15, -112, 30, 5);

        ctx.fillStyle = bodyColor;
        if (this.state === 'punch') {
            ctx.fillRect(this.facing === 1 ? 16 : -36, -80, 30, 10);
        } else if (this.state === 'kick') {
            ctx.fillStyle = skinColor;
            ctx.fillRect(this.facing === 1 ? 10 : -30, -30, 35, 10);
        } else {
            ctx.fillRect(-22, -80, 8, 30);
            ctx.fillRect(14, -80, 8, 30);
        }

        ctx.restore();
    }
}

const keys = {};

// Keyboard events
window.addEventListener('keydown', e => {
    if (e.code === 'KeyJ' || e.code === 'KeyX') triggerPunch();
    if (e.code === 'KeyK' || e.code === 'KeyC') triggerKick();
    if (e.code === 'KeyR' && gameOver) resetMatch();
    keys[e.code] = true;
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

// Action triggers
function triggerPunch() {
    if (player.state === 'idle' && player.actionCooldown === 0 && !gameOver) {
        player.punch(cpu);
        player.actionCooldown = 25;
    }
}

function triggerKick() {
    if (player.state === 'idle' && player.actionCooldown === 0 && !gameOver) {
        player.kick(cpu);
        player.actionCooldown = 35;
    }
}

// Virtual button listeners (Mouse & Touch)
function setupButton(id, keyCode, actionFn) {
    const btn = document.getElementById(id);
    
    const pressOn = (e) => {
        e.preventDefault();
        keys[keyCode] = true;
        btn.classList.add('pressed');
        if (actionFn) actionFn();
    };
    
    const pressOff = (e) => {
        e.preventDefault();
        keys[keyCode] = false;
        btn.classList.remove('pressed');
    };

    btn.addEventListener('mousedown', pressOn);
    btn.addEventListener('mouseup', pressOff);
    btn.addEventListener('mouseleave', pressOff);
    
    btn.addEventListener('touchstart', pressOn, { passive: false });
    btn.addEventListener('touchend', pressOff, { passive: false });
    btn.addEventListener('touchcancel', pressOff, { passive: false });
}

setupButton('btn-left', 'KeyA');
setupButton('btn-right', 'KeyD');
setupButton('btn-punch', 'KeyJ', triggerPunch);
setupButton('btn-kick', 'KeyK', triggerKick);

let player = new Fighter(250, false);
let cpu = new Fighter(550, true);
let gameOver = false;
let winnerText = '';

function resetMatch() {
    player.hp = player.maxHp;
    cpu.hp = cpu.maxHp;
    player.x = 250;
    cpu.x = 550;
    player.state = 'idle';
    cpu.state = 'idle';
    gameOver = false;
    winnerText = '';
}

function update() {
    if (!gameOver) {
        player.update(cpu);
        cpu.update(player);

        if (player.hp <= 0) {
            gameOver = true;
            cpu.wins++;
            winnerText = 'CPU WINS!';
            document.getElementById('cpu-score').innerText = `WINS: ${cpu.wins}`;
        } else if (cpu.hp <= 0) {
            gameOver = true;
            player.wins++;
            winnerText = 'PLAYER WINS!';
            document.getElementById('p-score').innerText = `WINS: ${player.wins}`;
        }
    }

    document.getElementById('p-hp').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('cpu-hp').style.width = `${(cpu.hp / cpu.maxHp) * 100}%`;
}

function draw() {
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, 0, WORLD_WIDTH, canvas.height);

    ctx.fillStyle = '#2b1d0c';
    ctx.fillRect(0, 0, WORLD_WIDTH, FLOOR_Y);
    
    ctx.fillStyle = '#111';
    ctx.fillRect(150, 60, 120, 140);
    ctx.fillRect(530, 60, 120, 140);
    ctx.fillStyle = '#443322';
    ctx.fillRect(205, 60, 10, 140);
    ctx.fillRect(585, 60, 10, 140);

    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(0, FLOOR_Y, WORLD_WIDTH, canvas.height - FLOOR_Y);
    ctx.fillStyle = '#5c3a21';
    ctx.fillRect(0, FLOOR_Y, WORLD_WIDTH, 8);

    player.draw();
    cpu.draw();

    let dist = Math.abs(player.x - cpu.x);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`DISTANCE: ${Math.floor(dist)}`, WORLD_WIDTH / 2, 25);
    
    if (dist <= 65) {
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('【パンチレンジ】', WORLD_WIDTH / 2, 42);
    } else if (dist >= 50 && dist <= 115) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillText('【キックレンジ】', WORLD_WIDTH / 2, 42);
    } else {
        ctx.fillStyle = '#ff4444';
        ctx.fillText('【レンジ外 (至近距離キックNG)】', WORLD_WIDTH / 2, 42);
    }

    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, WORLD_WIDTH, canvas.height);

        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 36px Courier New';
        ctx.fillText(winnerText, WORLD_WIDTH / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Courier New';
        ctx.fillText("Press [R] or Restart", WORLD_WIDTH / 2, canvas.height / 2 + 30);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
