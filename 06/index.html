<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドラクエ1 城からの脱出</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'MS Gothic','BIZ UD Gothic',monospace;overflow-x:hidden;padding:4px;margin:0}
#game{background:#181828;padding:24px 32px;border-radius:16px;border:2px solid #3a3a5a;box-shadow:0 8px 32px rgba(0,0,0,.8);width:fit-content;max-width:100%;margin:0 auto}
#header{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px 4px;color:#c8b88a;border-bottom:1px solid #3a3a5a;margin-bottom:12px;gap:8px}
#title{font-size:20px;font-weight:bold;letter-spacing:2px;white-space:nowrap;text-shadow:0 0 8px rgba(200,184,138,.3)}
#floor-indicator{font-size:15px;color:#a89878;background:#222238;padding:4px 14px;border-radius:20px;border:1px solid #3a3a5a;white-space:nowrap;flex-shrink:0}
#canvas-wrap{display:flex;justify-content:center;width:100%}
canvas{display:block;border:2px solid #3a3a5a;border-radius:4px;image-rendering:pixelated;max-width:100%;height:auto;aspect-ratio:13/9}
#msg-box{background:#0e0e1a;border:2px solid #3a3a5a;border-radius:4px;padding:10px 14px;margin-top:12px;min-height:68px;color:#c0b090;font-size:14px;line-height:1.6;position:relative}
#msg-box .name{color:#e8d8a0;font-weight:bold}
#msg-box .highlight{color:#f0d060}
#msg-box .system{color:#80b0c0}
#controls{display:flex;justify-content:center;gap:20px;margin-top:10px;color:#6a6a8a;font-size:12px}
#controls kbd{background:#222238;border:1px solid #4a4a6a;border-radius:3px;padding:2px 8px;color:#a0a0c0;font-family:inherit;font-size:11px}
#vpad{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px;gap:16px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:3px;flex-shrink:0}
.dpad-btn{display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #4a4a6a;background:#222238;color:#8080a8;font-size:22px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .08s}
.dpad-btn.active,.dpad-btn:active{background:#3a3a5a;color:#b0b0d0;border-color:#6a6a8a}
.dpad-blank{visibility:hidden}
#btn-a{width:76px;height:76px;border-radius:50%;border:2px solid #c8a040;background:#2a2010;color:#e8c840;font-size:16px;font-weight:bold;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .08s;flex-shrink:0}
#btn-a.active,#btn-a:active{background:#4a3820;border-color:#e8d060;color:#f0d860}
#btn-a small{font-size:10px;color:#8a7a4a;font-weight:normal}
#action-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
#action-wrap .label{color:#6a6a8a;font-size:10px;letter-spacing:1px}
@media(max-width:560px){
  #game{padding:12px 10px;border-radius:8px}
  #title{font-size:15px;letter-spacing:1px}
  #floor-indicator{font-size:12px;padding:3px 10px}
  .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}
  .dpad-btn{font-size:18px;border-radius:6px}
  #btn-a{width:64px;height:64px;font-size:13px}
  #msg-box{font-size:13px;min-height:56px;padding:8px 10px}
  #controls{font-size:11px;gap:12px}
}
@media(max-width:400px){
  #game{padding:8px 6px;border-radius:6px;border-width:1px}
  #title{font-size:13px}
  #floor-indicator{font-size:11px;padding:2px 8px}
  #msg-box{font-size:12px;min-height:48px;padding:6px 8px;margin-top:8px}
  #vpad{gap:8px;margin-top:10px}
  #controls{font-size:10px;gap:8px;flex-wrap:wrap}
  .dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
  .dpad-btn{font-size:15px;border-radius:4px}
  #btn-a{width:52px;height:52px;font-size:11px}
  #btn-a small{font-size:8px}
  #action-wrap .label{font-size:8px}
  canvas{border-width:1px;border-radius:2px}
}
</style>
</head>
<body>
<div id="game">
  <div id="header">
    <div id="title">⚔ 城からの脱出</div>
    <div id="floor-indicator">🏛 王の間</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
  </div>
  <div id="msg-box">
    <div id="msg-text"><span class="system">▼ タップ or 矢印キーで移動 / Zで決定</span></div>
  </div>
  <div id="vpad">
    <div class="dpad">
      <div class="dpad-blank"></div>
      <div class="dpad-btn" data-dir="up">▲</div>
      <div class="dpad-blank"></div>
      <div class="dpad-btn" data-dir="left">◀</div>
      <div class="dpad-btn" data-dir="down">▼</div>
      <div class="dpad-btn" data-dir="right">▶</div>
    </div>
    <div id="action-wrap">
      <div class="label">こうどう</div>
      <div id="btn-a"><span>決定</span><small>Z</small></div>
    </div>
  </div>
  <div id="controls">
    <span>移動: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd></span>
    <span>決定: <kbd>Z</kbd></span>
  </div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const M=document.getElementById('msg-text'),F=document.getElementById('floor-indicator');
const TILE=40,COLS=13,ROWS=9;
C.width=COLS*TILE;C.height=ROWS*TILE;
const T={WALL:0,FLOOR:1,RUG:2};
const E={KING:'king',STAIRS:'stairs',DOOR:'exit',GUARD:'guard',LOCKED:'locked_door',CHEST:'chest'};

const floor0=(()=>{
  const m=[];
  for(let r=0;r<ROWS;r++){m[r]=[];for(let c=0;c<COLS;c++)m[r][c]=r===0||r===ROWS-1||c===0||c===COLS-1?T.WALL:T.FLOOR;}
  m[4][6]=T.RUG;
  m[6][10]=T.WALL;
  m[7][10]=T.WALL;
  return m;
})();
const floor1=(()=>{
  const m=[];
  for(let r=0;r<ROWS;r++){m[r]=[];for(let c=0;c<COLS;c++)m[r][c]=r===0||r===ROWS-1||c===0||c===COLS-1?T.WALL:T.FLOOR;}
  return m;
})();
const maps=[floor0,floor1];

const baseEntities=[
  {type:E.KING,x:6,y:3,floor:0},
  {type:E.STAIRS,x:9,y:7,floor:0},
  {type:E.LOCKED,x:8,y:6,floor:0,unlocked:false},
  {type:E.LOCKED,x:9,y:6,floor:0,unlocked:false},
  {type:E.LOCKED,x:8,y:7,floor:0,unlocked:false},
];
let entities=[...baseEntities];
let chests=[];

const inv={chestKey:0,doorKey:0};
const player={x:6,y:5,floor:0};
let dir=0,moving=false,kingTalked=false,chestsSpawned=false;
let ending=false,endPhase='',endScrollY=0,endStart=0;

const endTxt=[
  '第1章　完','',
  '勇者は王様の指令を受け、','魔王討伐の旅に出るのであった。','',
  'しかし、その道のりは遠く、','数々の試練が待ち受けている。','',
  '勇者の冒険は、','まだ始まったばかりだ。','',
  '──　To Be Continued　──',
];

function shf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}}

function spawnChests(){
  const t=[1,1,2,3,4];shf(t);
  const pos=[{x:3,y:2},{x:9,y:2},{x:3,y:6},{x:10,y:6},{x:7,y:4}];
  chests=pos.map((p,i)=>({type:E.CHEST,ct:t[i],x:p.x,y:p.y,floor:0,opened:false}));
  entities=[...baseEntities,...chests];
  chestsSpawned=true;
}

function walkable(f,r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS||maps[f][r][c]===T.WALL)return false;
  const e=entities.find(e=>e.floor===f&&e.x===c&&e.y===r);
  if(!e)return true;
  if(e.type===E.STAIRS||e.type===E.DOOR)return true;
  if(e.type===E.LOCKED&&e.unlocked)return true;
  if(e.type===E.CHEST&&e.opened)return true;
  return false;
}

function entAt(f,x,y){return entities.find(e=>e.floor===f&&e.x===x&&e.y===y);}
function adjI(f,x,y){
  return entities.find(e=>e.floor===f&&Math.abs(e.x-x)+Math.abs(e.y-y)===1
    && (e.type===E.KING||e.type===E.GUARD||e.type===E.CHEST||(e.type===E.LOCKED&&!e.unlocked)));
}

function msg(html,dur=0){
  M.innerHTML=html;
  if(dur>0)setTimeout(()=>{if(M.innerHTML===html)M.innerHTML='<span class="system">▼ タップ or 矢印キーで移動 / Zで決定</span>';},dur);
}

function talkKing(){
  if(!chestsSpawned){
    spawnChests();
    msg('<span class="name">👑 王様</span>「<span class="highlight">よく来たな、勇者よ！</span> 宝箱を開けて鍵を集め、<span class="highlight">先に進む</span>がよい！」<br><span class="system">▼ 宝箱が5つ現れた！</span>',7000);
  }else{msg('<span class="name">👑 王様</span>「宝箱を開けて<span class="highlight">扉を開ける</span>のだ！」',3000);}
}

function openChest(ch){
  if(ch.opened)return '<span class="system">この宝箱はもう開いている。</span>';
  if(ch.ct===1){ch.opened=true;inv.chestKey++;return '宝箱を開けた！<span class="highlight">宝箱の鍵</span>を手に入れた！';}
  if(ch.ct===2){
    if(inv.chestKey>0){inv.chestKey--;ch.opened=true;inv.doorKey++;return '宝箱の鍵で開けた！<span class="highlight">扉の鍵</span>を手に入れた！';}
    return '鍵がかかっている。<span class="highlight">宝箱の鍵</span>が必要だ。';
  }
  if(ch.ct===3){ch.opened=true;return '宝箱を開けた！<span class="highlight">こん棒</span>を手に入れた！';}
  if(ch.ct===4){
    if(inv.chestKey>0){inv.chestKey--;ch.opened=true;return '宝箱の鍵で開けた！<span class="highlight">勇者の盾</span>を手に入れた！';}
    return '鍵がかかっている。<span class="highlight">宝箱の鍵</span>が必要だ。';
  }
}

function action(){
  if(ending)return;
  const t=adjI(player.floor,player.x,player.y);
  if(!t){msg('<span class="system">話しかける相手がいない</span>',1200);return;}
  if(t.type===E.KING){talkKing();draw();}
  else if(t.type===E.CHEST){const m=openChest(t);msg(m,m.length>50?5000:3500);draw();}
  else if(t.type===E.LOCKED){
    if(t.unlocked){msg('この扉はもう開いている。',2000);draw();return;}
    if(inv.doorKey>0){inv.doorKey--;t.unlocked=true;msg('扉の鍵で<span class="highlight">扉を開けた！</span>',4000);}
    else msg('<span class="highlight">扉の鍵</span>が必要だ。',2500);
    draw();
  }
}

function move(ox,oy){
  if(moving||ending)return;
  const nx=player.x+ox,ny=player.y+oy;
  if(ox===0&&oy===1)dir=0;else if(ox===-1&&oy===0)dir=1;else if(ox===1&&oy===0)dir=2;else if(ox===0&&oy===-1)dir=3;
  if(!walkable(player.floor,ny,nx)){
    const e=entAt(player.floor,nx,ny);
    if(e&&e.type===E.LOCKED&&!e.unlocked)msg('<span class="highlight">扉には鍵がかかっている</span>',2000);
    else msg('<span class="system">その方向へは進めない</span>',1000);
    draw();return;
  }
  const e=entAt(player.floor,nx,ny);
  if(e&&e.type===E.STAIRS){moving=true;player.x=nx;player.y=ny;draw();setTimeout(endRoll,600);return;}
  player.x=nx;player.y=ny;draw();
}

F.textContent='🏛 王の間';

function endRoll(){
  ending=true;endPhase='scroll';endScrollY=C.height+40;endStart=performance.now();
  document.getElementById('vpad').style.display='none';
  document.getElementById('controls').style.display='none';
  M.innerHTML='';
  requestAnimationFrame(drawEnd);
}

function drawEnd(ts){
  X.fillStyle='#0a0a12';X.fillRect(0,0,C.width,C.height);
  const s=(ts-endStart)/1000;endScrollY=C.height+40-s*36;
  X.textAlign='center';let y=endScrollY;
  for(const l of endTxt){
    if(!l){y+=24;continue;}
    if(l==='第1章　完'){X.font='bold 20px monospace';X.fillStyle='#f0d060';}
    else if(l==='──　To Be Continued　──'){X.font='15px monospace';X.fillStyle='#c0a070';}
    else{X.font='15px monospace';X.fillStyle='#d0c0a0';}
    X.fillText(l,C.width/2,y);y+=32;
  }
  if(y>0){requestAnimationFrame(drawEnd);}
  else{endPhase='wait';endWait();}
}

function endWait(){
  X.fillStyle='#0a0a12';X.fillRect(0,0,C.width,C.height);
  X.textAlign='center';
  X.font='bold 20px monospace';X.fillStyle='#f0d060';
  X.fillText('第1章　完',C.width/2,C.height/2-30);
  X.font='15px monospace';X.fillStyle='#d0c0a0';
  X.fillText('勇者は王様の命を受け、魔王討伐の旅に出た。',C.width/2,C.height/2+20);
  X.fillText('──　To Be Continued　──',C.width/2,C.height/2+60);
  X.font='13px monospace';X.fillStyle='#606070';
  X.fillText('何かキーを押すと最初に戻ります',C.width/2,C.height-30);
}

function rst(){location.reload();}

function draw(){
  X.clearRect(0,0,C.width,C.height);
  const f=player.floor,map=maps[f];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*TILE,y=r*TILE;
    switch(map[r][c]){
      case T.WALL:
        X.fillStyle='#3a3a5a';X.fillRect(x,y,TILE,TILE);
        X.fillStyle='#2a2a48';X.fillRect(x+2,y+2,TILE-4,TILE-4);
        X.fillStyle='#48486a';
        X.fillRect(x+4,y+4,3,3);X.fillRect(x+TILE-8,y+4,3,3);
        X.fillRect(x+4,y+TILE-8,3,3);X.fillRect(x+TILE-8,y+TILE-8,3,3);
        break;
      case T.FLOOR:
        X.fillStyle=(r+c)%2===0?'#3a3a2a':'#444430';X.fillRect(x,y,TILE,TILE);break;
      case T.RUG:
        X.fillStyle='#4a3a2a';X.fillRect(x,y,TILE,TILE);
        X.fillStyle='#5a4a3a';X.fillRect(x+4,y+4,TILE-8,2);X.fillRect(x+4,y+TILE-6,TILE-8,2);
        X.fillStyle='#6a5a4a';X.fillRect(x+6,y+6,4,TILE-12);X.fillRect(x+TILE-10,y+6,4,TILE-12);break;
    }
  }
  for(const e of entities){
    if(e.floor!==f)continue;
    const ex=e.x*TILE,ey=e.y*TILE;
    switch(e.type){
      case E.KING:
        X.fillStyle='#e8c840';X.beginPath();X.arc(ex+TILE/2,ey+TILE/2-4,10,0,Math.PI*2);X.fill();
        X.fillStyle='#c8a020';X.fillRect(ex+8,ey+TILE/2+4,24,18);
        X.fillStyle='#f0e0a0';X.fillRect(ex+12,ey+TILE/2+6,16,6);
        X.fillStyle='#d0a030';for(let i=0;i<3;i++)X.fillRect(ex+10+i*8,ey+TILE/2-2,4,4);
        X.fillStyle='#e8d8a0';X.font='11px monospace';X.textAlign='center';X.fillText('王',ex+TILE/2,ey+TILE-6);break;
      case E.STAIRS:
        X.fillStyle='#6a5a4a';for(let i=0;i<4;i++)X.fillRect(ex+8+i*3,ey+TILE-10-i*8,TILE-16-i*6,6);
        X.fillStyle='#8a7a5a';X.fillRect(ex+TILE/2-1,ey+8,2,TILE-16);break;
      case E.LOCKED:
        if(!e.unlocked){
          X.fillStyle='#6a4a2a';X.fillRect(ex+2,ey+2,TILE-4,TILE-4);
          X.fillStyle='#8a6a3a';X.fillRect(ex+6,ey+6,TILE-12,TILE-12);
          X.fillStyle='#c8a040';X.fillRect(ex+TILE/2-4,ey+TILE/2-4,8,8);
          X.fillStyle='#3a2a1a';X.fillRect(ex+TILE/2-2,ey+TILE/2-2,4,4);
          X.fillStyle='#c0a060';X.font='9px monospace';X.textAlign='center';X.fillText('鍵',ex+TILE/2,ey+TILE-6);
        }else{
          X.fillStyle='#5a5a3a';X.fillRect(ex+2,ey+2,TILE-4,TILE-4);
          X.fillStyle='#4a4a2a';X.fillRect(ex+6,ey+6,TILE-12,TILE-12);
          X.fillStyle='#609040';X.font='9px monospace';X.textAlign='center';X.fillText('開',ex+TILE/2,ey+TILE-6);
        }break;
      case E.CHEST:
        if(!e.opened){
          X.fillStyle='#6a4a2a';X.fillRect(ex+4,ey+8,TILE-8,TILE-12);
          X.fillStyle='#8a6a3a';X.fillRect(ex+6,ey+10,TILE-12,TILE-16);
          X.fillStyle='#c8a040';X.fillRect(ex+8,ey+6,TILE-16,6);
          X.fillStyle='#e8c840';X.fillRect(ex+TILE/2-6,ey+7,12,4);
          X.fillStyle='#d0a030';X.font='9px monospace';X.textAlign='center';X.fillText('宝',ex+TILE/2,ey+TILE-6);
        }else{
          X.fillStyle='#3a2a1a';X.fillRect(ex+4,ey+10,TILE-8,TILE-10);
          X.fillStyle='#5a3a1a';X.fillRect(ex+6,ey+12,TILE-12,TILE-14);
          X.fillStyle='#2a1a0a';X.font='9px monospace';X.textAlign='center';X.fillText('空',ex+TILE/2,ey+TILE-6);
        }break;
    }
  }
  const px=player.x*TILE,py=player.y*TILE;
  X.fillStyle='#4888d0';X.beginPath();X.arc(px+TILE/2,py+TILE/2-6,8,0,Math.PI*2);X.fill();
  X.fillStyle='#3068b0';X.fillRect(px+8,py+TILE/2+2,24,14);
  X.fillStyle='#60a0e0';X.fillRect(px+12,py+TILE/2+4,6,4);X.fillRect(px+22,py+TILE/2+4,6,4);
  X.fillStyle='#60a0e0';X.fillRect(px+14,py+TILE/2+10,12,2);
  X.fillStyle='#d0d0d0';X.font='11px monospace';X.textAlign='center';X.fillText('ゆ',px+TILE/2,py+TILE-6);
  // inventory
  const ii=[];
  if(inv.chestKey>0)ii.push(`🔑x${inv.chestKey}`);
  if(inv.doorKey>0)ii.push(`🚪x${inv.doorKey}`);
  if(ii.length){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(2,2,ii.join(' ').length*10+14,20);X.fillStyle='#d0c090';X.font='11px monospace';X.textAlign='left';X.fillText(ii.join('  '),10,16);}
  X.textAlign='start';
}

document.addEventListener('keydown',e=>{
  if(ending&&endPhase==='wait'){rst();return;}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','z','Z'].includes(e.key))e.preventDefault();
  switch(e.key){
    case 'ArrowUp':move(0,-1);break;case 'ArrowDown':move(0,1);break;
    case 'ArrowLeft':move(-1,0);break;case 'ArrowRight':move(1,0);break;
    case 'z':case 'Z':action();break;
  }
});

const dM={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let rt=null;
function ps(d){
  if(ending&&endPhase==='wait'){rst();return;}
  move(d[0],d[1]);
  if(rt)clearInterval(rt);rt=setInterval(()=>move(d[0],d[1]),180);
}
function pd(){if(rt){clearInterval(rt);rt=null;}}
document.querySelectorAll('.dpad-btn').forEach(b=>{
  const d=dM[b.dataset.dir];if(!d)return;
  b.addEventListener('mousedown',e=>{e.preventDefault();ps(d);});
  b.addEventListener('touchstart',e=>{e.preventDefault();ps(d);},{passive:false});
  b.addEventListener('mouseup',pd);b.addEventListener('mouseleave',pd);
  b.addEventListener('touchend',pd);b.addEventListener('touchcancel',pd);
});
const bA=document.getElementById('btn-a');
bA.addEventListener('mousedown',e=>{e.preventDefault();if(ending&&endPhase==='wait')rst();else action();});
bA.addEventListener('touchstart',e=>{e.preventDefault();if(ending&&endPhase==='wait')rst();else action();},{passive:false});
document.addEventListener('mouseup',pd);document.addEventListener('touchend',pd);

draw();
setTimeout(()=>msg('<span class="name">👑 王様</span>「<span class="highlight">おお、目覚めたか勇者よ！</span> 近づいて<span class="highlight">話しかける</span>がよい。<span class="system">（Zキー）</span>」',6000),500);
