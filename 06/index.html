<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドラクエ1 城からの脱出</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'MS Gothic','BIZ UD Gothic',monospace;overflow:hidden}
#game{background:#181828;padding:24px 32px;border-radius:16px;border:2px solid #3a3a5a;box-shadow:0 8px 32px rgba(0,0,0,.8)}
#header{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px 4px;color:#c8b88a;border-bottom:1px solid #3a3a5a;margin-bottom:12px}
#title{font-size:20px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 8px rgba(200,184,138,.3)}
#floor-indicator{font-size:15px;color:#a89878;background:#222238;padding:4px 14px;border-radius:20px;border:1px solid #3a3a5a}
#canvas-wrap{display:flex;justify-content:center}
canvas{display:block;border:2px solid #3a3a5a;border-radius:4px;image-rendering:pixelated}
#msg-box{background:#0e0e1a;border:2px solid #3a3a5a;border-radius:4px;padding:10px 14px;margin-top:12px;min-height:68px;color:#c0b090;font-size:14px;line-height:1.6;position:relative}
#msg-box .name{color:#e8d8a0;font-weight:bold}
#msg-box .highlight{color:#f0d060}
#msg-box .system{color:#80b0c0}
#controls{display:flex;justify-content:center;gap:20px;margin-top:10px;color:#6a6a8a;font-size:12px}
#controls kbd{background:#222238;border:1px solid #4a4a6a;border-radius:3px;padding:2px 8px;color:#a0a0c0;font-family:inherit;font-size:11px}
#vpad{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px;gap:16px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:3px;flex-shrink:0}
.dpad-btn{display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #4a4a6a;background:#222238;color:#8080a8;font-size:22px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .08s}
.dpad-btn.active,.dpad-btn:active{background:#3a3a5a;color:#b0b0d0;border-color:#6a6a8a}
.dpad-blank{visibility:hidden}
#btn-a{width:76px;height:76px;border-radius:50%;border:2px solid #c8a040;background:#2a2010;color:#e8c840;font-size:16px;font-weight:bold;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .08s;flex-shrink:0}
#btn-a.active,#btn-a:active{background:#4a3820;border-color:#e8d060;color:#f0d860}
#btn-a small{font-size:10px;color:#8a7a4a;font-weight:normal}
#action-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
#action-wrap .label{color:#6a6a8a;font-size:10px;letter-spacing:1px}
@media(max-width:560px){
  #game{padding:12px 10px;border-radius:8px}
  #title{font-size:16px;letter-spacing:1px}
  .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}
  .dpad-btn{font-size:18px;border-radius:6px}
  #btn-a{width:64px;height:64px;font-size:14px}
}
</style>
</head>
<body>
<div id="game">
  <div id="header">
    <div id="title">⚔ 城からの脱出</div>
    <div id="floor-indicator">🏛 王の間</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
  </div>
  <div id="msg-box">
    <div id="msg-text"><span class="system">▼ タップ or 矢印キーで移動 / Zで決定</span></div>
  </div>
  <div id="vpad">
    <div class="dpad">
      <div class="dpad-blank"></div>
      <div class="dpad-btn" data-dir="up">▲</div>
      <div class="dpad-blank"></div>
      <div class="dpad-btn" data-dir="left">◀</div>
      <div class="dpad-btn" data-dir="down">▼</div>
      <div class="dpad-btn" data-dir="right">▶</div>
    </div>
    <div id="action-wrap">
      <div class="label">こうどう</div>
      <div id="btn-a"><span>決定</span><small>Z</small></div>
    </div>
  </div>
  <div id="controls">
    <span>移動: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd></span>
    <span>決定: <kbd>Z</kbd></span>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msgText = document.getElementById('msg-text');
const floorLabel = document.getElementById('floor-indicator');

const TILE = 40;
const COLS = 13;
const ROWS = 9;
canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;

const T = { WALL:0, FLOOR:1, RUG:2 };

const floor0 = (()=>{
  const m = [];
  for(let r=0;r<ROWS;r++){
    m[r]=[];
    for(let c=0;c<COLS;c++) m[r][c]=r===0||r===ROWS-1||c===0||c===COLS-1?T.WALL:T.FLOOR;
  }
  m[4][6]=T.RUG;
  return m;
})();

const floor1 = (()=>{
  const m = [];
  for(let r=0;r<ROWS;r++){
    m[r]=[];
    for(let c=0;c<COLS;c++) m[r][c]=r===0||r===ROWS-1||c===0||c===COLS-1?T.WALL:T.FLOOR;
  }
  return m;
})();

const maps = [floor0, floor1];

const ENT = { KING:'king', STAIRS:'stairs', DOOR:'exit', GUARD:'guard' };

const entities = [
  {type:ENT.KING, x:6, y:3, floor:0},
  {type:ENT.STAIRS, x:9, y:7, floor:0},
  {type:ENT.GUARD, x:6, y:3, floor:1},
  {type:ENT.DOOR, x:9, y:7, floor:1},
];

const player = { x:6, y:5, floor:0 };
let direction = 0;
let moving = false;
let gameWon = false;
let kingTalked = false;
let guardTalked = false;

function isWalkable(f, r, c){
  if(r<0||r>=ROWS||c<0||c>=COLS) return false;
  if(maps[f][r][c]===T.WALL) return false;
  return !entities.some(e=>e.floor===f&&e.x===c&&e.y===r
    && e.type!==ENT.STAIRS&&e.type!==ENT.DOOR);
}

function getEntityAt(f, x, y){
  return entities.find(e=>e.floor===f&&e.x===x&&e.y===y);
}

function getEntityAdjacent(f, x, y){
  return entities.find(e=>e.floor===f
    && Math.abs(e.x-x)+Math.abs(e.y-y)===1
    && (e.type===ENT.KING||e.type===ENT.GUARD));
}

function setMessage(html, duration=0){
  msgText.innerHTML = html;
  if(duration>0) setTimeout(()=>{
    if(msgText.innerHTML===html) msgText.innerHTML = '<span class="system">▼ タップ or 矢印キーで移動 / Zで決定</span>';
  }, duration);
}

function showKingTalk(){
  setMessage('<span class="name">👑 王様</span>「<span class="highlight">よく来たな、勇者よ。</span> わしはこの国を治める王である。魔王を倒すため、<span class="highlight">まずは城の外へ出る</span>がよい。階段を下りて門から出よ！」', 8000);
}

function showGuardTalk(){
  setMessage('<span class="name">🛡 衛兵</span>「<span class="highlight">勇者様</span>、お気をつけて！城外には魔物が溢れております。」', 5000);
}

function showStairsMsg(){
  setMessage('<span class="system">▼ 階段を下りた… 城内1階に着いた。</span>', 3000);
}

function showWin(){
  gameWon = true;
  padStop();
  setMessage('<span class="highlight">★ 城の門をくぐった！ あなたは無事に城からの脱出に成功した！ ★</span><br><span class="system">✨ おめでとうございます！ ✨</span>');
}

function movePlayer(dx, dy){
  if(moving||gameWon) return;
  const nx = player.x + dx;
  const ny = player.y + dy;
  if(dx===0&&dy===1) direction=0;
  else if(dx===-1&&dy===0) direction=1;
  else if(dx===1&&dy===0) direction=2;
  else if(dx===0&&dy===-1) direction=3;

  if(!isWalkable(player.floor, ny, nx)){
    setMessage('<span class="system">その方向へは進めない</span>', 1000);
    draw();
    return;
  }

  const ent = getEntityAt(player.floor, nx, ny);
  if(ent&&ent.type===ENT.STAIRS){
    moving = true;
    player.x = nx; player.y = ny;
    draw();
    setTimeout(()=>{
      player.floor = 1;
      player.x = 6;
      player.y = 5;
      moving = false;
      showStairsMsg();
      updateFloorLabel();
      draw();
    }, 500);
    return;
  }
  if(ent&&ent.type===ENT.DOOR){
    moving = true;
    player.x = nx; player.y = ny;
    draw();
    setTimeout(showWin, 300);
    return;
  }

  player.x = nx;
  player.y = ny;
  draw();
}

function updateFloorLabel(){
  floorLabel.textContent = player.floor===0 ? '🏛 王の間' : '🏰 城内1階';
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const f = player.floor;
  const map = maps[f];

  // tiles
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const x=c*TILE, y=r*TILE;
      switch(map[r][c]){
        case T.WALL:
          ctx.fillStyle='#3a3a5a';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle='#2a2a48';
          ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
          ctx.fillStyle='#48486a';
          ctx.fillRect(x+4,y+4,3,3);
          ctx.fillRect(x+TILE-8,y+4,3,3);
          ctx.fillRect(x+4,y+TILE-8,3,3);
          ctx.fillRect(x+TILE-8,y+TILE-8,3,3);
          break;
        case T.FLOOR:
          ctx.fillStyle=(r+c)%2===0?'#3a3a2a':'#444430';
          ctx.fillRect(x,y,TILE,TILE);
          break;
        case T.RUG:
          ctx.fillStyle='#4a3a2a';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle='#5a4a3a';
          ctx.fillRect(x+4,y+4,TILE-8,2);
          ctx.fillRect(x+4,y+TILE-6,TILE-8,2);
          ctx.fillStyle='#6a5a4a';
          ctx.fillRect(x+6,y+6,4,TILE-12);
          ctx.fillRect(x+TILE-10,y+6,4,TILE-12);
          break;
      }
    }
  }

  // entities
  for(const e of entities){
    if(e.floor!==f) continue;
    const ex=e.x*TILE, ey=e.y*TILE;
    switch(e.type){
      case ENT.KING:
        ctx.fillStyle='#e8c840';
        ctx.beginPath();
        ctx.arc(ex+TILE/2, ey+TILE/2-4, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#c8a020';
        ctx.fillRect(ex+8, ey+TILE/2+4, 24, 18);
        ctx.fillStyle='#f0e0a0';
        ctx.fillRect(ex+12, ey+TILE/2+6, 16, 6);
        ctx.fillStyle='#d0a030';
        for(let i=0;i<3;i++){
          ctx.fillRect(ex+10+i*8, ey+TILE/2-2, 4, 4);
        }
        ctx.fillStyle='#e8d8a0';
        ctx.font='11px monospace';
        ctx.textAlign='center';
        ctx.fillText('王', ex+TILE/2, ey+TILE-6);
        break;
      case ENT.STAIRS:
        ctx.fillStyle='#6a5a4a';
        for(let i=0;i<4;i++){
          ctx.fillRect(ex+8+i*3, ey+TILE-10-i*8, TILE-16-i*6, 6);
        }
        ctx.fillStyle='#8a7a5a';
        ctx.fillRect(ex+TILE/2-1, ey+8, 2, TILE-16);
        break;
      case ENT.GUARD:
        ctx.fillStyle='#6080a0';
        ctx.fillRect(ex+8, ey+8, 24, 28);
        ctx.fillStyle='#80a0c0';
        ctx.fillRect(ex+10, ey+10, 8, 8);
        ctx.fillRect(ex+22, ey+10, 8, 8);
        ctx.fillStyle='#406080';
        ctx.fillRect(ex+6, ey+28, 28, 4);
        ctx.fillStyle='#c0c0c0';
        ctx.font='11px monospace';
        ctx.textAlign='center';
        ctx.fillText('兵', ex+TILE/2, ey+TILE-6);
        break;
      case ENT.DOOR:
        ctx.fillStyle='#6a4a2a';
        ctx.fillRect(ex+2, ey+2, TILE-4, TILE-4);
        ctx.fillStyle='#8a6a3a';
        ctx.fillRect(ex+6, ey+6, TILE-12, TILE-12);
        ctx.fillStyle='#5a3a1a';
        ctx.fillRect(ex+TILE/2-2, ey+4, 4, TILE-8);
        ctx.fillStyle='#c8a040';
        ctx.fillRect(ex+TILE/2-4, ey+TILE/2-4, 8, 8);
        ctx.fillStyle='#f0e0a0';
        ctx.font='10px monospace';
        ctx.textAlign='center';
        ctx.fillText('門', ex+TILE/2, ey+TILE-6);
        break;
    }
  }

  // player
  const px=player.x*TILE, py=player.y*TILE;
  ctx.fillStyle='#4888d0';
  ctx.beginPath();
  ctx.arc(px+TILE/2, py+TILE/2-6, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#3068b0';
  ctx.fillRect(px+8, py+TILE/2+2, 24, 14);
  ctx.fillStyle='#60a0e0';
  ctx.fillRect(px+12, py+TILE/2+4, 6, 4);
  ctx.fillRect(px+22, py+TILE/2+4, 6, 4);
  ctx.fillStyle='#60a0e0';
  ctx.fillRect(px+14, py+TILE/2+10, 12, 2);
  ctx.fillStyle='#d0d0d0';
  ctx.font='11px monospace';
  ctx.textAlign='center';
  ctx.fillText('ゆ', px+TILE/2, py+TILE-6);
}

// input
document.addEventListener('keydown', e=>{
  const key = e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','z','Z'].includes(key)){
    e.preventDefault();
  }
  switch(key){
    case 'ArrowUp': movePlayer(0,-1); break;
    case 'ArrowDown': movePlayer(0,1); break;
    case 'ArrowLeft': movePlayer(-1,0); break;
    case 'ArrowRight': movePlayer(1,0); break;
    case 'z': case 'Z':
      const adj = getEntityAdjacent(player.floor, player.x, player.y);
      if(adj&&adj.type===ENT.KING){
        if(!kingTalked){ kingTalked=true; showKingTalk(); }
        else setMessage('<span class="name">👑 王様</span>「<span class="highlight">階段を下りて門から出るのだ！</span>」', 3000);
      } else if(adj&&adj.type===ENT.GUARD){
        if(!guardTalked){ guardTalked=true; showGuardTalk(); }
        else setMessage('<span class="name">🛡 衛兵</span>「どうか無事で…」', 2500);
      } else {
        setMessage('<span class="system">話しかける相手がいない</span>', 1200);
      }
      break;
  }
});

// virtual pad
const dirMap = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
let repeatTimer = null;

function padStart(dir){
  movePlayer(dir[0], dir[1]);
  if(repeatTimer) clearInterval(repeatTimer);
  repeatTimer = setInterval(()=>movePlayer(dir[0], dir[1]), 180);
}

function padStop(){
  if(repeatTimer){ clearInterval(repeatTimer); repeatTimer = null; }
}

document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const dir = dirMap[btn.dataset.dir];
  if(!dir) return;
  btn.addEventListener('mousedown', e=>{ e.preventDefault(); padStart(dir); });
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); padStart(dir); }, {passive:false});
  btn.addEventListener('mouseup', padStop);
  btn.addEventListener('mouseleave', padStop);
  btn.addEventListener('touchend', padStop);
  btn.addEventListener('touchcancel', padStop);
});

const btnA = document.getElementById('btn-a');
function doAction(){
  const adj = getEntityAdjacent(player.floor, player.x, player.y);
  if(adj&&adj.type===ENT.KING){
    if(!kingTalked){ kingTalked=true; showKingTalk(); }
    else setMessage('<span class="name">👑 王様</span>「<span class="highlight">階段を下りて門から出るのだ！</span>」', 3000);
  } else if(adj&&adj.type===ENT.GUARD){
    if(!guardTalked){ guardTalked=true; showGuardTalk(); }
    else setMessage('<span class="name">🛡 衛兵</span>「どうか無事で…」', 2500);
  } else {
    setMessage('<span class="system">話しかける相手がいない</span>', 1200);
  }
}
btnA.addEventListener('mousedown', e=>{ e.preventDefault(); doAction(); });
btnA.addEventListener('touchstart', e=>{ e.preventDefault(); doAction(); }, {passive:false});

document.addEventListener('mouseup', padStop);
document.addEventListener('touchend', padStop);

// start
updateFloorLabel();
draw();
setTimeout(()=>{
  setMessage('<span class="name">👑 王様</span>「<span class="highlight">おお、目覚めたか勇者よ！</span> よくぞ参った。わしはこの国の王である。話しかけるがよい。<span class="system">（近づいてZキー）</span>」', 6000);
}, 500);
</script>
</body>
</html>
