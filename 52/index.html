<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ラーメン判定ゲーム - ご当地ラーメン早押しバトル</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 100vh;
            background: #1e1e1e;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        /* ヘッダー */
        header {
            background: #2a2a2a;
            padding: 6px 10px;
            border-bottom: 2px solid #ff8c00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .title {
            font-size: 13px;
            font-weight: bold;
            color: #ff8c00;
        }
        .stats {
            font-size: 12px;
            color: #ffdf00;
        }

        /* メインエリア */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px 10px;
            justify-content: space-around;
            overflow-y: auto;
            gap: 4px;
        }

        /* 店主エリア */
        .master-section {
            display: flex;
            align-items: center;
            background: #282828;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 4px 8px;
            gap: 8px;
            flex-shrink: 0;
        }
        .master-avatar {
            width: 38px;
            height: 38px;
            background: #333;
            border: 2px solid #ff8c00;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .speech-bubble {
            flex: 1;
            background: #383838;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            line-height: 1.3;
            min-height: 36px;
            max-height: 50px;
            overflow-y: auto;
            color: #f0f0f0;
        }

        /* ラーメン丼ビジュアルエリア */
        .ramen-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0;
            position: relative;
            flex-shrink: 0;
        }
        canvas {
            background: #111;
            width: 110px;
            height: 110px;
            border: 2px solid #444;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .ramen-info-tag {
            margin-top: 2px;
            font-size: 10px;
            color: #aaa;
            text-align: center;
        }

        /* 特長ログエリア */
        .features-box {
            background: #252525;
            border: 1px dashed #555;
            border-radius: 4px;
            padding: 4px 8px;
            min-height: 45px;
            max-height: 60px;
            overflow-y: auto;
            font-size: 10px;
            color: #00ffcc;
            flex-shrink: 0;
        }
        .features-box ul {
            padding-left: 12px;
        }
        .features-box li {
            margin-bottom: 1px;
        }

        /* 操作・ボタンエリア */
        .control-section {
            padding: 8px 10px;
            background: #252525;
            border-top: 2px solid #444;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            background: #ff8c00;
            color: #111;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px #b36200;
            transition: all 0.1s ease;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px #b36200;
        }
        .btn:disabled {
            background: #555;
            color: #888;
            box-shadow: 0 3px #333;
            cursor: not-allowed;
        }

        /* 4択選択肢グリッド */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .choice-btn {
            background: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            word-break: break-all;
            transition: background 0.2s;
        }
        .choice-btn:hover:not(:disabled) {
            background: #444;
            border-color: #ff8c00;
        }
        .choice-btn.incorrect {
            background: #552222;
            border-color: #ff4444;
            color: #aaa;
            cursor: not-allowed;
        }

        /* スクリーン共通 */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        .screen.active {
            display: flex;
        }

        /* タイトル・リザルト画面 */
        .center-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            gap: 10px;
        }
        .game-title {
            font-size: 20px;
            color: #ff8c00;
            text-shadow: 2px 2px #333;
            line-height: 1.3;
        }
        .game-desc {
            font-size: 12px;
            color: #ccc;
            line-height: 1.4;
            max-width: 300px;
        }
        .result-score {
            font-size: 24px;
            color: #ffdf00;
            margin: 5px 0;
        }
        .badge {
            background: #ff8c00;
            color: #000;
            padding: 3px 8px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .mistake-warning {
            font-size: 10px;
            color: #ff4444;
            text-align: center;
            font-weight: bold;
            height: 14px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- タイトル画面 -->
    <div id="title-screen" class="screen active">
        <header>
            <div class="title">🍜 ラーメン判定道場</div>
            <div class="stats">全40種対応</div>
        </header>
        <div class="center-box">
            <div style="font-size: 48px;">🍥</div>
            <h1 class="game-title">ご当地ラーメン<br>早押し判定バトル</h1>
            <p class="game-desc">
                店主が作り上げるラーメンの特長（スープ、麺、具材）を聞き、全国40種類のご当地ラーメンから見抜け！<br>
                <b>全3杯勝負！誤答は1杯につき1回まで！</b>
            </p>
            <button class="btn" onclick="startGame()" style="width: 80%;">修業を始める</button>
        </div>
        <div style="padding: 10px; text-align: center; font-size: 10px; color: #777;">
            © 2026 ラーメン判定道場
        </div>
    </div>

    <!-- ゲームプレイ画面 -->
    <div id="game-screen" class="screen">
        <header>
            <div class="title" id="stage-indicator">第 1 杯目 / 全 3 杯</div>
            <div class="stats">正解数: <span id="score-val">0</span></div>
        </header>

        <div class="main-content">
            <!-- 店主セリフ -->
            <div class="master-section">
                <div class="master-avatar">👨‍🍳</div>
                <div class="speech-bubble" id="master-speech">
                    「ほう…今日の最初の一杯は何にしようかのう。よく見ておくがいい！」
                </div>
            </div>

            <!-- ラーメン描画 -->
            <div class="ramen-view">
                <canvas id="ramenCanvas" width="120" height="120"></canvas>
                <div class="ramen-info-tag" id="ramen-visual-tag">調理中…</div>
            </div>

            <!-- 特長ログ -->
            <div class="features-box" id="features-log">
                <b>【店主の語り】</b>
                <ul id="features-list">
                    <li>ラーメンを調理中じゃ…</li>
                </ul>
            </div>
            
            <div class="mistake-warning" id="mistake-warning"></div>
        </div>

        <!-- コントロール・回答エリア -->
        <div class="control-section">
            <button id="buzz-btn" class="btn" onclick="onBuzz()" disabled>⏱️ 早押し！回答する！</button>
            <div id="choices-container" class="choices-grid" style="display: none;">
                <!-- 4択ボタンがここに動的生成される -->
            </div>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen">
        <header>
            <div class="title">🏆 修業結果</div>
            <div class="stats">判定終了</div>
        </header>
        <div class="center-box">
            <div style="font-size: 40px;" id="result-emoji">🍜</div>
            <h2 style="font-size: 20px; color: #ff8c00;">判定結果発表</h2>
            <div class="result-score" id="final-score">3問中 3問正解</div>
            <div class="badge" id="result-rank">ラーメン王</div>
            <p class="game-desc" id="result-comment" style="margin-top: 10px;">
                見事な舌だ！全国のご当地ラーメンの味と特長を完全にマスターしておる！
            </p>
            <button class="btn" onclick="startGame()" style="width: 80%; margin-top: 10px;">もう一度挑戦する</button>
        </div>
        <div style="padding: 10px; text-align: center; font-size: 10px; color: #777;">
            お疲れ様でした！
        </div>
    </div>
</div>

    ];

    let currentStage = 0;
    let score = 0;
    let currentRamen = null;
    let distractors = [];
    let mistakes = 0;
    let featureInterval = null;
    let activeFeatureIndex = 0;
    let answered = false;

    // 画面切り替え
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ゲーム開始
    function startGame() {
        currentStage = 0;
        score = 0;
        showScreen('game-screen');
        nextStage();
    }

    // 次の杯へ
    function nextStage() {
        if (currentStage >= 3) {
            showResult();
            return;
        }

        document.getElementById('stage-indicator').innerText = `第 ${currentStage + 1} 杯目 / 全 3 杯`;
        document.getElementById('score-val').innerText = score;
        document.getElementById('mistake-warning').innerText = "";
        
        // ラーメンをランダムに選ぶ
        const randomIndex = Math.floor(Math.random() * RAMEN_DATA.length);
        currentRamen = RAMEN_DATA[randomIndex];

        // 4択を作成（正解1つ ＋ 不正解3つ）
        let pool = RAMEN_DATA.filter(r => r.name !== currentRamen.name);
        pool.sort(() => Math.random() - 0.5);
        distractors = pool.slice(0, 3);
        let choices = [currentRamen, ...distractors];
        choices.sort(() => Math.random() - 0.5);

        // UI初期化
        document.getElementById('buzz-btn').disabled = false;
        document.getElementById('buzz-btn').style.display = 'block';
        document.getElementById('choices-container').style.display = 'none';
        document.getElementById('ramen-visual-tag').innerText = "調理中…";
        
        mistakes = 0;
        answered = false;

        // 丼の描画（最初はぼんやり or 調理中、特徴が出るにつれて完成）
        drawRamen(currentRamen, 0);

        // 店主のセリフと特徴の順次読み上げ開始
        startMasterTalking(choices);
    }

    // 店主のトーク・特徴進行
    function startMasterTalking(choices) {
        const speechEl = document.getElementById('master-speech');
        const listEl = document.getElementById('features-list');
        listEl.innerHTML = '';
        
        speechEl.innerHTML = `「ほう…第${currentStage + 1}杯目のご注文だな。よく見て、特徴を聞くがいい！」`;
        
        activeFeatureIndex = 0;
        const features = currentRamen.features;

        if (featureInterval) clearInterval(featureInterval);

        let step = 0;
        featureInterval = setInterval(() => {
            if (answered) {
                clearInterval(featureInterval);
                return;
            }

            if (step === 0) {
                speechEl.innerHTML = `「このラーメンのスープは『${currentSourcingSoup(currentRamen)}』じゃな。」`;
                listEl.innerHTML += `<li>スープ: ${currentRamen.soupName} (${currentRamen.region})</li>`;
                drawRamen(currentRamen, 1);
            } else if (step === 1) {
                speechEl.innerHTML = `「麺は『${currentRamen.noodleType}』を使用しておるぞ。」`;
                listEl.innerHTML += `<li>麺: ${currentRamen.noodleType}</li>`;
                drawRamen(currentRamen, 2);
            } else if (step === 2) {
                speechEl.innerHTML = `「具材には『${currentRamen.toppings.join('、')}』が乗っとる！」`;
                listEl.innerHTML += `<li>具材: ${currentRamen.toppings.join(', ')}</li>`;
                drawRamen(currentRamen, 3);
            } else if (step === 3) {
                speechEl.innerHTML = `「ふむ…『${features[0]}』という特長もあるぞ。さあ、何かわかったか？」`;
                listEl.innerHTML += `<li>特徴: ${features[0]}</li>`;
                clearInterval(featureInterval);
            }
            step++;
        }, 2000);
    }

    function currentSourcingSoup(r) {
        return r.soupName;
    }

    // 早押しボタンが押されたとき
    function onBuzz() {
        if (answered) return;
        if (featureInterval) clearInterval(featureInterval);

        document.getElementById('master-speech').innerHTML = `「おお、早かったな！さあ、このご当地ラーメンは何じゃ？」`;
        document.getElementById('buzz-btn').style.display = 'none';

        // 選択肢を描画
        let choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';
        choicesContainer.style.display = 'grid';

        // 再度現在のラーメンとダミーをシャッフルしてボタン生成
        let pool = RAMEN_DATA.filter(r => r.name !== currentRamen.name);
        pool.sort(() => Math.random() - 0.5);
        let choices = [currentRamen, pool[0], pool[1], pool[2]];
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(c => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = c.name;
            btn.onclick = () => checkAnswer(c.name, btn);
            choicesContainer.appendChild(btn);
        });
    }

    // 解答チェック
    function checkAnswer(selectedName, btnElement) {
        if (answered) return;

        if (selectedName === currentRamen.name) {
            // 正解
            answered = true;
            score++;
            document.getElementById('master-speech').innerHTML = `「正解じゃ！！見事な舌だ！これは『${currentRamen.name}』（${currentRamen.region}）に間違いない！」`;
            btnElement.style.background = '#15803d';
            btnElement.style.borderColor = '#4ade80';

            disableAllChoices();
            setTimeout(proceedNext, 2500);
        } else {
            // 不正解
            mistakes++;
            if (mistakes >= 1) {
                // 1杯につき1回だけ誤答が許される → 1回間違えたのでこれが最後のチャンス。2回目間違いでゲームオーバー扱いまたは次へ。
                // ユーザー要件：「1杯のラーメンにつき1回だけ誤答が許されます。」
                // つまり、1回不正解してももう一回選べる（2回目の不正解でその杯は失敗）。
                if (mistakes === 1) {
                    document.getElementById('master-speech').innerHTML = `「ぬぬっ、違うわい！もう一度よく考えるんじゃ！（残り誤答チャンス: あと0回）」`;
                    document.getElementById('mistake-warning').innerText = "⚠️ 誤答はあと1回までです！";
                    btnElement.classList.add('incorrect');
                    btnElement.disabled = true;
                } else {
                    // 2回目の間違い → 失敗
                    answered = true;
                    document.getElementById('master-speech').innerHTML = `「そこまでじゃ！不正解じゃ…。正解は『${currentRamen.name}』（${currentRamen.region}）じゃった！」`;
                    highlightCorrectChoice();
                    disableAllChoices();
                    setTimeout(proceedNext, 3000);
                }
            }
        }
    }

    function disableAllChoices() {
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    }

    function highlightCorrectChoice() {
        document.querySelectorAll('.choice-btn').forEach(b => {
            if (b.innerText === currentRamen.name) {
                b.style.background = '#15803d';
                b.style.borderColor = '#4ade80';
            }
        });
    }

    function proceedNext() {
        currentStage++;
        nextStage();
    }

    // ラーメン丼のCanvasドット風描画
    function drawRamen(ramen, phase) {
        const canvas = document.getElementById('ramenCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // 丼の外側（縁）
        ctx.fillStyle = '#f3f4f6';
        ctx.beginPath();
        ctx.arc(w/2, h/2, 54, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d1d5db';
        ctx.stroke();

        // 丼の内側（スープ面）
        ctx.fillStyle = ramen.soupColor;
        ctx.beginPath();
        ctx.arc(w/2, h/2, 46, 0, Math.PI * 2);
        ctx.fill();

        // スープの油膜・グラデーション風ハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(w/2 - 10, h/2 - 10, 22, 0, Math.PI * 2);
        ctx.fill();

        if (phase >= 1) {
            // 麺の描画（うねうねした線）
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(w/2 - 22, h/2 - 15);
            ctx.quadraticCurveTo(w/2, h/2 - 30, w/2 + 22, h/2 - 15);
            ctx.quadraticCurveTo(w/2 + 30, h/2, w/2 + 15, h/2 + 15);
            ctx.quadraticCurveTo(w/2, h/2 + 30, w/2 - 15, h/2 + 15);
            ctx.stroke();
        }

        if (phase >= 2) {
            // 具材の描画
            // チャーシュー（茶色の丸）
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.arc(w/2 - 18, h/2 - 8, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 2;
            ctx.stroke();

            // メンマ（茶色の長方形）
            ctx.fillStyle = '#b45309';
            ctx.fillRect(w/2 + 8, h/2 - 18, 8, 16);

            // ナルト（白とピンクの渦巻き風）
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(w/2 + 15, h/2 + 12, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        if (phase >= 3) {
            // ネギや追加具材（緑のドット）
            ctx.fillStyle = '#22c55e';
            for (let i = 0; i < 6; i++) {
                let angle = (i * Math.PI / 3);
                let cx = w/2 + Math.cos(angle) * 18;
                let cy = h/2 + Math.sin(angle) * 18;
                ctx.fillRect(cx, cy, 3, 3);
            }

            // 海苔またはコーン
            if (ramen.toppings.includes('コーン')) {
                ctx.fillStyle = '#facc15';
                ctx.fillRect(w/2 - 4, h/2 - 25, 5, 5);
                ctx.fillRect(w/2 + 2, h/2 - 28, 5, 5);
            } else if (ramen.toppings.includes('海苔')) {
                ctx.fillStyle = '#172554';
                ctx.fillRect(w/2 - 25, h/2 + 10, 10, 14);
            }
        }
    }

    // リザルト画面表示
    function showResult() {
        showScreen('result-screen');
        document.getElementById('final-score').innerText = `3問中 ${score}問正解`;
        
        let rank = "ラーメン見習い";
        let comment = "まだまだ全国の味を知る必要があるな！もう一度修業してこい！";
        let emoji = "🍜";

        if (score === 3) {
            rank = "特級ラーメン王 🏆";
            comment = "見事全問正解！君の舌はもはや人間国宝レベルだ！どんなご当地ラーメンも一発で見抜く素晴らしい才能じゃ！";
            emoji = "👑";
        } else if (score === 2) {
            rank = "ご当地ラーメンハンター 🥈";
            comment = "お見事！なかなかの名推理だったな。あともう一歩で完璧なラーメン王じゃ！";
            emoji = "🥢";
        } else if (score === 1) {
            rank = "ラーメン好きの一般人 🥉";
            comment = "ふむ、まだ各地の個性がごちゃ混ぜになっているようだな。次は全問正解を目指せ！";
            emoji = "🍥";
        } else {
            rank = "スープを飲む資格なし！？ 💦";
            comment = "なんと全滅とは…！店主泣かせの珍回答じゃ。出直してくるが良い！";
            emoji = "🔥";
        }

        document.getElementById('result-rank').innerText = rank;
        document.getElementById('result-comment').innerText = comment;
        document.getElementById('result-emoji').innerText = emoji;
    }
