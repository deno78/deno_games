<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腹筋を割るゲーム ～暑苦しい筋肉バトル～</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0000 0%, #3a0000 50%, #111 100%);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            padding: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid #ff4500;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #ffcc00;
            text-shadow: 2px 2px #ff0000;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 4px;
        }
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #2b0000 0%, #0d0000 100%);
            border-left: 2px solid #441111;
            border-right: 2px solid #441111;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.3);
        }
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border-bottom: 2px dashed #ff4500;
            font-weight: bold;
            font-size: 1rem;
        }
        .lives {
            color: #ff3333;
            font-size: 1.2rem;
            letter-spacing: 4px;
        }
        .score-info {
            color: #ffcc00;
        }
        /* Timer Bar */
        .timer-container {
            width: 100%;
            height: 8px;
            background: #333;
            position: relative;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff3300);
            width: 100%;
            transition: width 0.1s linear;
        }
        /* Main Visual Stage */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }
        /* Speech Bubble */
        .speech-bubble {
            position: relative;
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 3px solid #ff4500;
            animation: bounce 0.5s infinite alternate;
            min-width: 120px;
            text-align: center;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #fff transparent;
            display: block;
            width: 0;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }
        /* Trainer Graphic */
        .trainer-box {
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255, 69, 0, 0.2);
            border: 3px solid rgba(255, 69, 0, 0.4);
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }
        .trainer-avatar {
            font-size: 7rem;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255,165,0,0.5));
        }
        /* Calculator style abs display */
        .abs-display {
            position: absolute;
            bottom: 15px;
            background: #000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 6px;
            border: 2px solid #00ff66;
            box-shadow: inset 0 0 10px rgba(0,255,102,0.5), 0 0 10px rgba(0,255,102,0.3);
            letter-spacing: 3px;
        }
        .abs-label {
            position: absolute;
            top: 5px;
            font-size: 0.65rem;
            color: #ffaa00;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #ffaa00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Message / Action Feedback */
        .feedback-message {
            height: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            color: #ffcc00;
            text-shadow: 1px 1px #000;
            margin-bottom: 10px;
        }
        /* Buttons Area */
        .button-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px 20px 25px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 3px solid #ff4500;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 5px 0 rgba(0,0,0,0.4), 0 6px 15px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-split {
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: 2px solid #ffd700;
        }
        .btn-by-split {
            background: linear-gradient(135deg, #0077ff, #00bbff);
            border: 2px solid #88ffff;
        }
        .btn-none {
            background: linear-gradient(135deg, #555, #333);
            border: 2px solid #888;
        }
        /* Screens (Start, GameOver, Clear) */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 30px;
            text-align: center;
        }
        .overlay-screen h2 {
            font-size: 2rem;
            color: #ff4500;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000;
        }
        .overlay-screen p {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 25px;
        }
        .start-btn {
            background: linear-gradient(135deg, #ff3300, #ff9900);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px 40px;
            border: 3px solid #ffcc00;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 69, 0, 0.6);
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
        /* Crunch animation state */
        .crunching .trainer-avatar {
            transform: translateY(20px) scaleY(0.85);
        }
    </style>
</head>
<body>

    <header>
        <h1>腹筋を割るゲーム</h1>
        <div class="subtitle">～暑苦しい筋肉バトル～</div>
    </header>

    <div id="game-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="lives" id="lives-display">❤️❤️❤️</div>
            <div class="score-info">クリアまで: <span id="cleared-count">0</span> / 3回</div>
        </div>

        <!-- Timer Bar -->
        <div class="timer-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>

        <!-- Main Stage -->
        <div class="stage" id="stage">
            <div class="speech-bubble" id="speech-bubble">「48だ！」</div>
            
            <div class="trainer-box" id="trainer-box">
                <div class="trainer-avatar" id="trainer-avatar">🏋️‍♂️</div>
                <div class="abs-label">腹筋電卓表示</div>
                <div class="abs-display" id="abs-display">12</div>
            </div>

            <div class="feedback-message" id="feedback-message">計算してボタンを押せ！</div>
        </div>

        <!-- Button Area -->
        <div class="button-area">
            <button class="btn btn-split" onclick="checkAnswer('split')">
                🔥 腹筋を割れるボタン <span style="font-size:0.8rem; opacity:0.8;">(割り切れる)</span>
            </button>
            <button class="btn btn-by-split" onclick="checkAnswer('by-split')">
                💧 腹筋で割れるボタン <span style="font-size:0.8rem; opacity:0.8;">(逆が割り切れる)</span>
            </button>
            <button class="btn btn-none" onclick="checkAnswer('none')">
                ❌ 割れないボタン <span style="font-size:0.8rem; opacity:0.8;">(どちらも割り切れない)</span>
            </button>
        </div>

        <!-- Start Screen -->
        <div class="overlay-screen" id="start-screen">
            <h2>🔥 筋肉燃焼バトル 🔥</h2>
            <p>
                画面中央のトレーナーが腹筋をしながら、電卓の数字（腹筋）と喋る数字（吹き出し）を見せる！<br><br>
                <b>【ルール】</b><br>
                ・腹筋の数字 ÷ 吹き出しの数字 が割り切れる ➔ <b>腹筋を割れるボタン</b><br>
                ・吹き出しの数字 ÷ 腹筋の数字 が割り切れる ➔ <b>腹筋で割れるボタン</b><br>
                ・どちらも割り切れない ➔ <b>割れないボタン</b><br><br>
                制限時間5秒！3回腹筋を割れば勝利！ライフ3でゲームオーバー！
            </p>
            <button class="start-btn" onclick="startGame()">トレーニング開始！！</button>
        </div>

        <!-- Game Over / Clear Screen -->
        <div class="overlay-screen" id="end-screen" style="display: none;">
            <h2 id="end-title">ゲームオーバー</h2>
            <p id="end-message">限界突破できなかったぜ…</p>
            <button class="start-btn" onclick="startGame()">もう一度特訓する！！</button>
        </div>
    </div>

    <script>
        let lives = 3;
        let clearedCount = 0;
        let absNum = 12;
        let speechNum = 4;
        let timerInterval = null;
        let timeLeft = 5000;
        const maxTime = 5000;
        let gameActive = false;
        let crunchCounter = 0;
        let targetCrunchToShow = 3; // 2から5回ごとに見せる

        const livesDisplay = document.getElementById('lives-display');
        const clearedCountDisplay = document.getElementById('cleared-count');
        const timerBar = document.getElementById('timer-bar');
        const speechBubble = document.getElementById('speech-bubble');
        const absDisplay = document.getElementById('abs-display');
        const trainerBox = document.getElementById('trainer-box');
        const feedbackMessage = document.getElementById('feedback-message');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const endTitle = document.getElementById('end-title');
        const endMessage = document.getElementById('end-message');

        function startGame() {
            lives = 3;
            clearedCount = 0;
            crunchCounter = 0;
            targetCrunchToShow = Math.floor(Math.random() * 4) + 2; // 2~5
            updateUI();
            startScreen.style.display = 'none';
            endScreen.style.display = 'none';
            gameActive = true;
            nextRound();
        }

        function updateUI() {
            livesDisplay.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
            clearedCountDisplay.textContent = clearedCount;
        }

        function getRandomTwoDigit() {
            return Math.floor(Math.random() * 90) + 10; // 10~99
        }

        function generateNumbers() {
            // パターンを選定: 
            // 1: 腹筋が吹き出しで割り切れる (split)
            // 2: 吹き出しが腹筋で割り切れる (by-split)
            // 3: どちらも割り切れない (none)
            const modeRand = Math.random();

            if (modeRand < 0.33) {
                // 割れる (absNum % speechNum === 0)
                speechNum = Math.floor(Math.random() * 8 + 2); // 2~9
                const mult = Math.floor(Math.random() * (99 / speechNum - 10 / speechNum + 1)) + Math.floor(10 / speechNum);
                absNum = speechNum * mult;
                if (absNum < 10) absNum = speechNum * Math.ceil(10 / speechNum);
                if (absNum > 99) absNum = speechNum * Math.floor(99 / speechNum);
            } else if (modeRand < 0.66) {
                // 逆で割れる (speechNum % absNum === 0)
                absNum = Math.floor(Math.random() * 8 + 2); // 2~9
                const mult = Math.floor(Math.random() * (99 / absNum - 10 / absNum + 1)) + Math.floor(10 / absNum);
                speechNum = absNum * mult;
                if (speechNum < 10) speechNum = absNum * Math.ceil(10 / absNum);
                if (speechNum > 99) speechNum = absNum * Math.floor(99 / absNum);
            } else {
                // 割れない
                absNum = getRandomTwoDigit();
                speechNum = getRandomTwoDigit();
                // 偶然割れてしまう場合の調整
                while (absNum % speechNum === 0 || speechNum % absNum === 0) {
                    absNum = getRandomTwoDigit();
                    speechNum = getRandomTwoDigit();
                }
            }
        }

        function nextRound() {
            if (!gameActive) return;

            generateNumbers();
            crunchCounter++;

            // トレーナーの動き＆「こちらを向いて腹筋を見せる」演出
            if (crunchCounter >= targetCrunchToShow) {
                crunchCounter = 0;
                targetCrunchToShow = Math.floor(Math.random() * 4) + 2;
                trainerBox.classList.add('crunching');
                feedbackMessage.textContent = "🔥 トレーナーがこちらを向いて腹筋をアピール！ 🔥";
                setTimeout(() => {
                    trainerBox.classList.remove('crunching');
                }, 400);
            } else {
                trainerBox.classList.add('crunching');
                feedbackMessage.textContent = "グッ…！グッグッ…！";
                setTimeout(() => {
                    trainerBox.classList.remove('crunching');
                }, 300);
            }

            absDisplay.textContent = absNum;
            speechBubble.textContent = `「${speechNum} だッ！」`;

            // タイマー開始
            clearInterval(timerInterval);
            timeLeft = maxTime;
            const startTime = Date.now();

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                timeLeft = maxTime - elapsed;
                const percentage = (timeLeft / maxTime) * 100;
                timerBar.style.width = Math.max(0, percentage) + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleMistake("タイムアップ！気合が足りん！！");
                }
            }, 50);
        }

        function checkAnswer(playerChoice) {
            if (!gameActive) return;
            clearInterval(timerInterval);

            const isSplit = (absNum % speechNum === 0);
            const isBySplit = (speechNum % absNum === 0);

            let correctChoice = 'none';
            if (isSplit) correctChoice = 'split';
            else if (isBySplit) correctChoice = 'by-split';

            if (playerChoice === correctChoice) {
                // 正解
                clearedCount++;
                feedbackMessage.textContent = "💥 ナイス筋肉！腹筋がバリバリ割れた！！ 💥";
                updateUI();

                if (clearedCount >= 3) {
                    gameActive = false;
                    setTimeout(gameClear, 600);
                } else {
                    setTimeout(nextRound, 800);
                }
            } else {
                // 不正解
                handleMistake("ぬおおお！押し間違えた or 判断ミスだ！！");
            }
        }

        function handleMistake(msg) {
            lives--;
            updateUI();
            feedbackMessage.textContent = msg;

            if (lives <= 0) {
                gameActive = false;
                setTimeout(gameOver, 800);
            } else {
                setTimeout(nextRound, 1000);
            }
        }

        function gameOver() {
            endTitle.textContent = "🔥 ゲームオーバー 🔥";
            endMessage.innerHTML = "体力尽き果てた……。<br>お前の腹筋はまだプヨプヨだ！<br>もう一度魂を燃やせ！";
            endScreen.style.display = 'flex';
        }

        function gameClear() {
            endTitle.textContent = "🏆 腹筋完全崩壊（クリア） 🏆";
            endMessage.innerHTML = "お見事！バッキバキのシックスパックが完成したぜ！！<br>キミこそ真の筋肉マスターだ！！";
            endScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
