<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏休みの宿題を終わらせよう大作戦</title>
    <style>
        :root {
            --primary: #FF7043;
            --primary-hover: #F4511E;
            --secondary: #42A5F5;
            --success: #66BB6A;
            --warning: #FFA726;
            --danger: #EF5350;
            --bg-color: #FFFDE7;
            --card-bg: #FFFFFF;
            --text-color: #37474F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ヘルパー：日付表示のみ（タイトルなし） */
        header {
            background: linear-gradient(135deg, #FFB74D, #FF7043);
            color: white;
            padding: 12px;
            text-align: center;
        }

        .date-display {
            font-size: 1.6rem;
            font-weight: bold;
            background: rgba(255,255,255,0.25);
            padding: 6px 20px;
            border-radius: 20px;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #FFF3E0;
            padding: 10px;
            border-bottom: 2px solid #FFE0B2;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .status-item span {
            color: #E65100;
        }

        /* アクションボタンエリア（画面上部） */
        .action-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 15px;
            background: #FAFAFA;
            border-bottom: 2px solid #EEEEEE;
        }

        .btn-action {
            background: white;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 12px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .btn-action:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-gentle { border-color: #81C784; color: #2E7D32; background: #F1F8E9; }
        .btn-gentle:hover:not(:disabled) { background: #DCEDC8; }

        .btn-angry { border-color: #E57373; color: #C62828; background: #FFEBEE; }
        .btn-angry:hover:not(:disabled) { background: #FFCDD2; }

        .btn-help { border-color: #64B5F6; color: #1565C0; background: #E3F2FD; }
        .btn-help:hover:not(:disabled) { background: #BBDEFB; }

        .btn-watch { border-color: #FFB74D; color: #EF6C00; background: #FFF3E0; }
        .btn-watch:hover:not(:disabled) { background: #FFE0B2; }

        .btn-icon {
            font-size: 1.4rem;
        }

        /* キャラクター＆リアクション表示エリア */
        .room-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background: #E0F7FA;
            border-bottom: 2px solid #B2EBF2;
            position: relative;
            min-height: 180px;
            justify-content: center;
        }

        .child-avatar {
            font-size: 3.5rem;
            margin-bottom: 8px;
            transition: transform 0.3s;
        }

        .speech-bubble {
            background: white;
            border: 2px solid #00ACC1;
            border-radius: 16px;
            padding: 10px 16px;
            max-width: 90%;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent #00ACC1 transparent;
        }

        /* 宿題進捗表示エリア（画面下部：横2列・縦3列グリッド） */
        .homework-panel {
            padding: 15px;
            background: #FFF;
        }

        .homework-panel h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #546E7A;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }

        .homework-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .homework-item {
            background: #F8F9FA;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hw-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .hw-name {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .progress-bar-container {
            width: 100%;
            background: #E0E0E0;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #66BB6A, #43A047);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 6px;
        }

        .progress-text {
            font-size: 0.75rem;
            color: #78909C;
        }

        /* モーダル / オーバーレイ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-message {
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #555;
        }

        .btn-restart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,112,67,0.4);
            transition: background 0.2s;
        }

        .btn-restart:hover {
            background: var(--primary-hover);
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }

        .start-screen h1 {
            font-size: 1.8rem;
            color: #E65100;
            margin-bottom: 15px;
        }

        .start-screen p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-start {
            background: #66BB6A;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(102,187,106,0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:hover {
            background: #43A047;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container" id="game-container" style="position: relative;">
        <!-- スタート画面 -->
        <div class="start-screen" id="start-screen">
            <h1>📝 夏休みの宿題を終わらせよう大作戦</h1>
            <p>あなたは親となって、小学生の子どもを見守ります。<br>
            ボタンを1回押すと1日が進み、その日の行動結果が決まります。<br>
            7月21日スタート！8月31日までにすべての宿題を完遂させよう！</p>
            <button class="btn-start" onclick="startGame()">作戦スタート！</button>
        </div>

        <!-- ヘルパー：日付表示のみ -->
        <header>
            <div class="date-display" id="date-display">7月 21日 (月)</div>
        </header>

        <div class="status-bar">
            <div class="status-item">残り日数: <span id="days-left">41</span>日</div>
            <div class="status-item">子どもの機嫌: <span id="child-mood">ご機嫌 ☀️</span></div>
            <div class="status-item">疲労度: <span id="child-fatigue">普通 🍵</span></div>
        </div>

        <!-- 画面上部：アクションボタン -->
        <div class="action-panel">
            <button class="btn-action btn-gentle" onclick="performAction('gentle')">
                <span class="btn-icon">💬</span>
                優しく注意する
            </button>
            <button class="btn-action btn-angry" onclick="performAction('angry')">
                <span class="btn-icon">⚡</span>
                怒鳴る
            </button>
            <button class="btn-action btn-help" onclick="performAction('help')">
                <span class="btn-icon">🤝</span>
                親が手伝う
            </button>
            <button class="btn-action btn-watch" onclick="performAction('watch')">
                <span class="btn-icon">👀</span>
                黙って見守る
            </button>
        </div>

        <!-- キャラクター＆リアクションステージ -->
        <div class="room-stage">
            <div class="child-avatar" id="child-avatar">👦</div>
            <div class="speech-bubble" id="speech-bubble">「夏休み始まったばかりだし、まだまだ余裕だよ！」</div>
        </div>

        <!-- 画面下部：宿題進捗状況（横2列・縦3列グリッド） -->
        <div class="homework-panel">
            <h2>📚 宿題の進捗状況</h2>
            <div class="homework-grid" id="homework-list">
                <!-- 動的に生成 (全5項目) -->
            </div>
        </div>
    </div>

    <!-- 結果モーダル -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">ゲームオーバー</div>
            <div class="modal-message" id="modal-message">宿題が終わりませんでした...。</div>
            <button class="btn-restart" onclick="restartGame()">もう一度挑戦する</button>
        </div>
    </div>

    <script>
        // ゲーム状態
        let currentMonth = 7;
        let currentDay = 21;
        let isPlaying = false;
        let mood = 70; // 0 ~ 100
        let fatigue = 10; // 0 ~ 100

        let homeworks = [
            { id: 'math', name: '計算ドリル', progress: 0, max: 100, unit: '%' },
            { id: 'kanji', name: '漢字ドリル', progress: 0, max: 100, unit: '%' },
            { id: 'work', name: '夏休みワーク', progress: 0, max: 100, unit: '%' },
            { id: 'research', name: '自由研究', progress: 0, max: 100, unit: '%' },
            { id: 'essay', name: '読書感想文', progress: 0, max: 100, unit: '%' }
        ];

        const daysOfWeek = ['月', '火', '水', '木', '金', '土', '日'];

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            resetGameState();
            renderHomeworks();
            updateDisplay();
            isPlaying = true;
        }

        function resetGameState() {
            currentMonth = 7;
            currentDay = 21;
            mood = 70;
            fatigue = 10;
            homeworks = [
                { id: 'math', name: '計算ドリル', progress: 0, max: 100, unit: '%' },
                { id: 'kanji', name: '漢字ドリル', progress: 0, max: 100, unit: '%' },
                { id: 'work', name: '夏休みワーク', progress: 0, max: 100, unit: '%' },
                { id: 'research', name: '自由研究', progress: 0, max: 100, unit: '%' },
                { id: 'essay', name: '読書感想文', progress: 0, max: 100, unit: '%' }
            ];
            document.getElementById('result-modal').style.display = 'none';
        }

        function performAction(type) {
            if (!isPlaying) return;

            const avatar = document.getElementById('child-avatar');
            const speech = document.getElementById('speech-bubble');

            let progressGained = 0;

            switch(type) {
                case 'gentle':
                    mood = Math.min(100, mood + 8);
                    fatigue = Math.max(0, fatigue - 4);
                    progressGained = Math.floor(Math.random() * 5) + 3; // 3~7%
                    progressRandomHomework(progressGained);
                    avatar.innerText = '😊';
                    speech.innerText = `「わかったよ、お母さん。コツコツ頑張るね (+${progressGained}%)」`;
                    break;

                case 'angry':
                    mood = Math.max(0, mood - 20);
                    fatigue = Math.min(100, fatigue + 12);
                    progressGained = Math.floor(Math.random() * 8) + 6; // 6~13% (はかどるが機嫌悪化)
                    progressRandomHomework(progressGained);
                    avatar.innerText = '💢';
                    speech.innerText = `「うわっ、怒った！…もー、やるからそんなに怒らないでよ！ (+${progressGained}%)」`;
                    break;

                case 'help':
                    mood = Math.min(100, mood + 12);
                    fatigue = Math.min(100, fatigue + 15);
                    progressGained = Math.floor(Math.random() * 10) + 12; // 12~21% (大きく進む)
                    progressRandomHomework(progressGained);
                    avatar.innerText = '🤩';
                    speech.innerText = `₂「お母さん一緒にやってくれるの！？めちゃはかどる！ (+${progressGained}%)」`;
                    break;

                case 'watch':
                    mood = Math.min(100, mood + 3);
                    fatigue = Math.max(0, fatigue - 5);
                    let r = Math.random();
                    if (r < 0.5) {
                        progressGained = Math.floor(Math.random() * 4) + 2; // 2~5%
                        progressRandomHomework(progressGained);
                        avatar.innerText = '😎';
                        speech.innerText = `「ふふん、自分のペースで結構進んだよ！ (+${progressGained}%)」`;
                    } else {
                        progressGained = 0;
                        avatar.innerText = '📺';
                        speech.innerText = `「…（漫画やテレビに夢中で、今日は全然進まなかった…）」`;
                    }
                    break;
            }

            // 1日経過
            advanceDay();

            renderHomeworks();
            updateDisplay();

            // 終了判定
            if (checkAllCompleted()) {
                endGame(true);
            } else if (isGameOverCondition()) {
                endGame(false);
            }
        }

        function progressRandomHomework(amount) {
            let unfinished = homeworks.filter(h => h.progress < 100);
            if (unfinished.length > 0) {
                let target = unfinished[Math.floor(Math.random() * unfinished.length)];
                target.progress = Math.min(100, target.progress + amount);
            }
        }

        function advanceDay() {
            currentDay++;
            if (currentMonth === 7) {
                if (currentDay > 31) {
                    currentMonth = 8;
                    currentDay = 1;
                }
            } else if (currentMonth === 8) {
                if (currentDay > 31) {
                    // 8/31を超えたら終了判定へ
                    currentDay = 31;
                }
            }

            // 疲労度の自然回復
            fatigue = Math.max(0, fatigue - 3);
        }

        function isGameOverCondition() {
            // 8月31日を過ぎて（あるいは31日で未完了の場合）
            if (currentMonth === 8 && currentDay >= 31 && !checkAllCompleted()) {
                // 最後のターンでまだ終わってなければ判定
                return true;
            }
            return false;
        }

        function getAverageProgress() {
            let total = homeworks.reduce((sum, h) => sum + h.progress, 0);
            return total / homeworks.length;
        }

        function checkAllCompleted() {
            return homeworks.every(h => h.progress >= 100);
        }

        function endGame(isSuccess) {
            isPlaying = false;

            const modal = document.getElementById('result-modal');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');

            if (isSuccess) {
                title.style.color = '#2E7D32';
                title.innerText = '🎉 大成功！夏休み完遂！';
                message.innerHTML = `おめでとうございます！<br>8月31日までにすべての宿題が綺麗に終わりました！<br>晴れやかな気持ちで新学期を迎えられます！`;
            } else {
                title.style.color = '#C62828';
                title.innerText = '💥 ギャー！ゲームオーバー！';
                message.innerHTML = `8月31日を迎えてしまいましたが、宿題が残ってしまいました...。<br>先生に怒られる恐怖の始業式が始まります。`;
            }

            modal.style.display = 'flex';
        }

        function updateDisplay() {
            // 日付表示
            let dayIndex = 0;
            if (currentMonth === 7) {
                dayIndex = currentDay - 21;
            } else {
                dayIndex = (31 - 21 + 1) + (currentDay - 1);
            }
            let dayOfWeek = daysOfWeek[dayIndex % daysOfWeek.length];
            document.getElementById('date-display').innerText = `${currentMonth}月 ${currentDay}日 (${dayOfWeek})`;
            
            let daysLeft = (currentMonth === 7) ? (31 - currentDay + 31) : (31 - currentDay);
            document.getElementById('days-left').innerText = Math.max(0, daysLeft);

            // 機嫌表示
            let moodText = 'ご機嫌 ☀️';
            if (mood <= 30) moodText = '不機嫌 ⛈️';
            else if (mood <= 60) moodText = '普通 ☁️';
            document.getElementById('child-mood').innerText = moodText;

            // 疲労度表示
            let fatigueText = '元気いっぱい ✨';
            if (fatigue >= 70) fatigueText = 'ヘトヘト 💤';
            else if (fatigue >= 40) fatigueText = '少しお疲れ 🍵';
            document.getElementById('child-fatigue').innerText = fatigueText;
        }

        function renderHomeworks() {
            const listContainer = document.getElementById('homework-list');
            listContainer.innerHTML = '';

            homeworks.forEach(hw => {
                let item = document.createElement('div');
                item.className = 'homework-item';
                item.innerHTML = `
                    <div class="hw-info">
                        <div class="hw-name">📄 ${hw.name}</div>
                        <div class="progress-text">${hw.progress} / ${hw.max}${hw.unit}</div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${hw.progress}%;"></div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function restartGame() {
            document.getElementById('result-modal').style.display = 'none';
            resetGameState();
            renderHomeworks();
            updateDisplay();
            isPlaying = true;
            document.getElementById('child-avatar').innerText = '👦';
            document.getElementById('speech-bubble').innerText = '「さあ、今年の夏休みも頑張るぞ〜！」';
        }
    </script>
</body>
</html>
