<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏休みの宿題を終わらせよう大作戦</title>
    <style>
        :root {
            --primary: #FF7043;
            --primary-hover: #F4511E;
            --secondary: #42A5F5;
            --success: #66BB6A;
            --warning: #FFA726;
            --danger: #EF5350;
            --bg-color: #FFFDE7;
            --card-bg: #FFFFFF;
            --text-color: #37474F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #FFB74D, #FF7043);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .date-display {
            font-size: 1.8rem;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #FFF3E0;
            padding: 12px;
            border-bottom: 2px solid #FFE0B2;
            font-weight: bold;
            font-size: 1rem;
        }

        .status-item span {
            color: #E65100;
        }

        /* アクションボタンエリア（画面上部） */
        .action-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 20px;
            background: #FAFAFA;
            border-bottom: 2px solid #EEEEEE;
        }

        @media(min-width: 600px) {
            .action-panel {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .btn-action {
            background: white;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 15px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .btn-action:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-gentle { border-color: #81C784; color: #2E7D32; background: #F1F8E9; }
        .btn-gentle:hover:not(:disabled) { background: #DCEDC8; }

        .btn-angry { border-color: #E57373; color: #C62828; background: #FFEBEE; }
        .btn-angry:hover:not(:disabled) { background: #FFCDD2; }

        .btn-help { border-color: #64B5F6; color: #1565C0; background: #E3F2FD; }
        .btn-help:hover:not(:disabled) { background: #BBDEFB; }

        .btn-watch { border-color: #FFB74D; color: #EF6C00; background: #FFF3E0; }
        .btn-watch:hover:not(:disabled) { background: #FFE0B2; }

        .btn-icon {
            font-size: 1.5rem;
        }

        /* キャラクター＆リアクション表示エリア */
        .room-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #E0F7FA;
            border-bottom: 2px solid #B2EBF2;
            position: relative;
            min-height: 220px;
            justify-content: center;
        }

        .child-avatar {
            font-size: 4rem;
            animation: bounce 1.5s infinite alternate;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .speech-bubble {
            background: white;
            border: 2px solid #00ACC1;
            border-radius: 16px;
            padding: 12px 20px;
            max-width: 90%;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent #00ACC1 transparent;
        }

        /* 宿題進捗表示エリア（画面下部） */
        .homework-panel {
            padding: 20px;
            background: #FFF;
        }

        .homework-panel h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #546E7A;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }

        .homework-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .homework-item {
            background: #F8F9FA;
            border: 1px solid #E0E0E0;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hw-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .hw-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar-container {
            width: 100%;
            background: #E0E0E0;
            border-radius: 8px;
            height: 14px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #66BB6A, #43A047);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 8px;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #78909C;
        }

        /* モーダル / オーバーレイ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-message {
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #555;
        }

        .btn-restart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,112,67,0.4);
            transition: background 0.2s;
        }

        .btn-restart:hover {
            background: var(--primary-hover);
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }

        .start-screen h1 {
            font-size: 2rem;
            color: #E65100;
            margin-bottom: 15px;
        }

        .start-screen p {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-start {
            background: #66BB6A;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(102,187,106,0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:hover {
            background: #43A047;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container" id="game-container" style="position: relative;">
        <!-- スタート画面 -->
        <div class="start-screen" id="start-screen">
            <h1>📝 夏休みの宿題を終わらせよう大作戦</h1>
            <p>あなたは親となって、小学生の子どもを見守ります。<br>
            8月31日までにすべての宿題を終わらせましょう！<br>
            5秒で1日が過ぎます。ボタンを駆使して子どもを導こう！</p>
            <button class="btn-start" onclick="startGame()">作戦スタート！</button>
        </div>

        <header>
            <h1>夏休みの宿題を終わらせよう大作戦</h1>
            <div class="date-display" id="date-display">8月 1日 (木)</div>
        </header>

        <div class="status-bar">
            <div class="status-item">残り日数: <span id="days-left">30</span>日</div>
            <div class="status-item">子どもの機嫌: <span id="child-mood">ご機嫌 ☀️</span></div>
            <div class="status-item">疲労度: <span id="child-fatigue">普通 🍵</span></div>
        </div>

        <!-- 画面上部：アクションボタン -->
        <div class="action-panel">
            <button class="btn-action btn-gentle" onclick="performAction('gentle')">
                <span class="btn-icon">💬</span>
                優しく注意する
            </button>
            <button class="btn-action btn-angry" onclick="performAction('angry')">
                <span class="btn-icon">⚡</span>
                怒鳴る
            </button>
            <button class="btn-action btn-help" onclick="performAction('help')">
                <span class="btn-icon">🤝</span>
                親が手伝う
            </button>
            <button class="btn-action btn-watch" onclick="performAction('watch')">
                <span class="btn-icon">👀</span>
                黙って見守る
            </button>
        </div>

        <!-- キャラクター＆リアクションステージ -->
        <div class="room-stage">
            <div class="child-avatar" id="child-avatar">👦</div>
            <div class="speech-bubble" id="speech-bubble">「まだ夏休みは始まったばかりだし、余裕余裕〜！」</div>
        </div>

        <!-- 画面下部：宿題進捗状況 -->
        <div class="homework-panel">
            <h2>📚 宿題の進捗状況</h2>
            <div class="homework-list" id="homework-list">
                <!-- 動的に生成 -->
            </div>
        </div>
    </div>

    <!-- 結果モーダル -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">ゲームオーバー</div>
            <div class="modal-message" id="modal-message">宿題が終わりませんでした...。</div>
            <button class="btn-restart" onclick="restartGame()">もう一度挑戦する</button>
        </div>
    </div>

    <script>
        // ゲーム状態
        let currentDay = 1; // 1 = 8/1, 31 = 8/31
        let timer = null;
        let isPlaying = false;
        let mood = 70; // 0 ~ 100
        let fatigue = 10; // 0 ~ 100

        let homeworks = [
            { id: 'math', name: '計算ドリル', progress: 0, max: 100, unit: '%' },
            { id: 'kanji', name: '漢字ドリル', progress: 0, max: 100, unit: '%' },
            { id: 'work', name: '夏休みワーク', progress: 0, max: 100, unit: '%' },
            { id: 'research', name: '自由研究', progress: 0, max: 100, unit: '%' },
            { id: 'essay', name: '読書感想文', progress: 0, max: 100, unit: '%' }
        ];

        const daysOfWeek = ['木', '金', '土', '日', '月', '火', '水', '木', '金', '土', '日', '月', '火', '水', '木', '金', '土', '日', '月', '火', '水', '木', '金', '土', '日', '月', '火', '水', '木', '金', '土'];

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            resetGameState();
            renderHomeworks();
            updateDisplay();
            startTimer();
            isPlaying = true;
        }

        function resetGameState() {
            currentDay = 1;
            mood = 70;
            fatigue = 10;
            homeworks = [
                { id: 'math', name: '計算ドリル', progress: 0, max: 100, unit: '%' },
                { id: 'kanji', name: '漢字ドリル', progress: 0, max: 100, unit: '%' },
                { id: 'work', name: '夏休みワーク', progress: 0, max: 100, unit: '%' },
                { id: 'research', name: '自由研究', progress: 0, max: 100, unit: '%' },
                { id: 'essay', name: '読書感想文', progress: 0, max: 100, unit: '%' }
            ];
            document.getElementById('result-modal').style.display = 'none';
        }

        function startTimer() {
            if (timer) clearInterval(timer);
            // 5秒で1日経過
            timer = setInterval(() => {
                advanceDay();
            }, 5000);
        }

        function advanceDay() {
            if (!isPlaying) return;

            // 自然進行による宿題の進み具合（機嫌や疲労度に左右される）
            let progressBonus = 0;
            if (mood > 50 && fatigue < 80) {
                progressBonus = Math.floor(Math.random() * 4) + 2; // 少し進む
            } else if (mood <= 30) {
                progressBonus = 0; // やる気なし
            } else {
                progressBonus = Math.floor(Math.random() * 3);
            }

            if (progressBonus > 0) {
                progressRandomHomework(progressBonus);
            }

            // 日数経過
            currentDay++;

            // 疲労度の自然回復
            fatigue = Math.max(0, fatigue - 5);

            // チェック：ゲーム終了判定
            if (currentDay > 31) {
                checkGameEnd();
                return;
            }

            updateDisplay();
            showDailyEvent();
        }

        function progressRandomHomework(amount) {
            // まだ終わっていない宿題を選ぶ
            let unfinished = homeworks.filter(h => h.progress < 100);
            if (unfinished.length > 0) {
                let target = unfinished[Math.floor(Math.random() * unfinished.length)];
                target.progress = Math.min(100, target.progress + amount);
            }
        }

        function showDailyEvent() {
            const avatar = document.getElementById('child-avatar');
            const speech = document.getElementById('speech-bubble');

            if (currentDay >= 25 && getAverageProgress() < 80) {
                avatar.innerText = '😭';
                speech.innerText = `「やばい！あと${32 - currentDay}日しかないよ〜！助けてお母さん！」`;
            } else if (mood < 30) {
                avatar.innerText = '😡';
                speech.innerText = `「もう勉強なんて嫌だ！ほっといてよ！」`;
            } else if (fatigue > 70) {
                avatar.innerText = '🥱';
                speech.innerText = `「ねむいよ…ちょっと休憩していい？」`;
            } else {
                avatar.innerText = '👦';
                const comments = [
                    "「今日もテレビ見てもいい？」",
                    "「アイス食べたいな〜」",
                    "「宿題、気が向いたらやるよ…」",
                    "「友達と遊んできてもいい？」"
                ];
                speech.innerText = comments[Math.floor(Math.random() * comments.length)];
            }
        }

        function performAction(type) {
            if (!isPlaying) return;

            const avatar = document.getElementById('child-avatar');
            const speech = document.getElementById('speech-bubble');

            switch(type) {
                case 'gentle':
                    mood = Math.min(100, mood + 10);
                    fatigue = Math.max(0, fatigue - 5);
                    // 少し進む
                    progressRandomHomework(Math.floor(Math.random() * 6) + 3);
                    avatar.innerText = '😊';
                    speech.innerText = "「わかったよ、お母さん。今から少しだけやるね。」";
                    break;

                case 'angry':
                    mood = Math.max(0, mood - 25);
                    fatigue = Math.min(100, fatigue + 15);
                    // 怒られて焦って進むが機嫌最悪
                    progressRandomHomework(Math.floor(Math.random() * 10) + 5);
                    avatar.innerText = '💢';
                    speech.innerText = "「うわっ、怒った！…もー、やるからそんなに怒らないでよ！」";
                    break;

                case 'help':
                    mood = Math.min(100, mood + 15);
                    fatigue = Math.min(100, fatigue + 10);
                    // 親が手伝うので大きく進む
                    let unfinished = homeworks.filter(h => h.progress < 100);
                    if (unfinished.length > 0) {
                        let target = unfinished[Math.floor(Math.random() * unfinished.length)];
                        target.progress = Math.min(100, target.progress + 20);
                    }
                    avatar.innerText = '🤩';
                    speech.innerText = "「お母さん手伝ってくれるの！？やったー！めちゃはかどる！」";
                    break;

                case 'watch':
                    // 放置：機嫌は変わらないが、子どもがサボるか勝手にやるかランダム
                    let r = Math.random();
                    if (r < 0.4) {
                        progressRandomHomework(Math.floor(Math.random() * 5) + 2);
                        avatar.innerText = '😎';
                        speech.innerText = "「ふふん、自分のペースで結構進んでるよ！」";
                    } else {
                        avatar.innerText = '📺';
                        speech.innerText = "「…（漫画を読んだりゲームしたりして全く進んでいない）」";
                    }
                    break;
            }

            renderHomeworks();
            updateDisplay();

            // アクション後に全クリア判定
            if (checkAllCompleted()) {
                endGame(true);
            }
        }

        function getAverageProgress() {
            let total = homeworks.reduce((sum, h) => sum + h.progress, 0);
            return total / homeworks.length;
        }

        function checkAllCompleted() {
            return homeworks.every(h => h.progress >= 100);
        }

        function checkGameEnd() {
            isPlaying = false;
            clearInterval(timer);

            if (checkAllCompleted()) {
                endGame(true);
            } else {
                endGame(false);
            }
        }

        function endGame(isSuccess) {
            isPlaying = false;
            clearInterval(timer);

            const modal = document.getElementById('result-modal');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');

            if (isSuccess) {
                title.style.color = '#2E7D32';
                title.innerText = '🎉 大成功！夏休み完遂！';
                message.innerHTML = `おめでとうございます！<br>8月31日までにすべての宿題が綺麗に終わりました！<br>晴れやかな気持ちで新学期を迎えられます！`;
            } else {
                title.style.color = '#C62828';
                title.innerText = '💥 ギャー！ゲームオーバー！';
                message.innerHTML = `8月31日を迎えてしまいましたが、宿題が残ってしまいました...。<br>先生に怒られる恐怖の始業式が始まります。`;
            }

            modal.style.display = 'flex';
        }

        function updateDisplay() {
            // 日付表示
            let dayOfWeek = daysOfWeek[currentDay - 1];
            document.getElementById('date-display').innerText = `8月 ${currentDay}日 (${dayOfWeek})`;
            document.getElementById('days-left').innerText = 32 - currentDay;

            // 機嫌表示
            let moodText = 'ご機嫌 ☀️';
            if (mood <= 30) moodText = '不機嫌 ⛈️';
            else if (mood <= 60) moodText = '普通 ☁️';
            document.getElementById('child-mood').innerText = moodText;

            // 疲労度表示
            let fatigueText = '元気いっぱい ✨';
            if (fatigue >= 70) fatigueText = 'ヘトヘト 💤';
            else if (fatigue >= 40) fatigueText = '少しお疲れ 🍵';
            document.getElementById('child-fatigue').innerText = fatigueText;
        }

        function renderHomeworks() {
            const listContainer = document.getElementById('homework-list');
            listContainer.innerHTML = '';

            homeworks.forEach(hw => {
                let item = document.createElement('div');
                item.className = 'homework-item';
                item.innerHTML = `
                    <div class="hw-info">
                        <div class="hw-name">📄 ${hw.name}</div>
                        <div class="progress-text">${hw.progress} / ${hw.max}${hw.unit}</div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${hw.progress}%;"></div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function restartGame() {
            document.getElementById('result-modal').style.display = 'none';
            resetGameState();
            renderHomeworks();
            updateDisplay();
            startTimer();
            isPlaying = true;
            document.getElementById('child-avatar').innerText = '👦';
            document.getElementById('speech-bubble').innerText = '「さあ、今年の夏休みも頑張るぞ〜！」';
        }
    </script>
</body>
</html>
