<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16bit ドット絵 弦楽器クイズ</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #12121c;
            color: #f0f0f5;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e1e2f;
            border: 4px solid #4a4a75;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            color: #ffd700;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 2px 2px #552200;
        }
        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
        /* ステータスバー */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 15px;
            background: #2a2a40;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #5a5a85;
        }
        /* キャンバス（ドット絵表示） */
        .canvas-container {
            position: relative;
            background: #0d0d15;
            border: 4px solid #6c6c9e;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 220px;
            height: 220px;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 192px;
            height: 192px;
        }
        .play-sound-hint {
            font-size: 0.8rem;
            color: #90caf9;
            margin-bottom: 12px;
            cursor: pointer;
            text-decoration: underline;
        }
        .play-sound-hint:hover {
            color: #bbdefb;
        }
        /* ヒント・フレーバーテキスト */
        .flavor-box {
            font-size: 0.85rem;
            color: #a0a0c0;
            text-align: center;
            min-height: 40px;
            margin-bottom: 15px;
            padding: 0 10px;
            line-height: 1.4;
        }
        /* 4択ボタン */
        .choices-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .choice-btn {
            background: #2c2c4a;
            color: #fff;
            border: 3px solid #6b6bb8;
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            box-shadow: 0 4px #18182b;
        }
        .choice-btn:hover {
            background: #3c3c6a;
            border-color: #8b8be8;
        }
        .choice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #18182b;
        }
        .choice-btn.correct {
            background: #2e7d32 !important;
            border-color: #66bb6a !important;
        }
        .choice-btn.incorrect {
            background: #c62828 !important;
            border-color: #ef5350 !important;
        }
        /* コントロールボタン */
        .action-btn {
            background: #d4af37;
            color: #12121c;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px #7a6012;
            transition: all 0.1s ease;
            margin-top: 10px;
        }
        .action-btn:hover {
            background: #f7d248;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #7a6012;
        }
        /* 結果画面 */
        .result-card {
            background: #252538;
            border: 3px dashed #7a7ab5;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        .result-score {
            font-size: 2rem;
            color: #ffd700;
            margin: 10px 0;
            text-shadow: 2px 2px #440000;
        }
        .result-comment {
            font-size: 0.95rem;
            color: #d0d0f0;
            line-height: 1.5;
        }
        .sound-fx-badge {
            font-size: 0.75rem;
            background: #442255;
            color: #ddaaff;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #8844aa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎸 16bit 弦楽器クイズ 🎻</h1>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <div style="font-size: 3rem; margin: 20px 0;">🎸🎻🪕</div>
        <p style="text-align: center; font-size: 0.9rem; line-height: 1.6; margin-bottom: 25px; color: #d0d0e0;">
            16ビット風ドット絵で描かれた<br>ネック付き弦楽器の名前を当てよう！<br>
            音色を聴くヒント機能付き♪<br>全5問の正答率を競うのだ！
        </p>
        <button class="action-btn" onclick="startGame()">ゲームスタート</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen hidden">
        <div class="status-bar">
            <span id="question-count">もんだい: 1 / 5</span>
            <span id="score-count">スコア: 0pt</span>
        </div>

        <div class="sound-fx-badge" id="instrument-hint">ドット絵弦楽器</div>

        <div class="canvas-container">
            <canvas id="pixel-canvas" width="24" height="24"></canvas>
        </div>

        <div class="play-sound-hint" onclick="playCurrentInstrumentSound()">🔊 この楽器の音を聴いてみる</div>

        <div class="flavor-box" id="flavor-text">
            この楽器の特徴やいかに…？
        </div>

        <div class="choices-grid" id="choices-grid">
            <!-- 4択ボタンがここに動的生成されます -->
        </div>

        <button class="action-btn hidden" id="next-btn" onclick="nextQuestion()">つぎの問題へ</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="result-card">
            <h2>結果発表</h2>
            <div class="result-score" id="final-score">5 / 5 問正解</div>
            <div class="result-comment" id="final-comment">
                すばらしい！あなたは弦楽器マスターです！
            </div>
        </div>
        <button class="action-btn" onclick="restartGame()">もう一度チャレンジ</button>
    </div>
</div>

<script>
    // Web Audio APIによる楽器別シンセサウンドジェネレーター
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type, pitch = 220) {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'guitar') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(pitch, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
            osc.start(now);
            osc.stop(now + 1.2);
        } else if (type === 'contrabass') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch * 0.5, now);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
            osc.start(now);
            osc.stop(now + 1.8);
        } else if (type === 'viola') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(pitch * 1.2, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
            osc.start(now);
            osc.stop(now + 1.5);
        } else if (type === 'violin') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(pitch * 2, now);
            const vibrato = audioCtx.createOscillator();
            const vibratoGain = audioCtx.createGain();
            vibrato.frequency.value = 6;
            vibratoGain.gain.value = 8;
            vibrato.connect(osc.frequency);
            vibrato.start(now);
            vibrato.stop(now + 1.5);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
            osc.start(now);
            osc.stop(now + 1.5);
        } else if (type === 'mandolin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch * 1.5, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            osc.start(now);
            osc.stop(now + 0.9);
        } else if (type === 'shamisen') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(pitch * 1.25, now);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            osc.start(now);
            osc.stop(now + 0.7);
        } else if (type === 'ukulele') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pitch * 2.5, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.start(now);
            osc.stop(now + 0.8);
        } else if (type === 'cello') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(pitch * 0.75, now);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
            osc.start(now);
            osc.stop(now + 1.6);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pitch, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
            osc.start(now);
            osc.stop(now + 1.0);
        }
    }

                ctx.fillRect(10, 1, 4, 3);

                ctx.fillRect(11, 7, 2, 1);
                ctx.fillRect(11, 10, 2, 1);
                ctx.fillStyle = '#d2691e';
                for (let y = 13; y <= 21; y++) {
                    let w = 0;
                    if (y === 13 || y === 21) w = 3;
                    else if (y === 14 || y === 20) w = 5;
                    else w = 7;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                ctx.fillStyle = '#a0522d';
                for (let y = 15; y <= 19; y++) {
                    let w = 0;
                    if (y === 15 || y === 19) w = 3;

                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                ctx.fillStyle = '#111';
                ctx.fillRect(11, 17, 2, 2);
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 2, 1, 20);
                ctx.fillRect(12, 2, 1, 20);

        },
        {
            name: "コントラバス",
            soundType: "contrabass",

                }
                ctx.fillStyle = '#111';
                ctx.fillRect(10, 16, 1, 3);
                ctx.fillRect(13, 16, 1, 3);
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 1, 1, 18);
                ctx.fillStyle = '#000';
                ctx.fillRect(10, 19, 4, 2);
            }
        },
        {
            name: "マンドリン",
            soundType: "mandolin",
            pitch: 330,
            flavor: "洋ナシを半分に割ったような丸い裏板が特徴。トレモロ奏法が有名！",
            draw: function(ctx) {

            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(11, 2, 2, 11);
                ctx.fillStyle = '#deb887';
                ctx.fillRect(9, 0, 6, 3);
                ctx.fillStyle = '#d2691e';
                for (let y = 13; y <= 22; y++) {
                    let w = 0;
                    if (y >= 13 && y <= 15) w = 5 + (y - 13);
                    else if (y >= 16 && y <= 22) w = 7;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 2, 1, 20);
                ctx.fillRect(12, 2, 1, 20);
            }
        },
        {
            name: "バンジョー",
            soundType: "guitar",
            pitch: 349,
            flavor: "太鼓のような円形のボディに膜が張られた、カントリー音楽で大人気の楽器。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);
                ctx.fillStyle = '#deb887';
                ctx.fillRect(11, 1, 2, 11);
                ctx.fillStyle = '#b5651d';
                ctx.fillRect(10, 0, 4, 2);
                ctx.fillStyle = '#f5deb3';
                for (let y = 12; y <= 22; y++) {
                    let w = 0;
                    if (y === 12 || y === 22) w = 3;
                    else if (y === 13 || y === 21) w = 6;
                    else w = 7;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                ctx.fillStyle = '#888';
                ctx.fillRect(10, 15, 4, 4);
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 1, 1, 21);
                ctx.fillRect(12, 1, 1, 21);
            }
        },
        {
            name: "シタール",
            soundType: "viola",
            pitch: 261,
            flavor: "インドの伝統的な弦楽器。たくさんの共鳴弦を持ち、独特の響きを奏でる。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);
                ctx.fillStyle = '#deb887';
                ctx.fillRect(10, 0, 4, 15);
                ctx.fillStyle = '#cd853f';
                for (let y = 16; y <= 22; y++) {
                    let w = 0;
                    if (y === 16 || y === 22) w = 3;
                    else if (y >= 17 && y <= 19) w = 6;
                    else w = 5;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(10, 0, 4, 1);
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 0, 1, 22);
                ctx.fillRect(12, 0, 1, 22);
            }
        },
        {
            name: "三線",
            soundType: "shamisen",
            pitch: 247,
            flavor: "沖縄の伝統的な3弦楽器。蛇の皮が張られており、明るい音色が特徴。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(11, 2, 2, 13);
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(10, 1, 4, 2);
                ctx.fillStyle = '#e0a96d';
                ctx.fillRect(8, 15, 8, 7);
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(8, 14, 8, 1);
                ctx.fillRect(8, 22, 8, 1);
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 2, 1, 20);
                ctx.fillRect(12, 2, 1, 20);
            }
        },
        {
            name: "二胡",
            soundType: "violin",
            pitch: 349,
            flavor: "中国の伝統的な2弦の拉弦楽器。人間の歌声のように豊かな音色。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);
                ctx.fillStyle = '#654321';
                ctx.fillRect(11, 1, 2, 14);
                ctx.fillStyle = '#3d2817';
                ctx.fillRect(10, 0, 4, 2);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(9, 15, 6, 6);
                ctx.fillStyle = '#d2b48c';
                ctx.fillRect(10, 16, 4, 4);
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 1, 1, 20);
                ctx.fillRect(12, 1, 1, 20);
            }
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const canvas = document.getElementById('pixel-canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    function startGame() {
        initAudio();
        let shuffled = [...instruments].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 5);
        currentIndex = 0;
        score = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        loadQuestion();
    }

    function playCurrentInstrumentSound() {
        const q = currentQuestions[currentIndex];
        playSound(q.soundType, q.pitch);
    }

    function loadQuestion() {
        answered = false;
        document.getElementById('next-btn').classList.add('hidden');
        
        const q = currentQuestions[currentIndex];
        document.getElementById('question-count').innerText = `もんだい: ${currentIndex + 1} / 5`;
        document.getElementById('score-count').innerText = `スコア: ${score}pt`;
        document.getElementById('instrument-hint').innerText = "16bit ドット絵 弦楽器";
        document.getElementById('flavor-text').innerText = "この楽器の名前はな～んだ？（4択から選んでね）";

        q.draw(ctx);
        playCurrentInstrumentSound();

        let choices = [q.name];
        while (choices.length < 4) {
            let randomInst = instruments[Math.floor(Math.random() * instruments.length)].name;
            if (!choices.includes(randomInst)) {
                choices.push(randomInst);
            }
        }
        choices.sort(() => 0.5 - Math.random());

        const grid = document.getElementById('choices-grid');
        grid.innerHTML = '';
        choices.forEach(choiceName => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choiceName;
            btn.onclick = () => selectAnswer(choiceName, q.name, btn);
            grid.appendChild(btn);
        });
    }

    function selectAnswer(selected, correct, btnElement) {
        if (answered) return;
        answered = true;

        const buttons = document.querySelectorAll('.choice-btn');
        buttons.forEach(btn => {
            if (btn.innerText === correct) {
                btn.classList.add('correct');
            } else if (btn === btnElement && selected !== correct) {
                btn.classList.add('incorrect');
            }
            btn.disabled = true;
        });

        const flavorBox = document.getElementById('flavor-text');
        const q = currentQuestions[currentIndex];

        if (selected === correct) {
            score += 20;
            document.getElementById('score-count').innerText = `スコア: ${score}pt`;
            flavorBox.innerHTML = `<span style="color: #66bb6a; font-weight: bold;">【正解！】</span><br>${q.flavor}`;
            playSound('violin', 523);
        } else {
            flavorBox.innerHTML = `<span style="color: #ef5350; font-weight: bold;">【不正解…】正解は「${correct}」だよ！</span><br>${q.flavor}`;
            playSound('contrabass', 110);
        }

        const nextBtn = document.getElementById('next-btn');
        if (currentIndex < 4) {
            nextBtn.innerText = "つぎの問題へ";
        } else {
            nextBtn.innerText = "結果を見る";
        }
        nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < 5) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = `${score} / 100 pt (${score / 20}問正解)`;

        let comment = "";
        if (score === 100) {
            comment = "パーフェクト！あなたは完全無欠の弦楽器ソムリエです！！すばらしい！";
        } else if (score >= 80) {
            comment = "お見事！かなりの弦楽器通ですね！ドット絵と音色を見分ける目が鋭い！";
        } else if (score >= 40) {
            comment = "なかなかやりますね！色々な弦楽器の音と形を覚えてもっとマスターしよう！";
        } else {
            comment = "ドンマイ！ネック付き弦楽器は奥が深い…。もう一度挑戦して全問正解を目指そう！";
        }
        document.getElementById('final-comment').innerText = comment;
    }

    function restartGame() {
        startGame();
    }
</script>
