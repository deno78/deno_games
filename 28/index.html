<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画次巻発行日当てゲーム ～最新刊はいつ出る！？～</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
        }
        .pixel-border {
            box-shadow: 4px 4px 0px #0f3460;
            border: 2px solid #e94560;
        }
        .pixel-btn {
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 3px 3px 0px #0f3460;
            border: 2px solid #e94560;
        }
        .pixel-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #0f3460;
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #0f3460;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- ヘッダー -->
    <header class="text-center my-2">
        <h1 class="text-3xl md:text-4xl font-bold tracking-wider text-yellow-400 drop-shadow-[2px_2px_0px_#e94560]">
            漫画次巻発行日当てゲーム
        </h1>
        <p class="text-sm text-gray-300 mt-1">～次の一冊が出るまでどれだけ待った！？～</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-2xl bg-[#16213e] p-6 rounded-none pixel-border flex flex-col items-center relative">

        <!-- ステータス表示 -->
        <div class="w-full flex justify-between items-center bg-[#0f3460] p-3 mb-4 border border-yellow-500 text-sm md:text-base text-yellow-300">
            <div id="manga-title-display" class="font-bold">作品: 選択中...</div>
            <div id="progress-display" class="font-bold">巻数: 1 / --</div>
            <div id="lives-display" class="text-red-400">💖💖💖</div>
        </div>

        <!-- ドット絵アニメーションキャンバス (キャラクターが漫画を読む) -->
        <div class="w-full bg-black mb-6 border-2 border-gray-700 flex justify-center items-center overflow-hidden relative" style="height: 180px;">
            <canvas id="animCanvas" width="400" height="180" class="w-full max-w-[400px] h-[180px] image-rendering-pixelated"></canvas>
            <div id="reading-status" class="absolute bottom-2 right-2 text-xs text-green-400 bg-black/80 px-2 py-1 border border-green-500">
                読書中... 📖
            </div>
        </div>

        <!-- クイズエリア -->
        <div id="quiz-container" class="w-full text-center">
            <div id="question-text" class="text-lg md:text-xl mb-6 text-white leading-relaxed">
                ゲームスタートを押してください
            </div>

            <!-- 選択肢 (3カ月, 6カ月, 1年, 3年, 10年) -->
            <div id="choices-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                <!-- 動的生成 -->
            </div>
        </div>

        <!-- スタート / リスタート画面 -->
        <div id="start-screen" class="absolute inset-0 bg-[#16213e]/95 flex flex-col items-center justify-center p-6 z-10">
            <h2 class="text-2xl text-yellow-400 mb-4 font-bold">挑戦するモードを選べ！</h2>
            <p class="text-sm text-gray-300 mb-6 text-center">
                名作漫画の「次巻が出るまでの期間」を当てろ！<br>
                ミスは3回まで。最終巻まで読み切れ！
            </p>
            <div class="flex flex-col gap-3 w-full max-w-xs">
                <button onclick="startGame('all')" class="pixel-btn bg-yellow-500 text-black font-bold py-3 px-6 text-lg">
                    📚 全作制覇モード (全14作品)
                </button>
                <button onclick="startGame('random')" class="pixel-btn bg-blue-500 text-white font-bold py-3 px-6 text-lg">
                    🎲 ランダム単発モード
                </button>
            </div>
        </div>

        <!-- 結果 / ゲームオーバー画面 -->
        <div id="result-screen" class="absolute inset-0 bg-[#16213e]/95 hidden flex flex-col items-center justify-center p-6 z-10 text-center">
            <h2 id="result-title" class="text-3xl font-bold mb-4">結果</h2>
            <div id="result-message" class="text-lg text-white mb-6"></div>
            <div id="masked-title-reveal" class="text-xl text-yellow-400 font-bold mb-6 bg-black/50 p-3 border border-yellow-500 w-full"></div>
            <button onclick="resetToTitle()" class="pixel-btn bg-green-500 text-black font-bold py-3 px-8 text-lg">
                タイトルに戻る
            </button>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-xs text-gray-400 mt-4 text-center">
        <p>※発行時期・間隔は作品の歴史や休載状況に基づくフィクション/概算データを含みます。</p>
        <p>© 2026 漫画次巻発行日当てゲーム製作委員会</p>
    </footer>

    <script>
        // 漫画データベース (14作品)
        const mangaDatabase = [
            {
                name: "北斗の拳",
                masked: "北〇の拳",
                hint: "1980年代を駆け抜けた世紀末バトル漫画の金字塔",
                totalVol: 27,
                // 基本3ヶ月ペース
                getInterval: (vol) => 3
            },
            {
                name: "キン肉マン",
                masked: "キ◯肉マン",
                hint: "友情・努力・勝利！平成・令和編も大熱狂の超人プロレス",
                totalVol: 85,
                getInterval: (vol) => vol > 40 ? (vol % 5 === 0 ? 12 : 6) : 3 // 後半は発行ペースが不定期/半期〜1年
            },
            {
                name: "ONE PIECE",
                masked: "〇ンピース",
                hint: "海賊王を目指す少年と仲間たちの大航海ロマン",
                totalVol: 111,
                getInterval: (vol) => 3 // 基本3〜4ヶ月
            },
            {
                name: "ドラゴンボール",
                masked: "ドラ〇ンボール",
                hint: "世界中が夢中になった神龍と7つの球を巡る冒険",
                totalVol: 42,
                getInterval: (vol) => 3
            },
            {
                name: "こちら葛飾区亀有公園前派出所",
                masked: "こち◯め",
                hint: "東京の下町を舞台にした両さんのお騒がせ日常",
                totalVol: 200,
                getInterval: (vol) => 3
            },
            {
                name: "BASTARD!! -暗黒の破壊神-",
                masked: "バスタ◯ド",
                hint: "ダークファンタジーの傑作だが、後半は伝説の超スローペース",
                totalVol: 27,
                getInterval: (vol) => vol > 24 ? 120 : (vol > 20 ? 36 : 6) // 後半3年、ラスト付近は10年(120ヶ月)
            },
            {
                name: "強殖装甲ガイバー",
                masked: "ガイバ◯",
                hint: "降臨者の遺産「ユニット」を纏った少年のSFバイオアクション",
                totalVol: 32,
                getInterval: (vol) => vol > 25 ? 60 : 12 // 後半は数年〜
            },
            {
                name: "ファイブスター物語",
                masked: "F〇S",
                hint: "永野護が描く圧倒的スケールのロボット＆星団史",
                totalVol: 18,
                getInterval: (vol) => 36 // ほぼ3年毎
            },
            {
                name: "DEATH NOTE",
                masked: "デスノ◯ト",
                hint: "名前を書かれた人間が死ぬノートを巡る頭脳戦サスペンス",
                totalVol: 12,
                getInterval: (vol) => 3
            },
            {
                name: "鬼滅の刃",
                masked: "鬼◯の刃",
                hint: "家族を殺した鬼を討つため、炭治郎が剣士の道を歩む",
                totalVol: 23,
                getInterval: (vol) => 3
            },
            {
                name: "彼方のアストラ",
                masked: "彼方のアス◯ラ",
                hint: "宇宙旅行に出発した少年少女たちが体験する驚愕のSFサバイバル",
                totalVol: 5,
                getInterval: (vol) => 3
            },
            {
                name: "ガラスの仮面",
                masked: "ガラスの仮○",
                hint: "演劇の天才・北島マヤの執念と「紅天女」への道のり",
                totalVol: 49,
                getInterval: (vol) => 60 // 5年〜10年（3年 or 10年が正解になりやすい）
            },
            {
                name: "名探偵コナン",
                masked: "名探偵コ◯ン",
                hint: "見た目は子供、頭脳は大人！黒ずくの組織を追う推理漫画",
                totalVol: 105,
                getInterval: (vol) => 6 // 年2冊ペース
            },
            {
                name: "ゴルゴ13",
                masked: "ゴルゴ1◯",
                hint: "超A級スナイパー・デューク東郷のハードボイルド劇画",
                totalVol: 215,
                getInterval: (vol) => 3 // 年3〜4冊ペース
            }
        ];

        // 選択肢の定義 (月数 -> 表示ラベル)
        const choicesConfig = [
            { months: 3, label: "3カ月" },
            { months: 6, label: "6カ月" },
            { months: 12, label: "1年" },
            { months: 36, label: "3年" },
            { months: 120, label: "10年" }
        ];

        let currentMode = 'all';
        let mangaQueue = [];
        let currentMangaIndex = 0;
        let currentManga = null;
        let currentVol = 1;
        let lives = 3;
        let score = 0;
        let correctAnswerMonths = 3;

        // ドット絵アニメーション用キャンバス
        const canvas = document.getElementById('animCanvas');
        const ctx = canvas.getContext('2d');
        let animFrame = 0;

        function drawPixelArt() {
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 部屋の背景（本棚と机）
            ctx.fillStyle = '#16213e';
            ctx.fillRect(20, 20, 360, 140);

            // 本棚の背表紙
            for(let i=0; i<10; i++) {
                ctx.fillStyle = (i % 2 === 0) ? '#e94560' : '#f0a500';
                ctx.fillRect(30 + i * 32, 30, 26, 40);
            }

            // 机
            ctx.fillStyle = '#b8860b';
            ctx.fillRect(100, 120, 200, 15);
            ctx.fillRect(120, 135, 20, 25);
            ctx.fillRect(260, 135, 20, 25);

            // キャラクター（読書男 / ドット絵風）
            let bounce = Math.floor(animFrame / 15) % 2;
            
            // 体
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(170, 95 - bounce, 60, 35);
            // 頭
            ctx.fillStyle = '#fcd34d';
            ctx.fillRect(180, 70 - bounce, 40, 30);
            // 髪
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(180, 68 - bounce, 40, 10);
            // 目
            ctx.fillStyle = '#000';
            ctx.fillRect(195, 82 - bounce, 4, 4);
            ctx.fillRect(205, 82 - bounce, 4, 4);

            // 開いた本
            ctx.fillStyle = '#fff';
            ctx.fillRect(170, 105 - bounce, 60, 20);
            ctx.fillStyle = '#d1d5db';
            ctx.fillRect(198, 105 - bounce, 4, 20); // ページの真ん中

            // パラパラめくるアニメーション効果 (たまに紙が舞う)
            if (Math.floor(animFrame / 30) % 2 === 0) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(235, 95 - bounce, 12, 12);
                ctx.fillStyle = '#000';
                ctx.font = '10px sans-serif';
                ctx.fillText('📖', 235, 105 - bounce);
            }

            animFrame++;
            requestAnimationFrame(drawPixelArt);
        }
        requestAnimationFrame(drawPixelArt);

        function startGame(mode) {
            currentMode = mode;
            lives = 3;
            score = 0;
            currentMangaIndex = 0;

            if (mode === 'all') {
                mangaQueue = [...mangaDatabase];
            } else {
                // ランダムに1作品選ぶ
                const randomIndex = Math.floor(Math.random() * mangaDatabase.length);
                mangaQueue = [mangaDatabase[randomIndex]];
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            loadNextManga();
        }

        function loadNextManga() {
            if (currentMangaIndex >= mangaQueue.length) {
                endGame(true, "すべての漫画をクリアしました！大読書家マスター！");
                return;
            }

            currentManga = mangaQueue[currentMangaIndex];
            currentVol = 1;
            nextQuestion();
        }

        function nextQuestion() {
            if (currentVol >= currentManga.totalVol) {
                // この漫画の最終巻に到達！次の漫画へ
                currentMangaIndex++;
                if (currentMangaIndex < mangaQueue.length) {
                    alert(`『${currentManga.masked}』を全巻読破！次の漫画へ進みます。`);
                    loadNextManga();
                } else {
                    endGame(true, `すべてのステージをクリアしました！`);
                }
                return;
            }

            // ステータス更新
            document.getElementById('manga-title-display').innerText = `作品: 読書中... (ヒント: ${currentManga.hint.substring(0, 16)}...)`;
            document.getElementById('progress-display').innerText = `巻数: ${currentVol}巻 ➔ ${currentVol + 1}巻`;
            document.getElementById('lives-display').innerText = '💖'.repeat(lives);

            // 問題文の設定
            document.getElementById('question-text').innerHTML = 
                `この作品の <span class="text-yellow-400">第${currentVol}巻</span> から <span class="text-yellow-400">第${currentVol + 1}巻</span> が発売されるまでの期間は？<br>` +
                `<span class="text-xs text-gray-400">（ヒント: ${currentManga.hint}）</span>`;

            // 正解の間隔を算出 (月数)
            const rawMonths = currentManga.getInterval(currentVol + 1);

            // 最も近い選択肢を正解にする
            let closest = choicesConfig[0];
            let minDiff = Math.abs(choicesConfig[0].months - rawMonths);
            for (let c of choicesConfig) {
                let diff = Math.abs(c.months - rawMonths);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = c;
                }
            }
            correctAnswerMonths = closest.months;

            // 選択肢ボタンのシャッフル＆描画
            let shuffledChoices = [...choicesConfig];
            // シャッフル
            shuffledChoices.sort(() => Math.random() - 0.5);

            const choicesDiv = document.getElementById('choices-container');
            choicesDiv.innerHTML = '';
            shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'pixel-btn bg-[#0f3460] hover:bg-[#e94560] text-white font-bold py-3 px-4 rounded text-base border border-yellow-500 transition-colors';
                btn.innerText = choice.label;
                btn.onclick = () => checkAnswer(choice.months);
                choicesDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedMonths) {
            const isCorrect = (selectedMonths === correctAnswerMonths);

            if (isCorrect) {
                score += 100;
                currentVol++;
                // 正解演出
                showToast("正解！ 📖✨ 次の巻へ進みます！", "text-green-400");
                setTimeout(nextQuestion, 1000);
            } else {
                lives--;
                document.getElementById('lives-display').innerText = '💖'.repeat(lives);
                showToast(`不正解… 💦 (正解は ${formatMonths(correctAnswerMonths)})`, "text-red-400");

                if (lives <= 0) {
                    setTimeout(() => {
                        endGame(false, `ライフが0になりました…`);
                    }, 1000);
                } else {
                    // 同じ巻または次の巻に進むか、次の問題へ
                    currentVol++;
                    setTimeout(nextQuestion, 1200);
                }
            }
        }

        function formatMonths(m) {
            if (m < 12) return m + "カ月";
            if (m === 12) return "1年";
            if (m === 36) return "3年";
            if (m >= 60) return (m/12) + "年";
            return (m/12) + "年";
        }

        function showToast(text, colorClass) {
            const qText = document.getElementById('question-text');
            const original = qText.innerHTML;
            qText.innerHTML = `<span class="${colorClass} font-bold text-xl">${text}</span>`;
            setTimeout(() => {
                // nextQuestionで上書きされる
            }, 1000);
        }

        function endGame(isClear, message) {
            document.getElementById('result-screen').classList.remove('hidden');
            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-message');
            const maskedReveal = document.getElementById('masked-title-reveal');

            if (isClear) {
                resultTitle.innerText = "🎉 GAME CLEAR! 🎉";
                resultTitle.className = "text-3xl font-bold mb-4 text-green-400";
            } else {
                resultTitle.innerText = "💀 GAME OVER 💀";
                resultTitle.className = "text-3xl font-bold mb-4 text-red-500";
            }

            resultMsg.innerHTML = `${message}<br>スコア: ${score}点`;

            // 要求事項：クリア時、またはゲームオーバー時に、漫画のタイトルを一部伏字にして表示してください。
            maskedReveal.innerHTML = `読んでいた(挑戦した)作品:<br><span class="text-2xl text-yellow-300 font-bold">${currentManga ? currentManga.masked : "不明"}</span><br><span class="text-xs text-gray-300">(正解タイトル: ${currentManga ? currentManga.name : ""})</span>`;
        }

        function resetToTitle() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
