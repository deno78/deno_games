<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逆インベーダー ～インベーダー軍団の逆襲～ (Inverse Space Invaders)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #0b0b16;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 2px;
            text-align: center;
            text-shadow: 0 0 10px #00ffcc;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #ff3366;
            margin-bottom: 8px;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 3 / 4;
            background: #000;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            touch-action: none;
        }
        .ui-panel {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            background: #111122;
            padding: 8px 12px;
            border: 3px solid #00ffcc;
            border-top: none;
            font-size: 0.85rem;
        }
        .controls {
            width: 100%;
            max-width: 480px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }
        .btn {
            background: #111;
            color: #ff3366;
            border: 2px solid #ff3366;
            padding: 12px 24px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
            box-shadow: 0 0 5px rgba(255,51,102,0.3);
            width: 100%;
        }
        .btn:hover:not(:disabled) {
            background: #ff3366;
            color: #000;
            box-shadow: 0 0 15px #ff3366;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .btn:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h2 {
            font-size: 1.8rem;
            color: #ff3366;
            margin-bottom: 12px;
            text-shadow: 0 0 15px #ff3366;
        }
        #overlay p {
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ccc;
        }
        .start-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 15px #00ffcc;
            transition: 0.2s;
        }
    </style>
</head>
<body>

    <h1>逆インベーダー</h1>
    <div class="subtitle">～ファイターを撃破せよ！～</div>

    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        
        <div id="overlay">
            <h2 id="overlay-title">逆インベーダー</h2>
            <p id="overlay-desc">
                あなたはインベーダー軍団の司令官です。<br>
                画面下部エリアをタップすると、その位置から<br>
                ランダムなインベーダーが出撃します (COST 25)<br>
                UFOボタンで上空にUFOを発進！ (COST 60)<br><br>
                [敗北条件] 制限時間60秒経過で防衛成功され敗北！
            </p>
            <button class="start-btn" id="startBtn" onclick="startGame()">ゲームスタート</button>
        </div>
    </div>

    <div class="ui-panel">
        <div>ENERGY: <span id="energyVal" style="color:#ffff33; font-weight:bold;">100</span></div>
        <div>TIME: <span id="timeVal" style="color:#ff3366; font-weight:bold;">60</span>s</div>
        <div>WAVE: <span id="waveVal" style="color:#00ffcc; font-weight:bold;">1</span></div>
        <div>SCORE: <span id="scoreVal" style="color:#fff; font-weight:bold;">0</span></div>
    </div>

    <div class="controls">
        <button class="btn btn-ufo" id="ufoBtn" onclick="spawnUFO()">🛸 UFO出撃 (COST 60)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲームステート
        let gameState = 'START'; // START, PLAYING, GAMEOVER, CLEAR
        let score = 0;
        let energy = 100;
        let maxEnergy = 100;
        let wave = 1;
        let fighterHP = 100;
        let maxFighterHP = 100;
        let timeLeft = 60;
        let timeCount = 0;

        // エンティティ
        let fighter = null;
        let invaders = [];
        let ufo = null;
        let bullets = [];
        let particles = [];
        let floatingTexts = [];

        // ファイタークラス（超高性能AI）
        class Fighter {
            constructor() {
                this.x = canvas.width / 2;
                this.y = 80;
                this.w = 32;
                this.h = 24;
                this.vx = 0;
                this.speed = 3.5;
                this.shootCooldown = 0;
            }

            update() {
                let targetX = canvas.width / 2;
                let nearestThreat = null;
                let minDst = 9999;
                let dangerX = null;
                let closestBulletDist = 999;

                for (let b of bullets) {
                    if (b.fromFighter) continue;
                    let dx = b.x - this.x;
                    let dy = this.y - b.y;
                    if (dy > -10 && dy < 150 && Math.abs(dx) < 40) {
                        if (Math.abs(dx) < closestBulletDist) {
                            closestBulletDist = Math.abs(dx);
                            dangerX = b.x;
                        }
                    }
                }

                if (dangerX !== null) {
                    targetX = this.x < dangerX ? this.x - 50 : this.x + 50;
                } else {
                    for (let inv of invaders) {
                        let dst = Math.hypot(inv.x - this.x, inv.y - this.y);
                        if (dst < minDst) {
                            minDst = dst;
                            nearestThreat = inv;
                        }
                    }

                    if (nearestThreat) {
                        targetX = nearestThreat.x;
                    } else if (ufo) {
                        targetX = ufo.x;
                    } else {
                        targetX = canvas.width / 2 + Math.sin(Date.now() / 500) * 100;
                    }
                }

                targetX = Math.max(40, Math.min(canvas.width - 40, targetX));

                if (this.x < targetX) {
                    this.vx = this.speed;
                    if (this.x + this.vx > targetX) this.x = targetX;
                    else this.x += this.vx;
                } else if (this.x > targetX) {
                    this.vx = -this.speed;
                    if (this.x + this.vx < targetX) this.x = targetX;
                    else this.x += this.vx;
                }

                this.shootCooldown--;
                if (this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = Math.max(12, 30 - wave * 2);
                }
            }

            shoot() {
                bullets.push({
                    x: this.x,
                    y: this.y + this.h / 2,
                    vx: 0,
                    vy: 7,
                    fromFighter: true,
                    radius: 3
                });
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#00ffcc';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ctx.moveTo(0, 14);
                ctx.lineTo(-16, -10);
                ctx.lineTo(-6, -6);
                ctx.lineTo(0, -10);
                ctx.lineTo(6, -6);
                ctx.lineTo(16, -10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ff3366';
                ctx.fillRect(-2, -4, 4, 6);

                ctx.fillStyle = '#ffff33';
                ctx.fillRect(-4, -14, 2, 4);
                ctx.fillRect(2, -14, 2, 4);

                ctx.restore();
            }
        }

        // インベーダークラス
        class Invader {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 0:イカ(小), 1:タコ(中), 2:カニ(大)
                this.w = 28;
                this.h = 20;
                this.hp = type === 0 ? 1 : type === 1 ? 2 : 4;
                this.maxHp = this.hp;
                this.vy = -1.2 - type * 0.2;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.shootTimer = Math.random() * 60;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;

                if (this.x < 20 || this.x > canvas.width - 20) {
                    this.vx *= -1;
                }

                this.shootTimer++;
                if (this.shootTimer > 90 + Math.random() * 40) {
                    this.shootTimer = 0;
                    bullets.push({
                        x: this.x,
                        y: this.y - 10,
                        vx: 0,
                        vy: -4,
                        fromFighter: false,
                        radius: 2.5
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.type === 0 ? '#ff3366' : this.type === 1 ? '#ff9900' : '#ffff33';
                
                if (this.type === 0) {
                    ctx.fillRect(-8, -8, 16, 12);
                    ctx.fillRect(-12, -2, 4, 8);
                    ctx.fillRect(8, -2, 4, 8);
                } else if (this.type === 1) {
                    ctx.fillRect(-10, -8, 20, 14);
                    ctx.fillRect(-12, 2, 4, 6);
                    ctx.fillRect(-4, 2, 3, 8);
                    ctx.fillRect(1, 2, 3, 8);
                    ctx.fillRect(8, 2, 4, 6);
                } else {
                    ctx.fillRect(-12, -8, 24, 12);
                    ctx.fillRect(-16, -10, 6, 4);
                    ctx.fillRect(10, -10, 6, 4);
                    ctx.fillRect(-10, 4, 4, 6);
                    ctx.fillRect(6, 4, 4, 6);
                }

                if (this.hp < this.maxHp) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-12, -14, 24, 3);
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(-12, -14, (this.hp / this.maxHp) * 24, 3);
                }

                ctx.restore();
            }
        }

        // UFOクラス
        class UFO {
            constructor() {
                this.x = -30;
                this.y = 140;
                this.w = 40;
                this.h = 16;
                this.vx = 2.5;
                this.hp = 15;
                this.maxHp = 15;
            }

            update() {
                this.x += this.vx;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ff00ff';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(0, -4, 8, Math.PI, 0, false);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.fillRect(-16, -14, 32, 3);
                ctx.fillStyle = '#ff3366';
                ctx.fillRect(-16, -14, (this.hp / this.maxHp) * 32, 3);

                ctx.restore();
            }
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            score = 0;
            energy = 100;
            wave = 1;
            fighterHP = 100;
            maxFighterHP = 100;
            timeLeft = 60 + (wave - 1) * 10;
            timeCount = 0;
            invaders = [];
            bullets = [];
            particles = [];
            ufo = null;
            fighter = new Fighter();
            gameState = 'PLAYING';
            updateUI();
        }

        function spawnUFO() {
            if (gameState !== 'PLAYING') return;
            if (energy < 60) {
                showFloatingText("エネルギー不足！ (60必要)", canvas.width / 2, canvas.height - 50, '#ff3366');
                return;
            }
            if (ufo) {
                showFloatingText("すでにUFOが出撃中です！", canvas.width / 2, canvas.height - 50, '#ff3366');
                return;
            }
            energy -= 60;
            ufo = new UFO();
            showFloatingText("UFO出撃！", canvas.width / 2, canvas.height - 50, '#ff00ff');
            updateUI();
        }

        // タップ/クリック位置の正確な取得
        function handleCanvasInput(clientX, clientY) {
            if (gameState !== 'PLAYING') return;

            const rect = canvas.getBoundingClientRect();
            // CSS上の表示サイズとCanvas内部解像度の比率を計算
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            // 下部エリア（y > 450）でのみ出撃可能
            if (clickY < 450) {
                showFloatingText("画面下部をタップして出撃！", clickX, clickY, '#ff3366');
                return;
            }

            if (energy < 25) {
                showFloatingText("エネルギー不足！ (25必要)", clickX, clickY, '#ff3366');
                return;
            }

            // ランダムにインベーダーの種類を決定 (コスト25)
            let type = Math.random() < 0.5 ? 0 : Math.random() < 0.8 ? 1 : 2;
            invaders.push(new Invader(clickX, clickY, type));
            energy -= 25;
            showFloatingText("インベーダー発進！", clickX, clickY, '#ffff33');
            updateUI();
        }

        canvas.addEventListener('click', (e) => {
            handleCanvasInput(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleCanvasInput(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault(); // ダブルタップズームなどを防止
            }
        }, { passive: false });

        function showFloatingText(text, x, y, color = '#fff') {
            floatingTexts.push({ text, x, y, alpha: 1.0, color });
        }

        function addExplosion(x, y, color = '#00ffcc', count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1.0,
                    decay: Math.random() * 0.03 + 0.02,
                    color
                });
            }
        }

        function updateUI() {
            document.getElementById('energyVal').innerText = Math.floor(energy);
            document.getElementById('timeVal').innerText = Math.ceil(timeLeft);
            document.getElementById('waveVal').innerText = wave;
            document.getElementById('scoreVal').innerText = score;
        }

        // メインループ
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景の星空エフェクト
            ctx.fillStyle = '#ffffff11';
            for (let i = 0; i < 30; i++) {
                let sx = (i * 37) % canvas.width;
                let sy = (i * 73 + Date.now() * 0.05) % canvas.height;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }

            if (gameState === 'PLAYING') {
                timeCount++;
                if (timeCount >= 60) {
                    timeCount = 0;
                    timeLeft--;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        gameState = 'GAMEOVER';
                        triggerGameOver(false, "タイムアップ！ファイターに防衛されてしまった…");
                    }
                    updateUI();
                }

                if (energy < maxEnergy) {
                    energy += 0.12;
                    if (energy > maxEnergy) energy = maxEnergy;
                    updateUI();
                }

                if (fighter) {
                    fighter.update();
                    fighter.draw();

                    ctx.fillStyle = '#333';
                    ctx.fillRect(canvas.width / 2 - 60, 15, 120, 8);
                    ctx.fillStyle = '#ff3366';
                    ctx.fillRect(canvas.width / 2 - 60, 15, (fighterHP / maxFighterHP) * 120, 8);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(canvas.width / 2 - 60, 15, 120, 8);
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('FIGHTER HP', canvas.width / 2, 12);
                }

                if (ufo) {
                    ufo.update();
                    ufo.draw();
                    if (ufo.x > canvas.width + 40) {
                        ufo = null;
                    }
                }

                for (let i = invaders.length - 1; i >= 0; i--) {
                    let inv = invaders[i];
                    inv.update();
                    inv.draw();

                    if (fighter && Math.hypot(inv.x - fighter.x, inv.y - fighter.y) < 25) {
                        fighterHP -= 15;
                        addExplosion(fighter.x, fighter.y, '#ff3366', 20);
                        showFloatingText("衝突ダメージ！ -15", fighter.x, fighter.y - 20, '#ff3366');
                        invaders.splice(i, 1);
                        if (fighterHP <= 0) {
                            gameState = 'CLEAR';
                            triggerGameOver(true);
                        }
                        continue;
                    }

                    if (inv.y < 40) {
                        invaders.splice(i, 1);
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    ctx.fillStyle = b.fromFighter ? '#00ffcc' : '#ffff33';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (b.y < 0 || b.y > canvas.height || b.x < 0 || b.x > canvas.width) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    if (b.fromFighter) {
                        let hit = false;
                        if (ufo && Math.hypot(b.x - ufo.x, b.y - ufo.y) < 22) {
                            ufo.hp--;
                            hit = true;
                            addExplosion(b.x, b.y, '#ff00ff', 5);
                            if (ufo.hp <= 0) {
                                score += 500;
                                addExplosion(ufo.x, ufo.y, '#ff00ff', 30);
                                showFloatingText("+500 UFO擊破!", ufo.x, ufo.y, '#ff00ff');
                                ufo = null;
                            }
                        } else {
                            for (let j = invaders.length - 1; j >= 0; j--) {
                                let inv = invaders[j];
                                if (Math.abs(b.x - inv.x) < 16 && Math.abs(b.y - inv.y) < 14) {
                                    inv.hp--;
                                    hit = true;
                                    addExplosion(b.x, b.y, '#ffff33', 6);
                                    if (inv.hp <= 0) {
                                        score += (inv.type + 1) * 100;
                                        showFloatingText("撃墜！", inv.x, inv.y, '#ff3366');
                                        invaders.splice(j, 1);
                                    }
                                    break;
                                }
                            }
                        }

                        if (hit) {
                            bullets.splice(i, 1);
                            updateUI();
                            continue;
                        }
                    }
                }

                // 出撃可能エリアガイドライン
                ctx.strokeStyle = '#00ffcc33';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(0, 450);
                ctx.lineTo(canvas.width, 450);
                ctx.stroke();
                ctx.setLineDash([]);

                if (fighterHP <= 0) {
                    gameState = 'CLEAR';
                    triggerGameOver(true);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.restore();
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 0.8;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 12px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        function triggerGameOver(isClear, customMsg) {
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('startBtn');

            overlay.style.display = 'flex';
            if (isClear) {
                title.innerText = 'VICTORY! 侵略成功！';
                title.style.color = '#00ffcc';
                desc.innerHTML = `見事ファイターを撃破しました！<br>最終スコア: ${score}<br>インベーダー軍団の勝利です！`;
                btn.innerText = '次のウェーブへ (難易度UP)';
                btn.onclick = nextWave;
            } else {
                title.innerText = 'GAME OVER';
                title.style.color = '#ff3366';
                desc.innerHTML = `${customMsg || 'インベーダー軍団が敗北しました…'}<br>最終スコア: ${score}`;
                btn.innerText = 'もう一度挑戦する';
                btn.onclick = startGame;
            }
        }

        function nextWave() {
            wave++;
            maxFighterHP += 30;
            fighterHP = maxFighterHP;
            energy = 100;
            timeLeft = 60 + (wave - 1) * 10;
            timeCount = 0;
            invaders = [];
            bullets = [];
            ufo = null;
            fighter = new Fighter();
            fighter.speed += 0.5;

            document.getElementById('overlay').style.display = 'none';
            gameState = 'PLAYING';
            updateUI();
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
