<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本列島台風シミュレーター</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.9);
            --border-color: #374151;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            overflow: hidden;
        }

        header {
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 1.2rem;
            background: linear-gradient(90deg, #60a5fa, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 480px;
            width: 100%;
            height: calc(100vh - 40px);
            justify-content: flex-start;
            align-items: center;
        }

        .canvas-wrapper {
            position: relative;
            background: #020617;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            flex-grow: 1;
            max-height: 52vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }

        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        label span {
            color: var(--text-main);
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
            cursor: pointer;
            height: 20px;
        }

        .radio-group {
            display: flex;
            gap: 6px;
        }

        .radio-btn {
            flex: 1;
            background: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .radio-btn.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.4);
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-align: center;
            border: 1px solid #1e293b;
        }

        .status-grid div span {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content h2 {
            font-size: 1.4rem;
            color: #f87171;
        }

        .rank-badge {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fbbf24;
            margin: 2px 0;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            text-align: left;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .stat-grid span {
            font-weight: bold;
            color: #60a5fa;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>🇯🇵 日本列島台風シミュレーター</h1>
        </header>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="simCanvas" width="450" height="420"></canvas>
        </div>

        <!-- Status Summary -->
        <div class="status-grid">
            <div>気圧<span id="statPressure" style="color:var(--accent-red)">900hPa</span></div>
            <div>風速<span id="statWind">65m/s</span></div>
            <div>ランク<span id="statRank" style="color:#fbbf24">猛烈な</span></div>
            <div>被害<span id="statDamage" style="color:var(--accent-green)">0億</span></div>
        </div>

        <!-- Controls -->
        <div class="control-panel">
            <div class="control-row">
                <div class="control-group">
                    <label>射出角度: <span id="valAngle">50</span>°</label>
                    <input type="range" id="inputAngle" min="20" max="90" step="2" value="50">
                </div>
                <div class="control-group">
                    <label>移動速度: <span id="valSpeed">30</span>km/h</label>
                    <input type="range" id="inputSpeed" min="15" max="55" step="5" value="30">
                </div>
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label>渦の回転方向 (自転効果)</label>
                    <div class="radio-group">
                        <div class="radio-btn selected" id="rotCounter" onclick="setRotation(-1)">左回り(反時計)</div>
                        <div class="radio-btn" id="rotClock" onclick="setRotation(1)">右回り(時計)</div>
                    </div>
                </div>
            </div>

            <button class="btn" id="btnLaunch" onclick="launchTyphoon()">台風発令・出撃！</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>台風消滅・結果発表</h2>
            <div class="rank-badge" id="modalRank">Sランク</div>
            <p id="modalComment" style="font-size:0.85rem; color:var(--text-muted);">日本列島に甚大な被害をもたらしました！</p>
            
            <div class="stat-grid">
                <div>直撃都市: <span id="resHitCount">0</span> / 7</div>
                <div>最高風速: <span id="resMaxWind">0</span> m/s</div>
                <div>最低気圧: <span id="resMinPressure">0</span> hPa</div>
                <div>最終被害: <span id="resTotalDamage">0</span> 億円</div>
            </div>

            <button class="btn" onclick="closeModal()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Cities data mapped to canvas 450x420
        const cities = [
            { name: "福岡", lat: 33.59, lon: 130.40, pop: 160, hit: false, damage: 0 },
            { name: "広島", lat: 34.38, lon: 132.45, pop: 110, hit: false, damage: 0 },
            { name: "大阪", lat: 34.69, lon: 135.50, pop: 880, hit: false, damage: 0 },
            { name: "名古屋", lat: 35.18, lon: 136.90, pop: 230, hit: false, damage: 0 },
            { name: "東京", lat: 35.68, lon: 139.69, pop: 1400, hit: false, damage: 0 },
            { name: "仙台", lat: 38.26, lon: 140.87, pop: 110, hit: false, damage: 0 },
            { name: "札幌", lat: 43.06, lon: 141.35, pop: 190, hit: false, damage: 0 },
        ];

        function project(lat, lon) {
            const minLon = 127.5, maxLon = 144.5;
            const minLat = 30.0, maxLat = 45.0;
            const x = ((lon - minLon) / (maxLon - minLon)) * canvas.width;
            const y = canvas.height - ((lat - minLat) / (maxLat - minLat)) * canvas.height;
            return { x, y };
        }

        // Simplified Japan Islands outline polygons (Lat, Lon)
        const japanPolygons = [
            // Kyushu
            [[31.2,130.2],[33.8,130.0],[34.0,131.2],[32.5,131.8],[31.3,131.2]],
            // Shikoku
            [[32.8,132.5],[34.2,133.5],[33.5,134.6],[32.7,133.0]],
            // Honshu
            [[33.8,131.0],[34.3,132.5],[35.0,134.5],[34.5,135.5],[35.2,136.8],[34.6,137.2],[35.5,139.8],[37.0,141.0],[41.3,141.5],[40.3,142.2],[38.2,141.2],[37.2,139.0],[37.5,139.2],[36.5,136.8],[35.5,135.5],[34.5,133.0],[33.8,131.0]],
            // Hokkaido
            [[41.4,140.0],[42.2,139.8],[43.4,141.2],[45.4,141.6],[45.5,142.5],[43.2,143.2],[42.8,144.8],[42.0,143.0],[42.0,140.8],[41.4,140.0]]
        ];

        function isLand(x, y) {
            const minLon = 127.5, maxLon = 144.5;
            const minLat = 30.0, maxLat = 45.0;
            const lon = minLon + (x / canvas.width) * (maxLon - minLon);
            const lat = minLat + ((canvas.height - y) / canvas.height) * (maxLat - minLat);

            for (let poly of japanPolygons) {
                if (pointInPolygon(lat, lon, poly)) return true;
            }
            return false;
        }

        function pointInPolygon(lat, lon, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i][1], yi = poly[i][0];
                let xj = poly[j][1], yj = poly[j][0];
                let intersect = ((yi > lat) !== (yj > lat)) &&
                    (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Fixed spawn pos: South-West islands (Okinawa/Sakishima area)
        const spawnPoint = { lat: 26.5, lon: 127.8 };

        let simState = {
            active: false,
            x: 0,
            y: 0,
            pressure: 900,
            speed: 30,
            angle: 50,
            rotation: -1,
            maxWind: 65,
            minPressure: 900,
            totalDamage: 0,
            particles: [],
            pathHistory: [],
            elapsedFrames: 0
        };

        const inputAngle = document.getElementById('inputAngle');
        const inputSpeed = document.getElementById('inputSpeed');
        const valAngle = document.getElementById('valAngle');
        const valSpeed = document.getElementById('valSpeed');
        const statPressure = document.getElementById('statPressure');
        const statWind = document.getElementById('statWind');
        const statRank = document.getElementById('statRank');
        const statDamage = document.getElementById('statDamage');

        inputAngle.addEventListener('input', () => { valAngle.textContent = inputAngle.value; draw(); });
        inputSpeed.addEventListener('input', () => { valSpeed.textContent = inputSpeed.value; });

        function setRotation(dir) {
            simState.rotation = dir;
            document.getElementById('rotCounter').classList.toggle('selected', dir === -1);
            document.getElementById('rotClock').classList.toggle('selected', dir === 1);
        }

        function getRank(pressure) {
            if (pressure < 920) return { name: "猛烈な", color: "#ef4444" };
            if (pressure < 950) return { name: "非常に強い", color: "#f97316" };
            if (pressure < 970) return { name: "強い", color: "#facc15" };
            return { name: "並の台風", color: "#60a5fa" };
        }

        function launchTyphoon() {
            const sp = project(spawnPoint.lat, spawnPoint.lon);
            simState.x = sp.x;
            simState.y = sp.y;
            simState.active = true;
            simState.pressure = 900;
            simState.speed = parseInt(inputSpeed.value) / 12;
            simState.angle = parseInt(inputAngle.value);
            simState.minPressure = 900;
            simState.totalDamage = 0;
            simState.pathHistory = [];
            simState.elapsedFrames = 0;

            cities.forEach(c => { c.hit = false; c.damage = 0; });

            simState.particles = [];
            for (let i = 0; i < 50; i++) {
                simState.particles.push({
                    angle: Math.random() * Math.PI * 2,
                    dist: 15 + Math.random() * 60,
                    speed: 0.04 + Math.random() * 0.04
                });
            }

            document.getElementById('btnLaunch').disabled = true;
            document.getElementById('btnLaunch').style.opacity = '0.5';
        }

        function update() {
            if (!simState.active) return;

            simState.elapsedFrames++;

            const rad = (simState.angle - 90) * (Math.PI / 180);
            simState.x += Math.cos(rad) * simState.speed;
            simState.y += Math.sin(rad) * simState.speed;

            if (simState.elapsedFrames % 4 === 0) {
                simState.pathHistory.push({ x: simState.x, y: simState.y });
            }

            const onLand = isLand(simState.x, simState.y);
            if (onLand) {
                simState.pressure += 0.2;
                if (simState.pressure > 1000) simState.pressure = 1000;
            } else {
                if (simState.pressure > 895) simState.pressure -= 0.04;
            }

            if (simState.pressure < simState.minPressure) {
                simState.minPressure = Math.round(simState.pressure);
            }

            let calculatedWind = Math.round(Math.max(15, (1010 - simState.pressure) * 1.2));
            simState.maxWind = Math.max(simState.maxWind, calculatedWind);

            const typhoonRadius = Math.max(30, (1010 - simState.pressure) * 0.6);
            cities.forEach((c) => {
                const pos = project(c.lat, c.lon);
                const dist = Math.hypot(simState.x - pos.x, simState.y - pos.y);
                if (dist < typhoonRadius && !c.hit) {
                    c.hit = true;
                    const dmg = Math.round(c.pop * (calculatedWind * 2.0) * (onLand ? 1.1 : 0.8));
                    c.damage = dmg;
                    simState.totalDamage += dmg;
                }
            });

            statPressure.textContent = Math.round(simState.pressure) + "hPa";
            statWind.textContent = calculatedWind + "m/s";
            const rank = getRank(simState.pressure);
            statRank.textContent = rank.name;
            statRank.style.color = rank.color;
            statDamage.textContent = (simState.totalDamage).toLocaleString() + "億";

            if (simState.x < -30 || simState.x > canvas.width + 30 || simState.y < -30 || simState.y > canvas.height + 30 || simState.elapsedFrames > 1000) {
                endSimulation();
            }
        }

        function endSimulation() {
            simState.active = false;
            document.getElementById('btnLaunch').disabled = false;
            document.getElementById('btnLaunch').style.opacity = '1';

            const hitCount = cities.filter(c => c.hit).length;
            let rankStr = "Sランク";
            let comment = "日本列島に甚大な被害をもたらしました！";
            
            if (simState.totalDamage > 40000) rankStr = "神話級 (SSS)";
            else if (simState.totalDamage > 20000) rankStr = "超特級 (SS)";
            else if (simState.totalDamage > 8000) rankStr = "甚大災害級 (S)";
            else if (simState.totalDamage > 2000) rankStr = "大規模台風 (A)";
            else rankStr = "通常台風 (B)";

            document.getElementById('modalRank').textContent = rankStr;
            document.getElementById('modalComment').textContent = comment;
            document.getElementById('resHitCount').textContent = hitCount;
            document.getElementById('resMaxWind').textContent = simState.maxWind;
            document.getElementById('resMinPressure').textContent = simState.minPressure;
            document.getElementById('resTotalDamage').textContent = simState.totalDamage.toLocaleString() + " 億円";

            document.getElementById('resultModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw simplified map labels / grid
            ctx.strokeStyle = 'rgba(51, 65, 85, 0.2)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Japan landmasses
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;

            japanPolygons.forEach(poly => {
                ctx.beginPath();
                poly.forEach((pt, idx) => {
                    const p = project(pt[0], pt[1]);
                    if (idx === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // Draw spawn marker
            const sp = project(spawnPoint.lat, spawnPoint.lon);
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = '#93c5fd';
            ctx.font = '10px sans-serif';
            ctx.fillText('発生 (南西諸島)', sp.x + 8, sp.y + 3);

            // Draw anticipated trajectory line based on angle slider
            if (!simState.active) {
                const angleVal = parseInt(inputAngle.value);
                const rad = (angleVal - 90) * (Math.PI / 180);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(sp.x, sp.y);
                ctx.lineTo(sp.x + Math.cos(rad) * 350, sp.y + Math.sin(rad) * 350);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Cities
            cities.forEach(c => {
                const p = project(c.lat, c.lon);
                ctx.fillStyle = c.hit ? '#ef4444' : '#94a3b8';
                ctx.beginPath();
                ctx.arc(p.x, p.y, c.hit ? 6 : 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = c.hit ? '#fca5a5' : '#cbd5e1';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(c.name, p.x + 8, p.y + 3);
            });

            // Draw Typhoon path history
            if (simState.pathHistory.length > 1) {
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                simState.pathHistory.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Typhoon active state
            if (simState.active || simState.elapsedFrames > 0) {
                const rx = simState.active ? simState.x : sp.x;
                const ry = simState.active ? simState.y : sp.y;
                const typhoonRadius = Math.max(25, (1010 - simState.pressure) * 0.5);

                const grad = ctx.createRadialGradient(rx, ry, 3, rx, ry, typhoonRadius);
                grad.addColorStop(0, 'rgba(239, 68, 68, 0.45)');
                grad.addColorStop(0.6, 'rgba(59, 130, 246, 0.25)');
                grad.addColorStop(1, 'rgba(59, 130, 246, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(rx, ry, typhoonRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1;
                simState.particles.forEach(pt => {
                    if (simState.active) pt.angle += pt.speed * simState.rotation;
                    const px = rx + Math.cos(pt.angle) * pt.dist;
                    const py = ry + Math.sin(pt.angle) * pt.dist;
                    ctx.beginPath();
                    ctx.moveTo(rx, ry);
                    ctx.lineTo(px, py);
                    ctx.stroke();
                });

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(rx, ry, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        draw();
        loop();
    </script>
</body>
</html>
