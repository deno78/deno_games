<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハシビロコウを撮れ！ (Shoebill Photo Challenge)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 2px 2px #0f3460;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #4e8d7c;
            border: 8px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .ui-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px #c22942;
            transition: all 0.1s ease;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #c22942;
        }
        button:disabled {
            background-color: #555;
            box-shadow: 0 4px #333;
            cursor: not-allowed;
        }
        #shutter-btn {
            background-color: #f39c12;
            box-shadow: 0 4px #d68910;
            font-size: 1.5rem;
            padding: 15px 50px;
            border-radius: 40px;
        }
        #shutter-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #d68910;
        }
        #instructions {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #a0a0a0;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
        /* Flash effect */
        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.05s ease-out;
        }
        /* Modal Overlay */
        #modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }
        #modal h2 {
            font-size: 2.5rem;
            color: #f39c12;
            margin-bottom: 10px;
        }
        #modal p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>🦅 ハシビロコウを撮れ！ 📸</h1>
    
    <div id="game-container">
        <div id="flash"></div>
        
        <div class="ui-panel">
            <div class="ui-item">残り時間: <span id="time-display">30</span>秒</div>
            <div class="ui-item">スコア: <span id="score-display">0</span> pts</div>
            <div class="ui-item">撮影残数: <span id="ammo-display">1</span>回</div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="modal">
            <h2 id="modal-title">ハシビロコウを撮れ！</h2>
            <p id="modal-desc">
                ハシビロコウはめったに動きません。<br>
                30秒間の制限時間のうち、<strong>たった1回だけ</strong>動く瞬間があります。<br>
                その決定的瞬間を狙ってシャッターを押してください！<br><br>
                ⚠️ 妨害（虫、魚の飛び跳ね、雨）に注意！シャッターは1回キリ！
            </p>
            <button id="start-btn">ゲームスタート</button>
        </div>
    </div>

    <div id="controls">
        <button id="shutter-btn" disabled>📷 シャッター (SPACE)</button>
    </div>

    <div id="instructions">
        操作方法: 【シャッターボタン】または【スペースキー】で撮影。<br>
        動いた瞬間をバッチリ捉えて高得点（1000点満点）を目指せ！
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('time-display');
const scoreDisplay = document.getElementById('score-display');
const ammoDisplay = document.getElementById('ammo-display');
const startBtn = document.getElementById('start-btn');
const shutterBtn = document.getElementById('shutter-btn');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalDesc = document.getElementById('modal-desc');
const flashDiv = document.getElementById('flash');

// Game State
let gameState = 'IDLE'; // IDLE, PLAYING, GAMEOVER
let timeLeft = 30.0;
let score = 0;
let hasShot = false;
let gameTimer = null;
let lastTime = 0;

// Shoebill State
// 0: Standing completely still (じっとする)
// 1: Moving/Blinking/Wings spread (動いている瞬間)
let shoebillState = 0; 
let actionTimer = 0;
let nextActionTime = 0; // When it will move
let actionDuration = 1.2; // How long it moves (seconds)
let actionStartTime = 0;

// Obstacles & Background Elements
let bugs = [];
let fishes = [];
let raindrops = [];
let weatherTimer = 0;
let isRaining = false;

// Initialize Audio Context (optional simple beep)
function playSound(type) {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'shutter') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    } catch(e) {}
}

function startGame() {
    modal.classList.add('hidden');
    gameState = 'PLAYING';
    timeLeft = 30.0;
    score = 0;
    hasShot = false;
    shoebillState = 0;
    actionTimer = 0;
    
    // Choose a random moment for the shoebill to move (between 5s and 25s remaining, meaning 5s to 25s elapsed)
    // Let's set nextActionTime as elapsed seconds from start (0 to 30)
    // Shoebill moves once for 1.5 seconds.
    nextActionTime = 5 + Math.random() * 20; 
    actionDuration = 1.2 + Math.random() * 0.5;

    bugs = [];
    fishes = [];
    raindrops = [];
    isRaining = false;
    weatherTimer = 0;

    // Spawn some initial bugs and fish
    for(let i=0; i<3; i++) {
        bugs.push({
            x: Math.random() * canvas.width,
            y: Math.random() * 200 + 50,
            vx: (Math.random() - 0.5) * 60,
            vy: (Math.random() - 0.5) * 40,
            size: Math.random() * 6 + 4
        });
    }

    shutterBtn.disabled = false;
    ammoDisplay.textContent = '1';
    scoreDisplay.textContent = '0';
    
    lastTime = performance.now();
    requestAnimationFrame(updateGame);
}

function updateGame(currentTime) {
    if (gameState !== 'PLAYING') return;

    let dt = (currentTime - lastTime) / 1000;
    lastTime = currentTime;
    if (dt > 0.1) dt = 0.1; // Cap delta time

    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        if (!hasShot) {
            // Time's up without shooting
            finishGame(0, "タイムアップ！シャッターを切れずに終わってしまいました…");
        }
        return;
    }

    timeDisplay.textContent = timeLeft.toFixed(1);

    // Elapsed time from start
    let elapsedTime = 30.0 - timeLeft;

    // Check shoebill movement
    if (elapsedTime >= nextActionTime && elapsedTime <= nextActionTime + actionDuration) {
        shoebillState = 1; // Moving!
    } else {
        shoebillState = 0; // Still
    }

    // Weather & obstacles logic
    weatherTimer += dt;
    if (weatherTimer > 10 && weatherTimer < 20) {
        isRaining = true;
    } else {
        isRaining = false;
    }

    if (isRaining) {
        if (Math.random() < 0.6) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: -10,
                vy: Math.random() * 300 + 400,
                length: Math.random() * 15 + 10
            });
        }
    }

    // Update raindrops
    for (let i = raindrops.length - 1; i >= 0; i--) {
        let r = raindrops[i];
        r.y += r.vy * dt;
        r.x -= 50 * dt; // slight wind
        if (r.y > canvas.height) {
            raindrops.splice(i, 1);
        }
    }

    // Update bugs
    for (let b of bugs) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.x < 0 || b.x > canvas.width) b.vx *= -1;
        if (b.y < 30 || b.y > 300) b.vy *= -1;
    }

    // Occasional fish jump in swamp
    if (Math.random() < 0.02 && fishes.length < 2) {
        fishes.push({
            x: Math.random() * 400 + 200,
            y: 420,
            vx: (Math.random() - 0.5) * 40,
            vy: -Math.random() * 250 - 150,
            gravity: 600,
            rotation: 0
        });
    }

    for (let i = fishes.length - 1; i >= 0; i--) {
        let f = fishes[i];
        f.vy += f.gravity * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.rotation += dt * 5;
        if (f.y > 450) {
            fishes.splice(i, 1);
        }
    }

    // Draw everything
    drawScene();

    requestAnimationFrame(updateGame);
}

function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- Background (Marsh / Reed field) ---
    // Sky
    let gradSky = ctx.createLinearGradient(0, 0, 0, 300);
    gradSky.addColorStop(0, isRaining ? '#57606f' : '#70a1ff');
    gradSky.addColorStop(1, isRaining ? '#2f3542' : '#7bed9f');
    ctx.fillStyle = gradSky;
    ctx.fillRect(0, 0, canvas.width, 300);

    // Distant reeds / mountains
    ctx.fillStyle = isRaining ? '#3d4551' : '#2ed573';
    ctx.beginPath();
    ctx.moveTo(0, 250);
    for(let i=0; i<=canvas.width; i+=40) {
        ctx.lineTo(i, 230 + Math.sin(i)*20);
    }
    ctx.lineTo(canvas.width, 300);
    ctx.lineTo(0, 300);
    ctx.fill();

    // Swamp Water
    let gradWater = ctx.createLinearGradient(0, 300, 0, 500);
    gradWater.addColorStop(0, isRaining ? '#1e272e' : '#10ac84');
    gradWater.addColorStop(1, isRaining ? '#0f171e' : '#019267');
    ctx.fillStyle = gradWater;
    ctx.fillRect(0, 300, canvas.width, 200);

    // Reeds in foreground
    ctx.fillStyle = '#1e3d2f';
    for(let x = 20; x < canvas.width; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 350);
        ctx.quadraticCurveTo(x - 10, 250, x - 20, 200);
        ctx.quadraticCurveTo(x + 5, 250, x + 15, 350);
        ctx.fill();
        // Reed head
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(x - 22, 195, 6, 25);
        ctx.fillStyle = '#1e3d2f';
    }

    // --- Draw Shoebill (ハシビロコウ) ---
    ctx.save();
    let bx = 400;
    let by = 280;

    // Body
    ctx.fillStyle = '#718093';
    // If moving, slight tilt or wing spread
    if (shoebillState === 1) {
        // Wings spread / head tilt
        ctx.save();
        ctx.translate(bx, by);
        // Head turning or wings flapping
        let wingOffset = Math.sin(performance.now() * 0.02) * 15;

        // Left Wing spread
        ctx.beginPath();
        ctx.ellipse(-30, 20, 25, 45, Math.PI / 4 + wingOffset * 0.02, 0, Math.PI * 2);
        ctx.fill();

        // Right Wing spread
        ctx.beginPath();
        ctx.ellipse(30, 20, 25, 45, -Math.PI / 4 - wingOffset * 0.02, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Legs
    ctx.strokeStyle = '#576574';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(bx - 15, by + 60);
    ctx.lineTo(bx - 20, 420);
    ctx.lineTo(bx - 35, 420); // foot
    ctx.moveTo(bx + 15, by + 60);
    ctx.lineTo(bx + 15, 420);
    ctx.lineTo(bx + 25, 420); // foot
    ctx.stroke();

    // Torso
    ctx.beginPath();
    ctx.ellipse(bx, by + 50, 45, 60, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#a4b0be';
    ctx.fill();
    ctx.strokeStyle = '#2f3542';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Neck
    ctx.beginPath();
    let neckCurve = shoebillState === 1 ? -10 : 0;
    ctx.moveTo(bx - 15, by + 20);
    ctx.quadraticCurveTo(bx - 25 + neckCurve, by - 30, bx - 10, by - 70);
    ctx.lineTo(bx + 15, by - 70);
    ctx.quadraticCurveTo(bx + 15 + neckCurve, by - 30, bx + 20, by + 20);
    ctx.fillStyle = '#a4b0be';
    ctx.fill();
    ctx.stroke();

    // Head
    let headX = bx;
    let headY = by - 85;
    ctx.beginPath();
    ctx.arc(headX, headY, 30, 0, Math.PI * 2);
    ctx.fillStyle = '#a4b0be';
    ctx.fill();
    ctx.stroke();

    // Eyes (menacing, sharp yellow eyes with dark pupil)
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(headX - 10, headY - 5, 6, 0, Math.PI * 2);
    ctx.arc(headX + 10, headY - 5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2f3542';
    ctx.beginPath();
    ctx.arc(headX - 10, headY - 5, 2, 0, Math.PI * 2);
    ctx.arc(headX + 10, headY - 5, 2, 0, Math.PI * 2);
    ctx.fill();

    // Huge Bill (ハシビロコウの大きなクチバシ)
    ctx.save();
    ctx.translate(headX, headY + 5);
    if (shoebillState === 1) {
        // Opening bill slightly or nodding
        ctx.rotate(Math.sin(performance.now() * 0.03) * 0.15);
    }
    ctx.fillStyle = '#dcdde1';
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    ctx.lineTo(18, 0);
    ctx.lineTo(12, 50);
    ctx.lineTo(-12, 50);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Bill pattern (spots)
    ctx.fillStyle = '#718093';
    ctx.beginPath();
    ctx.arc(-5, 15, 3, 0, Math.PI * 2);
    ctx.arc(6, 25, 4, 0, Math.PI * 2);
    ctx.arc(-3, 35, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Hooked tip of bill
    ctx.fillStyle = '#2f3542';
    ctx.beginPath();
    ctx.moveTo(-12, 50);
    ctx.lineTo(12, 50);
    ctx.lineTo(0, 60);
    ctx.closePath();
    ctx.fill();

    ctx.restore(); // restore head/bill

    // Head crest (後頭部の羽)
    ctx.strokeStyle = '#718093';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(headX - 25, headY - 15);
    ctx.lineTo(headX - 40, headY - 25);
    ctx.moveTo(headX - 23, headY - 8);
    ctx.lineTo(headX - 38, headY - 15);
    ctx.stroke();

    ctx.restore();

    // --- Draw Bugs (妨害: 虫) ---
    for (let b of bugs) {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
        // Wings
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(b.x - 4, b.y - 4, 6, 3, Math.PI / 4, 0, Math.PI * 2);
        ctx.ellipse(b.x + 4, b.y - 4, 6, 3, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // --- Draw Fishes (妨害: 飛び跳ねる魚) ---
    for (let f of fishes) {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rotation);
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // Tail
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(20, -6);
        ctx.lineTo(20, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // --- Draw Rain (妨害: 雨) ---
    if (isRaining) {
        ctx.strokeStyle = 'rgba(200, 220, 255, 0.6)';
        ctx.lineWidth = 2;
        for (let r of raindrops) {
            ctx.beginPath();
            ctx.moveTo(r.x, r.y);
            ctx.lineTo(r.x - 3, r.y + r.length);
            ctx.stroke();
        }
        
        // Rain overlay text/effect
        ctx.fillStyle = 'rgba(0, 0, 50, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Camera view frame decoration
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    // Crosshair in center
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2 - 15, canvas.height / 2);
    ctx.lineTo(canvas.width / 2 + 15, canvas.height / 2);
    ctx.moveTo(canvas.width / 2, canvas.height / 2 - 15);
    ctx.lineTo(canvas.width / 2, canvas.height / 2 + 15);
    ctx.stroke();
}

function takePhoto() {
    if (gameState !== 'PLAYING' || hasShot) return;
    hasShot = true;
    shutterBtn.disabled = true;
    ammoDisplay.textContent = '0';

    playSound('shutter');

    // Flash effect
    flashDiv.style.opacity = '1';
    setTimeout(() => {
        flashDiv.style.opacity = '0';
    }, 80);

    // Calculate score based on shoebill state and distractions
    let finalScore = 0;
    let message = "";

    // Check if bugs/fishes/rain obstruct the view near center (bx=400, by=200)
    let obstructionCount = 0;
    for (let b of bugs) {
        let dist = Math.hypot(b.x - 400, b.y - 230);
        if (dist < 100) obstructionCount++;
    }
    for (let f of fishes) {
        let dist = Math.hypot(f.x - 400, f.y - 230);
        if (dist < 120) obstructionCount++;
    }
    if (isRaining) obstructionCount += 2;

    if (shoebillState === 1) {
        // Perfect! Shoebill was moving!
        finalScore = 1000 - (obstructionCount * 150);
        if (finalScore < 300) finalScore = 300;
        playSound('success');
        message = `🎉 素晴らしい！ハシビロコウが動き出した瞬間をバッチリ撮影しました！<br>妨害ペナルティ: ${obstructionCount}個<br>スコア: <strong>${finalScore} 点</strong>`;
    } else {
        // Shoebill was still standing like a statue
        finalScore = 100 - (obstructionCount * 30);
        if (finalScore < 10) finalScore = 10;
        playSound('fail');
        message = `📸 パシャッ！…しかし、ハシビロコウはまったく動きませんでした（ただの置物写真…）。<br>スコア: <strong>${finalScore} 点</strong>`;
    }

    score = finalScore;
    scoreDisplay.textContent = score;

    setTimeout(() => {
        finishGame(score, message);
    }, 600);
}

function finishGame(finalScore, msg) {
    gameState = 'GAMEOVER';
    modalTitle.textContent = finalScore >= 800 ? "🏆 伝説のカメラマン！" : (finalScore >= 400 ? "📷 ナイスショット！" : "🦆 ただの鳥の写真…");
    modalDesc.innerHTML = msg + `<br><br>最終スコア: ${finalScore} pts`;
    startBtn.textContent = "もう一度プレイする";
    modal.classList.remove('hidden');
    shutterBtn.disabled = true;
}

// Event Listeners
startBtn.addEventListener('click', startGame);
shutterBtn.addEventListener('click', takePhoto);

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'PLAYING' && !hasShot) {
            takePhoto();
        } else if (gameState === 'IDLE' || gameState === 'GAMEOVER') {
            startGame();
        }
    }
});
</script>

</body>
</html>
