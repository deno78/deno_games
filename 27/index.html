<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16bit ドット絵 弦楽器クイズ</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #12121c;
            color: #f0f0f5;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e1e2f;
            border: 4px solid #4a4a75;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            color: #ffd700;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 2px 2px #552200;
        }
        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
        /* ステータスバー */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 15px;
            background: #2a2a40;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #5a5a85;
        }
        /* キャンバス（ドット絵表示） */
        .canvas-container {
            position: relative;
            background: #0d0d15;
            border: 4px solid #6c6c9e;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 220px;
            height: 220px;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 192px;
            height: 192px;
        }
        /* ヒント・フレーバーテキスト */
        .flavor-box {
            font-size: 0.85rem;
            color: #a0a0c0;
            text-align: center;
            min-height: 40px;
            margin-bottom: 15px;
            padding: 0 10px;
            line-height: 1.4;
        }
        /* 4択ボタン */
        .choices-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .choice-btn {
            background: #2c2c4a;
            color: #fff;
            border: 3px solid #6b6bb8;
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            box-shadow: 0 4px #18182b;
        }
        .choice-btn:hover {
            background: #3c3c6a;
            border-color: #8b8be8;
        }
        .choice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #18182b;
        }
        .choice-btn.correct {
            background: #2e7d32 !important;
            border-color: #66bb6a !important;
        }
        .choice-btn.incorrect {
            background: #c62828 !important;
            border-color: #ef5350 !important;
        }
        /* コントロールボタン */
        .action-btn {
            background: #d4af37;
            color: #12121c;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px #7a6012;
            transition: all 0.1s ease;
            margin-top: 10px;
        }
        .action-btn:hover {
            background: #f7d248;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #7a6012;
        }
        /* 結果画面 */
        .result-card {
            background: #252538;
            border: 3px dashed #7a7ab5;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        .result-score {
            font-size: 2rem;
            color: #ffd700;
            margin: 10px 0;
            text-shadow: 2px 2px #440000;
        }
        .result-comment {
            font-size: 0.95rem;
            color: #d0d0f0;
            line-height: 1.5;
        }
        /* 音声再生エフェクトなどの演出 */
        .sound-fx-badge {
            font-size: 0.75rem;
            background: #442255;
            color: #ddaaff;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #8844aa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎸 16bit 弦楽器クイズ 🎻</h1>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <div style="font-size: 3rem; margin: 20px 0;">🎸🎻🪕</div>
        <p style="text-align: center; font-size: 0.9rem; line-height: 1.6; margin-bottom: 25px; color: #d0d0e0;">
            16ビット風ドット絵で描かれた<br>ネック付き弦楽器の名前を当てよう！<br>
            全5問の正答率を競うのだ！
        </p>
        <button class="action-btn" onclick="startGame()">ゲームスタート</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen hidden">
        <div class="status-bar">
            <span id="question-count">もんだい: 1 / 5</span>
            <span id="score-count">スコア: 0pt</span>
        </div>

        <div class="sound-fx-badge" id="instrument-hint">ドット絵弦楽器</div>

        <div class="canvas-container">
            <canvas id="pixel-canvas" width="24" height="24"></canvas>
        </div>

        <div class="flavor-box" id="flavor-text">
            この楽器の特徴やいかに…？
        </div>

        <div class="choices-grid" id="choices-grid">
            <!-- 4択ボタンがここに動的生成されます -->
        </div>

        <button class="action-btn hidden" id="next-btn" onclick="nextQuestion()">つぎの問題へ</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="result-card">
            <h2>結果発表</h2>
            <div class="result-score" id="final-score">5 / 5 問正解</div>
            <div class="result-comment" id="final-comment">
                すばらしい！あなたは弦楽器マスターです！
            </div>
        </div>
        <button class="action-btn" onclick="restartGame()">もう一度チャレンジ</button>
    </div>
</div>

<script>
    // 楽器データ定義 (全6種類以上を用意してランダムに出題)
    const instruments = [
        {
            name: "ギター",
            flavor: "ポピュラーな6弦の弦楽器。ロックからクラシックまで幅広い！",
            // 24x24 ドット絵グリッドデータ (簡易描画用)
            draw: function(ctx) {
                // 背景クリア
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // ネック (上向き斜めまたは縦長)
                // 縦長ギターとして中央に描画
                // ボディ: 楕円形 (下部)
                // ヘッド: 上部
                
                // ネック
                ctx.fillStyle = '#b5651d';
                ctx.fillRect(11, 2, 2, 12);
                // ヘッド
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(10, 1, 4, 3);
                // フレット
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(11, 4, 2, 1);
                ctx.fillRect(11, 7, 2, 1);
                ctx.fillRect(11, 10, 2, 1);

                // ボディ (丸みを帯びた形状)
                ctx.fillStyle = '#d2691e';
                // ピックガードや中心
                for (let y = 13; y <= 21; y++) {
                    let w = 0;
                    if (y === 13 || y === 21) w = 3;
                    else if (y === 14 || y === 20) w = 5;
                    else w = 7;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // ボディ内部の木目/影
                ctx.fillStyle = '#a0522d';
                for (let y = 15; y <= 19; y++) {
                    let w = 0;
                    if (y === 15 || y === 19) w = 3;
                    else w = 5;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // サウンドホール
                ctx.fillStyle = '#111';
                ctx.fillRect(11, 17, 2, 2);

                // 弦
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 2, 1, 20);
                ctx.fillRect(12, 2, 1, 20);
            }
        },
        {
            name: "コントラバス",
            flavor: "オーケストラで最も低音を奏でる大型の弦楽器。立って演奏するよ！",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // ネック
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(11, 1, 2, 8);
                // ヘッド (渦巻き風)
                ctx.fillStyle = '#3d2817';
                ctx.fillRect(10, 0, 4, 2);

                // 大型ボディ (洋ナシ型)
                ctx.fillStyle = '#8b5a2b';
                for (let y = 9; y <= 22; y++) {
                    let w = 0;
                    if (y === 9) w = 2;
                    else if (y === 10) w = 4;
                    else if (y >= 11 && y <= 13) w = 6; // くびれ
                    else if (y >= 14 && y <= 16) w = 5;
                    else if (y >= 17 && y <= 21) w = 8; // 下部ふくらみ
                    else w = 6;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // f字孔っぽく
                ctx.fillStyle = '#222';
                ctx.fillRect(9, 17, 1, 3);
                ctx.fillRect(14, 17, 1, 3);

                // 弦
                ctx.fillStyle = '#ccc';
                ctx.fillRect(11, 1, 1, 21);
                ctx.fillRect(12, 1, 1, 21);
            }
        },
        {
            name: "ビエラ",
            flavor: "中世・ルネサンス期に愛された、ギターやリュートの先祖にあたる弦楽器。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // ネック
                ctx.fillStyle = '#deb887';
                ctx.fillRect(11, 3, 2, 8);
                // ペグボックス
                ctx.fillStyle = '#cd853f';
                ctx.fillRect(10, 1, 4, 3);

                // 特徴的なボディ (8の字に近い形状、あるいはくびれが深い)
                ctx.fillStyle = '#d2b48c';
                for (let y = 11; y <= 22; y++) {
                    let w = 0;
                    if (y === 11 || y === 22) w = 3;
                    else if (y >= 12 && y <= 14) w = 6; // 上のふくらみ
                    else if (y === 15 || y === 16) w = 4; // くびれ
                    else if (y >= 17 && y <= 21) w = 7; // 下のふくらみ
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // 綺麗な装飾ホール
                ctx.fillStyle = '#331a00';
                ctx.fillRect(11, 18, 2, 2);

                // 弦
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 1, 1, 21);
                ctx.fillRect(12, 1, 1, 21);
            }
        },
        {
            name: "バイオリン",
            flavor: "高音域で美しい旋律を奏でる、クラシックの女王と呼ばれる小型の弦楽器。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // ぺグボックス & スクロール
                ctx.fillStyle = '#654321';
                ctx.fillRect(11, 1, 2, 4);
                // ネック
                ctx.fillStyle = '#d2b48c';
                ctx.fillRect(11, 5, 2, 4);

                // ボディ (美しいくびれ)
                ctx.fillStyle = '#a0522d';
                for (let y = 9; y <= 21; y++) {
                    let w = 0;
                    if (y === 9 || y === 21) w = 3;
                    else if (y >= 10 && y <= 12) w = 5; // 上部
                    else if (y >= 13 && y <= 14) w = 3; // くびれ
                    else if (y >= 15 && y <= 19) w = 6; // 下部
                    else w = 4;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // f字孔
                ctx.fillStyle = '#111';
                ctx.fillRect(10, 16, 1, 3);
                ctx.fillRect(13, 16, 1, 3);

                // 弦とテールピース
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 1, 1, 18);
                ctx.fillStyle = '#000';
                ctx.fillRect(10, 19, 4, 2);
            }
        },
        {
            name: "マンドリン",
            flavor: "洋ナシを半分に割ったような丸い裏板が特徴。トレモロ奏法が有名！",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // 長いネック
                ctx.fillStyle = '#deb887';
                ctx.fillRect(11, 2, 2, 10);
                // ヘッド (少し傾斜)
                ctx.fillStyle = '#cd853f';
                ctx.fillRect(9, 0, 4, 3);

                // 丸いボディ (ボウルバック)
                ctx.fillStyle = '#cd661d';
                for (let y = 12; y <= 22; y++) {
                    let w = 0;
                    if (y === 12 || y === 22) w = 2;
                    else if (y === 13 || y === 21) w = 5;
                    else if (y >= 14 && y <= 19) w = 7; // 丸い膨らみ
                    else w = 6;
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // サウンドホール
                ctx.fillStyle = '#111';
                ctx.fillRect(11, 16, 2, 2);

                // 弦
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 0, 1, 21);
                ctx.fillRect(12, 0, 1, 21);
            }
        },
        {
            name: "三味線",
            flavor: "和の響きを伝える3本の弦の楽器。太棹・中棹・細棹などがあるよ！",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // 極めて長い棹（ネック）
                ctx.fillStyle = '#8b5a2b';
                ctx.fillRect(11, 0, 2, 13);
                // 天神（糸巻き部分）
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(9, 0, 6, 2);
                // 糸巻き（左右につき出す）
                ctx.fillRect(8, 3, 8, 1);

                // 胴（四角形・皮が張られている）
                ctx.fillStyle = '#f5deb3';
                ctx.fillRect(7, 14, 10, 8);
                // 胴の枠（木枠）
                ctx.fillStyle = '#8b4513';
                ctx.strokeRect = true;
                ctx.fillRect(7, 13, 10, 1);
                ctx.fillRect(7, 22, 10, 1);
                ctx.fillRect(6, 14, 1, 8);
                ctx.fillRect(17, 14, 1, 8);

                // 猫皮の模様風あるいは駒
                ctx.fillStyle = '#442211';
                ctx.fillRect(11, 17, 2, 2);

                // 3本の弦
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 2, 1, 20);
                ctx.fillRect(12, 2, 1, 20);
                // 3本目の弦位置調整
                ctx.fillStyle = '#ccc';
                ctx.fillRect(10, 2, 1, 20);
            }
        },
        {
            name: "ウクレレ",
            flavor: "ハワイを代表する小型の4弦楽器。コロコロと明るい音色が特徴！",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // 短いネック
                ctx.fillStyle = '#d2b48c';
                ctx.fillRect(11, 4, 2, 7);
                // ヘッド
                ctx.fillStyle = '#a0522d';
                ctx.fillRect(10, 2, 4, 3);

                // 小さな丸みのあるボディ
                ctx.fillStyle = '#ff8c00';
                for (let y = 11; y <= 21; y++) {
                    let w = 0;
                    if (y === 11 || y === 21) w = 3;
                    else if (y === 12 || y === 20) w = 5;
                    else w = 6; // ぽっちゃりボディ
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // サウンドホール
                ctx.fillStyle = '#111';
                ctx.fillRect(11, 15, 2, 2);

                // 弦
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 2, 1, 18);
                ctx.fillRect(12, 2, 1, 18);
            }
        },
        {
            name: "チェロ",
            flavor: "座って演奏する中型の低音弦楽器。人の声に近い豊かな響きを持つ。",
            draw: function(ctx) {
                ctx.fillStyle = '#0d0d15';
                ctx.fillRect(0, 0, 24, 24);

                // ネック
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(11, 2, 2, 7);
                // スクロール
                ctx.fillStyle = '#3d2817';
                ctx.fillRect(10, 1, 4, 2);

                // ボディ (バイオリンより丸く厚みがある形状)
                ctx.fillStyle = '#8b4513';
                for (let y = 9; y <= 21; y++) {
                    let w = 0;
                    if (y === 9 || y === 21) w = 3;
                    else if (y >= 10 && y <= 12) w = 5;
                    else if (y === 13 || y === 14) w = 3; // くびれ
                    else if (y >= 15 && y <= 20) w = 7; // 下部ふくらみ
                    ctx.fillRect(12 - w, y, w * 2 + 1, 1);
                }
                // エンドピン
                ctx.fillStyle = '#fff';
                ctx.fillRect(11, 22, 1, 2);

                // 弦
                ctx.fillStyle = '#ccc';
                ctx.fillRect(11, 1, 1, 21);
                ctx.fillRect(12, 1, 1, 21);
            }
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const canvas = document.getElementById('pixel-canvas');
    const ctx = canvas.getContext('2d');
    // ピーキーなドット感を保つためアンチエイリアスを無効化
    ctx.imageSmoothingEnabled = false;

    function startGame() {
        // 5問をランダムに選出
        let shuffled = [...instruments].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 5);
        currentIndex = 0;
        score = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        document.getElementById('next-btn').classList.add('hidden');
        
        const q = currentQuestions[currentIndex];
        document.getElementById('question-count').innerText = `もんだい: ${currentIndex + 1} / 5`;
        document.getElementById('score-count').innerText = `スコア: ${score}pt`;
        document.getElementById('instrument-hint').innerText = "16bit ドット絵 弦楽器";
        document.getElementById('flavor-text').innerText = "この楽器の名前はな～んだ？（4択から選んでね）";

        // ドット絵を描画
        q.draw(ctx);

        // 4択の選択肢を作成（正解1つ + 不正解3つ）
        let choices = [q.name];
        while (choices.length < 4) {
            let randomInst = instruments[Math.floor(Math.random() * instruments.length)].name;
            if (!choices.includes(randomInst)) {
                choices.push(randomInst);
            }
        }
        // シャッフル
        choices.sort(() => 0.5 - Math.random());

        // ボタン生成
        const grid = document.getElementById('choices-grid');
        grid.innerHTML = '';
        choices.forEach(choiceName => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choiceName;
            btn.onclick = () => selectAnswer(choiceName, q.name, btn);
            grid.appendChild(btn);
        });
    }

    function selectAnswer(selected, correct, btnElement) {
        if (answered) return;
        answered = true;

        const buttons = document.querySelectorAll('.choice-btn');
        buttons.forEach(btn => {
            if (btn.innerText === correct) {
                btn.classList.add('correct');
            } else if (btn === btnElement && selected !== correct) {
                btn.classList.add('incorrect');
            }
            btn.disabled = true;
        });

        const flavorBox = document.getElementById('flavor-text');
        const q = currentQuestions[currentIndex];

        if (selected === correct) {
            score += 20;
            document.getElementById('score-count').innerText = `スコア: ${score}pt`;
            flavorBox.innerHTML = `<span style="color: #66bb6a; font-weight: bold;">【正解！】</span><br>${q.flavor}`;
        } else {
            flavorBox.innerHTML = `<span style="color: #ef5350; font-weight: bold;">【不正解…】正解は「${correct}」だよ！</span><br>${q.flavor}`;
        }

        // 次へボタン表示、最終問題なら「結果を見る」に
        const nextBtn = document.getElementById('next-btn');
        if (currentIndex < 4) {
            nextBtn.innerText = "つぎの問題へ";
        } else {
            nextBtn.innerText = "結果を見る";
        }
        nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < 5) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = `${score} / 100 pt (${score / 20}問正解)`;

        let comment = "";
        if (score === 100) {
            comment = "パーフェクト！あなたは完全無欠の弦楽器ソムリエです！！すばらしい！";
        } else if (score >= 80) {
            comment = "お見事！かなりの弦楽器通ですね！ドット絵を見分ける目が鋭い！";
        } else if (score >= 40) {
            comment = "なかなかやりますね！色々な弦楽器の形を覚えてもっとマスターしよう！";
        } else {
            comment = "ドンマイ！ネック付き弦楽器は奥が深い…。もう一度挑戦して全問正解を目指そう！";
        }
        document.getElementById('final-comment').innerText = comment;
    }

    function restartGame() {
        startGame();
    }
</script>

</body>
</html>
