<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マッハピンボール！音速を越えろ！</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle, #1a2e1a 0%, #0a120a 100%);
            color: #ffd700;
            font-family: 'Cinzel', 'Times New Roman', serif, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            text-shadow: 0 0 10px #ff4500, 0 0 20px #ffd700;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
        }
        #game-container {
            position: relative;
            border: 6px ridge #ffd700;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0,0,0,0.8);
            background: #0f2212;
            border-radius: 6px;
            width: 100%;
            max-width: 440px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: radial-gradient(circle at center, #1b4d2b 0%, #0c2614 100%);
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 440px;
            margin-top: 8px;
            font-size: 13px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border: 2px solid #ffd700;
            border-radius: 4px;
        }
        .controls-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #b0c4de;
            text-align: center;
            max-width: 440px;
        }
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 440px;
            margin-top: 10px;
            gap: 8px;
        }
        .m-btn {
            flex: 1;
            background: linear-gradient(to bottom, #d4af37, #8b6508);
            border: 2px solid #fff;
            color: #000;
            font-weight: bold;
            padding: 14px 0;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #4a3304;
            text-align: center;
        }
        .m-btn:active, .m-btn.active {
            transform: translateY(4px);
            box-shadow: 0 0 #4a3304;
            background: linear-gradient(to bottom, #ffd700, #b8860b);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎰 マッハピンボール！ 🎰</h1>
        <div class="subtitle">～音速を越えろ！低摩擦超加速ピンボール～</div>
    </header>

    <div id="game-container">
        <canvas id="pinballCanvas" width="440" height="680"></canvas>
    </div>

    <div class="ui-panel">
        <div>SCORE: <span id="scoreVal">0</span></div>
        <div>MACH: <span id="machVal" style="color: #00ffcc;">MACH 0.0</span></div>
        <div>BALL: <span id="ballVal">3</span></div>
    </div>

    <div class="controls-hint">
        [←/Z] 左フリッパー | [→/M] 右フリッパー | [SPACE] 発射<br>
        ※スマホでは下のボタン、または画面左右タップでも操作可能！
    </div>

    <div class="mobile-controls">
        <button class="m-btn" id="leftBtn">◀ LEFT</button>
        <button class="m-btn" id="launchBtn">🚀 LAUNCH</button>
        <button class="m-btn" id="rightBtn">RIGHT ▶</button>
    </div>

<script>
const canvas = document.getElementById('pinballCanvas');
const ctx = canvas.getContext('2d');

const scoreValElem = document.getElementById('scoreVal');
const machValElem = document.getElementById('machVal');
const ballValElem = document.getElementById('ballVal');

// ゲーム状態
let score = 0;
let ballsLeft = 3;
let gameState = 'READY'; // READY, PLAYING, GAMEOVER
let plungerPower = 0;
let plungerCharging = false;

// 画面シェイク用
let shakeTimer = 0;
let shakeIntensity = 0;

// ボールオブジェクト (超低摩擦設定)
const ball = {
    x: 412,
    y: 570,
    vx: 0,
    vy: 0,
    radius: 9,
    gravity: 0.18,
    friction: 0.9992,
    restitution: 0.96,
    maxSpeed: 48
};

// フリッパー
const leftFlipper = {
    x: 130,
    y: 600,
    length: 75,
    angle: 0.35,
    baseAngle: 0.35,
    maxAngle: -0.45,
    pressed: false
};

const rightFlipper = {
    x: 270,
    y: 600,
    length: 75,
    angle: Math.PI - 0.35,
    baseAngle: Math.PI - 0.35,
    maxAngle: Math.PI + 0.45,
    pressed: false
};

// バンパー
const bumpers = [
    { x: 160, y: 180, radius: 24, color: '#ff2222', type: 'roulette', score: 1000, pulse: 0 },
    { x: 280, y: 180, radius: 24, color: '#ffd700', type: 'chip', score: 1500, pulse: 0 },
    { x: 220, y: 280, radius: 28, color: '#ffffff', type: 'jackpot', score: 3000, pulse: 0 },
    { x: 120, y: 380, radius: 20, color: '#ff8800', type: 'card', score: 800, pulse: 0 },
    { x: 320, y: 380, radius: 20, color: '#ff8800', type: 'card', score: 800, pulse: 0 }
];

// スリングショット
const slingshots = [
    { x1: 90, y1: 450, x2: 130, y2: 520, normal: {x: 0.8, y: -0.6} },
    { x1: 350, y1: 450, x2: 310, y2: 520, normal: {x: -0.8, y: -0.6} }
];

// ガイド壁
const walls = [
    { x1: 40, y1: 80, x2: 40, y2: 580 },
    { x1: 40, y1: 80, x2: 220, y2: 30 },
    { x1: 220, y1: 30, x2: 400, y2: 80 },
    { x1: 400, y1: 80, x2: 400, y2: 580 },
    { x1: 390, y1: 120, x2: 390, y2: 600 },
    { x1: 40, y1: 580, x2: 110, y2: 640 },
    { x1: 400, y1: 580, x2: 330, y2: 640 }
];

// キー入力
window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyZ') leftFlipper.pressed = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyM' || e.code === 'KeyX') rightFlipper.pressed = true;
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'READY' && ball.x > 380) {
            plungerCharging = true;
        } else if (gameState === 'GAMEOVER') {
            restartGame();
        }
    }
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyZ') leftFlipper.pressed = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyM' || e.code === 'KeyX') rightFlipper.pressed = false;
    if (e.code === 'Space') {
        if (plungerCharging) {
            releasePlunger();
        }
    }
});

// ポインターイベントによる確実なボタン・画面タッチ操作
const setupPointerButton = (id, actionType) => {
    const btn = document.getElementById(id);
    
    const press = (e) => {
        e.preventDefault();
        btn.classList.add('active');
        if (actionType === 'left') leftFlipper.pressed = true;
        if (actionType === 'right') rightFlipper.pressed = true;
        if (actionType === 'launch') {
            if (gameState === 'READY') {
                plungerCharging = true;
            } else if (gameState === 'GAMEOVER') {
                restartGame();
            }
        }
    };

    const release = (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        if (actionType === 'left') leftFlipper.pressed = false;
        if (actionType === 'right') rightFlipper.pressed = false;
        if (actionType === 'launch') {
            if (plungerCharging) {
                releasePlunger();
            }
        }
    };

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
};

setupPointerButton('leftBtn', 'left');
setupPointerButton('rightBtn', 'right');
setupPointerButton('launchBtn', 'launch');

// キャンバス自体のタッチ/クリック操作（画面左右タップでフリッパー、READY時は発射）
canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (gameState === 'READY') {
        if (x > 380 || y > 500) {
            plungerCharging = true;
        }
    } else if (gameState === 'GAMEOVER') {
        restartGame();
    } else {
        // 画面左半分なら左フリッパー、右半分なら右フリッパー
        if (x < canvas.width / 2) {
            leftFlipper.pressed = true;
        } else {
            rightFlipper.pressed = true;
        }
    }
});

canvas.addEventListener('pointerup', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    
    if (plungerCharging) {
        releasePlunger();
    }
    
    if (x < canvas.width / 2) {
        leftFlipper.pressed = false;
    } else {
        rightFlipper.pressed = false;
    }
});

canvas.addEventListener('pointerleave', () => {
    leftFlipper.pressed = false;
    rightFlipper.pressed = false;
    if (plungerCharging) releasePlunger();
});

function releasePlunger() {
    plungerCharging = false;
    if (gameState === 'READY') {
        ball.vy = -Math.max(plungerPower, 15);
        plungerPower = 0;
        gameState = 'PLAYING';
    }
}

function restartGame() {
    score = 0;
    ballsLeft = 3;
    ballValElem.textContent = ballsLeft;
    resetBall();
}

function resetBall() {
    ball.x = 412;
    ball.y = 570;
    ball.vx = 0;
    ball.vy = 0;
    gameState = 'READY';
    plungerPower = 0;
    plungerCharging = false;
}

function triggerShake(intensity, duration) {
    shakeIntensity = intensity;
    shakeTimer = duration;
}

function update() {
    if (plungerCharging) {
        plungerPower = Math.min(plungerPower + 0.7, 28);
    }

    if (gameState === 'PLAYING') {
        ball.vy += ball.gravity;
        ball.vx *= ball.friction;
        ball.vy *= ball.friction;

        let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        if (speed > ball.maxSpeed) {
            ball.vx = (ball.vx / speed) * ball.maxSpeed;
            ball.vy = (ball.vy / speed) * ball.maxSpeed;
            speed = ball.maxSpeed;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        // フリッパー回転
        if (leftFlipper.pressed) {
            leftFlipper.angle = Math.max(leftFlipper.angle - 0.28, leftFlipper.baseAngle + leftFlipper.maxAngle);
        } else {
            leftFlipper.angle = Math.min(leftFlipper.angle + 0.16, leftFlipper.baseAngle);
        }

        if (rightFlipper.pressed) {
            rightFlipper.angle = Math.min(rightFlipper.angle + 0.28, rightFlipper.baseAngle + rightFlipper.maxAngle);
        } else {
            rightFlipper.angle = Math.max(rightFlipper.angle - 0.16, rightFlipper.baseAngle);
        }

        checkFlipperCollision(leftFlipper, -1);
        checkFlipperCollision(rightFlipper, 1);

        bumpers.forEach(b => {
            if (b.pulse > 0) b.pulse--;
            let dx = ball.x - b.x;
            let dy = ball.y - b.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ball.radius + b.radius) {
                let nx = dx / dist;
                let ny = dy / dist;
                let dot = ball.vx * nx + ball.vy * ny;
                ball.vx = (ball.vx - 2 * dot * nx) * 1.18 + nx * 5;
                ball.vy = (ball.vy - 2 * dot * ny) * 1.18 + ny * 5;
                
                ball.x = b.x + nx * (b.radius + ball.radius);
                ball.y = b.y + ny * (b.radius + ball.radius);

                score += b.score;
                b.pulse = 12;
                triggerShake(5, 8);
            }
        });

        slingshots.forEach(s => {
            let cx = (s.x1 + s.x2) / 2;
            let cy = (s.y1 + s.y2) / 2;
            let dx = ball.x - cx;
            let dy = ball.y - cy;
            if (Math.abs(dx) < 25 && Math.abs(dy) < 40) {
                ball.vx += s.normal.x * 7;
                ball.vy += s.normal.y * 7;
                score += 500;
                triggerShake(3, 5);
            }
        });

        walls.forEach(w => {
            let collision = lineIntersection(w.x1, w.y1, w.x2, w.y2, ball.x, ball.y, ball.radius);
            if (collision.hit) {
                let nx = collision.nx;
                let ny = collision.ny;
                let dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) {
                    ball.vx = (ball.vx - 1.8 * dot * nx) * ball.restitution;
                    ball.vy = (ball.vy - 1.8 * dot * ny) * ball.restitution;
                }
                ball.x = collision.x;
                ball.y = collision.y;
            }
        });

        if (ball.y > 670) {
            ballsLeft--;
            ballValElem.textContent = ballsLeft;
            if (ballsLeft <= 0) {
                gameState = 'GAMEOVER';
            } else {
                resetBall();
            }
        }
    }
}

function lineIntersection(x1, y1, x2, y2, bx, by, r) {
    let A = bx - x1;
    let B = by - y1;
    let C = x2 - x1;
    let D = y2 - y1;
    let lenSq = C * C + D * D;
    let param = lenSq !== 0 ? (A * C + B * D) / lenSq : -1;
    let xx, yy;
    if (param < 0) { xx = x1; yy = y1; }
    else if (param > 1) { xx = x2; yy = y2; }
    else { xx = x1 + param * C; yy = y1 + param * D; }

    let dx = bx - xx;
    let dy = by - yy;
    let distSq = dx * dx + dy * dy;
    if (distSq < r * r) {
        let dist = Math.sqrt(distSq);
        let nx = dist > 0 ? dx / dist : 0;
        let ny = dist > 0 ? dy / dist : 0;
        return { hit: true, x: xx + nx * r, y: yy + ny * r, nx: nx, ny: ny };
    }
    return { hit: false };
}

function checkFlipperCollision(flipper, side) {
    let tipX = flipper.x + Math.cos(flipper.angle) * flipper.length;
    let tipY = flipper.y + Math.sin(flipper.angle) * flipper.length;
    let collision = lineIntersection(flipper.x, flipper.y, tipX, tipY, ball.x, ball.y, ball.radius);
    if (collision.hit) {
        let nx = collision.nx;
        let ny = collision.ny;
        let dot = ball.vx * nx + ball.vy * ny;
        let paddleBoost = flipper.pressed ? 1.5 : 1.2; 
        ball.vx = (ball.vx - (1 + ball.restitution) * dot * nx) * paddleBoost + (flipper.pressed ? side * 5 : 0);
        ball.vy = (ball.vy - (1 + ball.restitution) * dot * ny) * paddleBoost - (flipper.pressed ? 6 : 0);
        ball.x = collision.x;
        ball.y = collision.y;
        score += 100;
        triggerShake(3, 5);
    }
}

function draw() {
    ctx.save();
    if (shakeTimer > 0) {
        shakeTimer--;
        let sx = (Math.random() - 0.5) * shakeIntensity;
        let sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }

    ctx.fillStyle = '#0f381f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = '24px serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fillText('♠', 70, 150);
    ctx.fillText('♥', 350, 220);
    ctx.fillText('♦', 100, 480);
    ctx.fillText('♣', 340, 450);

    bumpers.forEach(b => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius + (b.pulse > 0 ? 5 : 0), 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = b.pulse > 0 ? 30 : 10;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffd700';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#111';
        ctx.fill();
        ctx.restore();
    });

    ctx.fillStyle = '#cc3333';
    slingshots.forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.lineTo((s.x1+s.x2)/2 + (s.normal.x * -20), (s.y1+s.y2)/2 + (s.normal.y * -20));
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffd700';
        ctx.stroke();
    });

    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffd700';
    walls.forEach(w => {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
    });

    drawFlipper(leftFlipper);
    drawFlipper(rightFlipper);

    // プランジャーレーン
    ctx.fillStyle = '#8b6508';
    ctx.fillRect(395, 520, 25, 120 + (plungerCharging ? plungerPower : 0));
    ctx.strokeStyle = '#ffd700';
    ctx.strokeRect(395, 520, 25, 120);

    // ボール
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    let grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.radius);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.4, '#ffd700');
    grad.addColorStop(1, '#ff8c00');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff4500';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();

    let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    let mach = (speed / 3.5).toFixed(1);
    scoreValElem.textContent = score;
    machValElem.textContent = `MACH ${mach}`;

    if (mach >= 3.0) {
        machValElem.style.color = '#ff0055';
        machValElem.style.textShadow = '0 0 8px #ff0055';
    } else if (mach >= 1.0) {
        machValElem.style.color = '#00ffcc';
        machValElem.style.textShadow = '0 0 8px #00ffcc';
    } else {
        machValElem.style.color = '#ffd700';
        machValElem.style.textShadow = 'none';
    }

    if (gameState === 'READY') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(40, 270, 360, 90);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffd700';
        ctx.strokeRect(40, 270, 360, 90);

        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LAUNCHボタン長押しで発射！', 220, 305);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('画面左右タップでもフリッパーが動くよ', 220, 335);
        ctx.textAlign = 'left';
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(30, 220, 380, 190);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ff0055';
        ctx.strokeRect(30, 220, 380, 190);

        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 220, 270);
        ctx.fillStyle = '#ffd700';
        ctx.font = '18px sans-serif';
        ctx.fillText(`最終スコア: ${score}`, 220, 315);
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('LAUNCHボタンまたは画面タップで再挑戦！', 220, 355);
        ctx.textAlign = 'left';
    }

    if (mach >= 1.0 && gameState === 'PLAYING') {
        ctx.save();
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = mach >= 3.0 ? '#ff0055' : '#00ffcc';
        ctx.textAlign = 'center';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        ctx.fillText(mach >= 3.0 ? '🔥 超音速マッハ3突破！！ 🔥' : '⚡ 音速 (MACH 1) 突破！！ ⚡', 220, 60);
        ctx.restore();
    }
}

function drawFlipper(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.angle);
    ctx.beginPath();
    ctx.roundRect(0, -8, f.length, 16, 8);
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#d4af37';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetBall();
loop();
</script>
</body>
</html>
