<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホテトリス (Mobile Tetris)</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 20px;
            letter-spacing: 2px;
            color: #4ea8de;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #333;
            max-width: 320px;
            width: 100%;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }
        .info-box {
            background: #2a2a2a;
            padding: 5px 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #3a3a3a;
            flex: 1;
            margin: 0 3px;
        }
        .info-box h2 {
            font-size: 9px;
            margin: 0 0 2px 0;
            color: #aaa;
        }
        .info-box p {
            font-size: 14px;
            margin: 0;
            font-weight: bold;
            color: #fff;
        }
        canvas {
            border: 2px solid #444;
            background-color: #000;
            display: block;
            margin-bottom: 10px;
        }
        .btn-start {
            background-color: #4ea8de;
            color: #000;
            border: none;
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-start:hover {
            background-color: #90e0ef;
        }
        /* バーチャルパッドのスタイル */
        .virtual-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }
        .v-btn {
            background-color: #2b2d42;
            color: #edf2f4;
            border: 1px solid #8d99ae;
            border-radius: 8px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .v-btn:active {
            background-color: #8d99ae;
            color: #2b2d42;
        }
        .v-btn.wide {
            grid-column: span 3;
            padding: 10px 0;
            background-color: #d90429;
            border-color: #ef233c;
            color: white;
        }
        .v-btn.wide:active {
            background-color: #ef233c;
        }
    </style>
</head>
<body>

    <h1>スマホテトリス</h1>
    <div class="game-container">
        <div class="header-info">
            <div class="info-box">
                <h2>SCORE</h2>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h2>LINES</h2>
                <p id="lines">0</p>
            </div>
            <div class="info-box">
                <h2>LEVEL</h2>
                <p id="level">1</p>
            </div>
        </div>

        <!-- 10x20 canvas -->
        <canvas id="tetris" width="200" height="400"></canvas>

        <button class="btn-start" id="start-btn">ゲームスタート / リセット</button>

        <!-- バーチャルパッド -->
        <div class="virtual-pad">
            <button class="v-btn" id="btn-left">←</button>
            <button class="v-btn" id="btn-rotate">↻</button>
            <button class="v-btn" id="btn-right">→</button>
            <button class="v-btn" id="btn-drop">↓</button>
            <button class="v-btn wide" id="btn-harddrop">ハードドロップ (一気に落とす)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0,
            level: 1,
        };

        const colors = [
            null,
            '#ff0054',
            '#3a86ff',
            '#06d6a0',
            '#ffbe0b',
            '#8338ec',
            '#fb8500',
            '#ff5964',
        ];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 1, 0],
                    [1, 1, 1],
                    [0, 0, 0],
                ];
            } else if (type === 'O') {
                return [
                    [2, 2],
                    [2, 2],
                ];
            } else if (type === 'L') {
                return [
                    [0, 0, 3],
                    [3, 3, 3],
                    [0, 0, 0],
                ];
            } else if (type === 'J') {
                return [
                    [4, 0, 0],
                    [4, 4, 4],
                    [0, 0, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 0, 0, 0],
                    [5, 5, 5, 5],
                    [0, 0, 0, 0],
                    [0, 0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [7, 7, 0],
                    [0, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        context.lineWidth = 0.05;
                        context.strokeStyle = '#000';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }

            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            player.pos.y = 0;
            player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);
            
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.lines = 0;
                player.level = 1;
                updateScore();
                alert('ゲームオーバー！');
            }
        }

        function playerRotate(dir) {
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 100 * player.level;
                player.lines++;
                rowCount *= 2;

                player.level = Math.floor(player.lines / 5) + 1;
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isRunning = false;

        function update(time = 0) {
            if (!isRunning) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval / player.level) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('lines').innerText = player.lines;
            document.getElementById('level').innerText = player.level;
        }

        // キーボード操作
        document.addEventListener('keydown', event => {
            if (!isRunning) return;

            if (event.keyCode === 37) {
                playerMove(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 38) {
                playerRotate(1);
            } else if (event.keyCode === 32) {
                playerHardDrop();
            }
        });

        // バーチャルパッド操作 (タッチ＆クリック対応)
        document.getElementById('btn-left').addEventListener('click', () => { if(isRunning) playerMove(-1); });
        document.getElementById('btn-right').addEventListener('click', () => { if(isRunning) playerMove(1); });
        document.getElementById('btn-rotate').addEventListener('click', () => { if(isRunning) playerRotate(1); });
        document.getElementById('btn-drop').addEventListener('click', () => { if(isRunning) playerDrop(); });
        document.getElementById('btn-harddrop').addEventListener('click', () => { if(isRunning) playerHardDrop(); });

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            updateScore();
            playerReset();
            isRunning = true;
            lastTime = performance.now();
            update();
            startBtn.blur();
        });

        draw();
    </script>
</body>
</html>
