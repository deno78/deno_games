<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ビンゴマシーン・観衆全員クリア大作戦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1p', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-bounce-short {
            animation: bounce-short 1.5s infinite;
        }
        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-2 h-screen select-none">

    <!-- ヘッダー -->
    <header class="w-full text-center py-1 bg-white/10 backdrop-blur-md rounded-xl shadow border border-white/20">
        <h1 class="text-lg md:text-2xl font-black text-yellow-300 drop-shadow">🎰 ビンゴマシーン大作戦 🎪</h1>
        <div class="flex justify-center gap-4 text-xs text-purple-200 mt-0.5">
            <div>残り回数: <span id="turns-left" class="text-yellow-400 font-bold text-sm">10</span>回</div>
            <div>クリア: <span id="cleared-count" class="text-green-400 font-bold">0</span> / 4人</div>
        </div>
    </header>

    <!-- メインステージ：観衆エリア (4人コンパクト) -->
    <main class="w-full grid grid-cols-2 gap-2 my-auto px-1">
        <!-- JavaScriptで観衆カードを動的生成 -->
        <div id="audience-container" class="contents"></div>
    </main>

    <!-- コントロールエリア (1〜20ナンバーパッド) -->
    <div class="bg-slate-900/90 backdrop-blur-md border border-purple-500/30 rounded-2xl p-2 shadow-xl flex flex-col gap-1.5 mb-1">
        <div class="text-[11px] font-bold text-center text-indigo-300">数字を宣言してください (1〜20)</div>
        <div class="grid grid-cols-10 gap-1" id="number-pad">
            <!-- 1〜20のボタン (2行で10個ずつ、あるいは4列×5行など、コンパクトに) -->
        </div>
        <div class="flex justify-center mt-1">
            <button onclick="initGame()" class="px-4 py-1 bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold rounded-lg shadow text-xs active:scale-95 transition">
                🔄 最初からやり直す
            </button>
        </div>
    </div>

    <!-- 結果モーダル -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border-2 border-yellow-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl pop-in">
            <div id="modal-icon" class="text-5xl mb-2">🎉</div>
            <h2 id="modal-title" class="text-xl font-black text-yellow-300 mb-1">ゲームクリア！</h2>
            <p id="modal-desc" class="text-slate-300 text-xs mb-4">観衆全員がビンゴを達成しました！</p>
            <button onclick="initGame()" class="w-full py-2.5 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black rounded-xl shadow text-sm active:scale-95 transition">
                もう一度遊ぶ
            </button>
        </div>
    </div>

    <script>
        // 観衆データ定義 (4人)
        const audienceData = [
            { name: "アリス", avatar: "👧", color: "from-pink-500/20 to-purple-500/20", border: "border-pink-500/40" },
            { name: "ボブ", avatar: "👦", color: "from-blue-500/20 to-cyan-500/20", border: "border-blue-500/40" },
            { name: "チャーリー", avatar: "🧑", color: "from-emerald-500/20 to-teal-500/20", border: "border-emerald-500/40" },
            { name: "ダイアナ", avatar: "👩", color: "from-amber-500/20 to-orange-500/20", border: "border-amber-500/40" }
        ];

        let gameState = {
            turnsLeft: 10,
            calledNumbers: new Set(),
            audiences: [],
            isGameOver: false
        };

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateCard() {
            const nums = shuffle([...Array(20).keys()].map(i => i + 1)).slice(0, 9);
            return nums.map(n => ({ number: n, marked: false }));
        }

        function checkBingo(card) {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // 行
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // 列
                [0, 4, 8], [2, 4, 6]            // 斜め
            ];
            return lines.some(line => line.every(idx => card[idx].marked));
        }

        function initGame() {
            gameState.turnsLeft = 10;
            gameState.calledNumbers.clear();
            gameState.isGameOver = false;

            gameState.audiences = audienceData.map((data, index) => {
                const card = generateCard();
                return {
                    id: index,
                    ...data,
                    card: card,
                    cleared: false
                };
            });

            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('flex');

            renderUI();
        }

        function callNumber(num) {
            if (gameState.isGameOver || gameState.turnsLeft <= 0 || gameState.calledNumbers.has(num)) return;

            gameState.calledNumbers.add(num);
            gameState.turnsLeft--;

            gameState.audiences.forEach(aud => {
                if (aud.cleared) return;

                aud.card.forEach(cell => {
                    if (cell.number === num) {
                        cell.marked = true;
                    }
                });

                if (checkBingo(aud.card)) {
                    aud.cleared = true;
                }
            });

            renderUI();
            checkGameEnd();
        }

        function checkGameEnd() {
            const allCleared = gameState.audiences.every(a => a.cleared);

            if (allCleared) {
                gameState.isGameOver = true;
                showModal(true);
            } else if (gameState.turnsLeft <= 0) {
                gameState.isGameOver = true;
                showModal(false);
            }
        }

        function showModal(isWin) {
            const modal = document.getElementById('result-modal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');

            if (isWin) {
                icon.textContent = "🏆";
                title.textContent = "大成功！ゲームクリア！";
                title.className = "text-xl font-black text-yellow-300 mb-1";
                desc.textContent = "10ターン以内に観衆全員をビンゴさせました！";
            } else {
                icon.textContent = "😢";
                title.textContent = "ゲームオーバー…";
                title.className = "text-xl font-black text-rose-400 mb-1";
                desc.textContent = "宣言回数がなくなってしまいました…！";
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function renderUI() {
            document.getElementById('turns-left').textContent = gameState.turnsLeft;
            const clearedCount = gameState.audiences.filter(a => a.cleared).length;
            document.getElementById('cleared-count').textContent = clearedCount;

            const audienceContainer = document.getElementById('audience-container');
            audienceContainer.innerHTML = '';

            gameState.audiences.forEach(aud => {
                let statusBadge = '';
                if (aud.cleared) {
                    statusBadge = `<span class="bg-green-500 text-slate-950 font-black text-[10px] px-1.5 py-0.2 rounded-full animate-bounce-short">✨ BINGO! ✨</span>`;
                } else {
                    statusBadge = `<span class="text-[10px] text-slate-300">進行中</span>`;
                }

                const cardHtml = `
                    <div class="bg-gradient-to-b ${aud.color} border ${aud.border} rounded-xl p-2 flex flex-col items-center justify-between shadow backdrop-blur-sm">
                        <!-- アバター ＆ 名前 -->
                        <div class="flex items-center gap-1.5 w-full justify-between mb-1">
                            <div class="flex items-center gap-1">
                                <span class="text-lg">${aud.avatar}</span>
                                <span class="font-bold text-xs text-white">${aud.name}</span>
                            </div>
                            ${statusBadge}
                        </div>

                        <!-- 3x3 ビンゴカード (コンパクト) -->
                        <div class="w-full bg-slate-900/70 rounded-lg p-1.5 border border-white/10">
                            <div class="grid grid-cols-3 gap-1">
                                ${aud.card.map(c => {
                                    let bg = "bg-slate-800 text-slate-300";
                                    if (c.marked) bg = "bg-yellow-400 text-slate-950 font-black shadow-sm";
                                    else if (gameState.calledNumbers.has(c.number)) bg = "bg-purple-600/40 text-purple-200";
                                    return `<div class="aspect-square rounded flex items-center justify-center text-xs ${bg}">
                                        ${c.marked ? '✓' : (gameState.calledNumbers.has(c.number) ? '•' : '•')}
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
                audienceContainer.insertAdjacentHTML('beforeend', cardHtml);
            });

            // ナンバーパッド (1〜20、2行×10列または5列×4行。横に10個並べるとスマホで小さいので2行×10列)
            const numberPad = document.getElementById('number-pad');
            numberPad.innerHTML = '';

            for (let i = 1; i <= 20; i++) {
                const isCalled = gameState.calledNumbers.has(i);
                let btnClass = "bg-slate-800 hover:bg-purple-600/40 text-purple-200 border-purple-500/30";
                if (isCalled) {
                    btnClass = "bg-slate-700/30 text-slate-600 border-slate-800 line-through cursor-not-allowed opacity-40";
                }

                const btn = document.createElement('button');
                btn.className = `py-1.5 rounded-lg border font-bold text-xs transition active:scale-95 shadow ${btnClass}`;
                btn.textContent = i;
                btn.disabled = isCalled || gameState.isGameOver;
                btn.onclick = () => callNumber(i);
                numberPad.appendChild(btn);
            }
        }

        initGame();
    </script>
</body>
</html>
